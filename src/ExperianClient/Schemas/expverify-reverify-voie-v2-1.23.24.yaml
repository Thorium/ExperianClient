swagger: '2.0'
info:
  version: 2.0.0
  title: ExpVerify Reverify VOIE (Instant)
  description: >-
     This document consists of unencrypted version of Experian Verify service endpoints. Used for Mortgage use cases only. This report type shares the same Swagger as Experian Verify Premium but should be initiated within 180 days of the initial Premium or Core report pull. Returns the two most recent payroll records found (regardless of work status) within the last 90 days and the last payroll record from every employer found within the current year and two previous calendar years.
host: sandbox-us-api.experian.com
basePath: /consumerservices/verification/v2
securityDefinitions:
  OauthSecurity:
    type: oauth2
    flow: password
    tokenUrl: 'https://sandbox-us-api.experian.com/oauth2/v1/token'
    scopes:
      admin: admin scope
      user: user scope
schemes:
  - https
paths:
  '/experianverify':
    post:
      description: >-
        Returns the two most recent payroll records* found (regardless of work status) within the last 90 days and the last payroll record from every employer found within the current year and two previous calendar years. *Will include pay deductions and deposit information if available.
      summary: Experian Verify income and employment report
      operationId: get income and employment data
      tags:
        - Consumer Services
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: clientReferenceId
          in: header
          required: true
          description: >-
            API client generated reference Id to uniquely identify the transaction.
          type: string
        - name: Content-Type
          in: header
          required: true
          type: string
          description: Input Request format
          enum:
            - application/json
          default: application/json
        - name: Accept
          in: header
          required: true
          type: string
          description: Output Response format
          enum:
            - application/json
          default: application/json
        - name: subcode
          in: header
          required: true
          type: string
          description: unique value provided by experian at onboarding
        - name: body
          in: body
          description: >-
            Consumer's PII , Requestor Information, Addons and any custom
            options to be specified here.
          required: true
          schema:
            $ref: '#/definitions/voieRequestParams'
      responses:
        '200':
          description: API responds with a JSON.
          schema:
            $ref: '#/definitions/voieResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id, if provided on API request header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id, if provided on API request header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/AuthenticationErrorResponse'

        '403':
          description: Forbidden.
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id, if provided on API request header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id, if provided on API request header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '405':
          description: Method not Allowed
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id, if provided on API request header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '406':
          description: Not Acceptable
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id, if provided on API request header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '415':
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id, if provided on API request header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '429':
          description: Too many requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: bad gateway.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '503':
          description: Service Unavailable.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '504':
          description: Gateway Timeout.
          schema:
            $ref: '#/definitions/ErrorResponse'
definitions:
  voieRequestParams:
    type: object
    description: voie Request Body
    required:
      - consumerPii
      - requestor
      - reportType
      - permissiblePurpose
    properties:
      consumerpii:
        $ref: '#/definitions/PII'
      requestor:
        $ref: '#/definitions/Requestor'
      permissiblePurpose:
        $ref: '#/definitions/PermissiblePurpose'
      resellerInfo:
        $ref: '#/definitions/ResellerInfo'
      reportType:
        type: string
        description: Type of verification report
        enum:
          - ExpVerify-Reverify-VOIE
        default: ExpVerify-Reverify-VOIE
      vendorData:
        $ref: '#/definitions/VendorData'
      customOptions:
        $ref: '#/definitions/CustomOptions'
      reportCustomLabels:
        $ref: '#/definitions/reportCustomLabels'
  reportCustomLabels:
     type: object
     properties:
      label1:
        $ref: '#/definitions/label1'
      label2:
        $ref: '#/definitions/label2'
      label3:
        $ref: '#/definitions/label3'
      label4:
        $ref: '#/definitions/label4'
      label5:
        $ref: '#/definitions/label5'

  label1:
    type: object
    description : custom label 1
    properties:
      name:
        type: string
        description: Name of custom inquiry tag. For Mortgage, if Loan Number is a Custom Label, it is recommended to be placed in label1.
      value:
        type: string
        description: Value paired with named inquiry tag. For Mortgage, place Loan Number value here if Loan Number is the Custom Label in label1 name.
  label2:
    type: object
    description : custom label 2
    properties:
      name:
        type: string
        description: Name of custom inquiry tag
      value:
        type: string
        description: Value paired with named inquiry tag
  label3:
    type: object
    description : custom label 3
    properties:
      name:
        type: string
        description: Name of custom inquiry tag
      value:
        type: string
        description: Value paired with named inquiry tag

  label4:
    type: object
    description: custom label 4
    properties:
      name:
        type: string
        description: Name of custom inquiry tag
      value:
        type: string
        description: Value paired with named inquiry tag

  label5:
    type: object
    description : custom label 5
    properties:
      name:
        type: string
        description: Name of custom inquiry tag
      value:
        type: string
        description: Value paired with named inquiry tag

  PermissiblePurpose:
    type: object
    description: >-
      Provided by an Experian representative during the Experian Verify on-boarding process
    required:
      - type
    properties:
      type:
        type: string
        description: >-
          Permissible Purpose Type Code. 2 digits containing the account type
          code only.
        default: '18'

  PII:
    type: object
    description: Personally Identifiable Information
    properties:
      applicantInformation:
        $ref: '#/definitions/Applicant'
    required:
      - applicantInformation
  PAName:
    type: object
    description: Consumer's Name
    properties:
      lastName:
        type: string
        description: >-
          The full applicant's surname is required. If the surname contains two
          surnames, then split the surnames with a hyphen (e.g., Smith-Jones).
          The surname can also be input with an apostrophe (e.g., O'Brien),
          although apostrophe usage is limited to the letters D, L, and O.
        default: CONSUMER
      firstName:
        type: string
        description: >-
          The full first name is required. The minimum entry is the first name
          initial. Blanks and special characters (except dash) are not allowed.
          Compound names should contain a dash (e.g., Billy-Bob).
        default: JOHN
      middleName:
        type: string
        description: >-
          The full middle name should be entered when available. A middle
          initial is acceptable. Blanks and special characters are not allowed.
          Omit if the middle name is not available.
        default: QUINCY
      generationCode:
        type: string
        description: Generation Code
        default: ""
    required:
      - firstName
      - lastName
  Address:
    type: object
    description: Consumer's Address
    properties:
      line1:
        type: string
        description: Address Line 1
        default: '10655 N BIRCH ST'
      line2:
        type: string
        description: Address Line 2
      line3:
        type: string
        description: Address Line 2
        default: ' '
      city:
        type: string
        description: City
        default: BURBANK
      state:
        type: string
        description: State
        default: CA
      zipCode:
        type: string
        description: Zip Code
        default: '915021234'
    required:
      - zipCode
      - line1
      - city
      - state
  DOB:
    type: object
    description: Consumer's Date of Birth
    properties:
      dob:
        type: string
        description: >-
          Year Of Birth or Date of Birth. This describes year of birth of the
          primary applicant. It must 8 (MMDDYYYY) digits.
        default: '10181955'
    required:
      - dob
  SSN:
    type: object
    description: Consumer's Social Security Number
    properties:
      ssn:
        type: string
        description: Full Social Security number should be entered. The social may be input with or without hyphens (e.g., 123456789 or 123-45-6789).
        default: '123456789'
    required:
      - ssn
  Phone:
    type: object
    description: Consumer's Phone
    properties:
      number:
        type: string
        description: Consists of 10 digits (3-digit prefix, and 7-digit number) and may contain embedded hyphens, parentheses, or periods. 
        default: 818.555.1111
      type:
        type: string
        description: One-digit phone type code (optional). The valid Phone Type codes are Residential = R Business = B Institution = I Fax = F Cellular = C Pay Phone = T
        default: R
  Applicant:
    type: object
    description: Applicant Information to get voie
    properties:
      name:
        $ref: '#/definitions/PAName'
      ssn:
        $ref: '#/definitions/SSN'
      dob:
        $ref: '#/definitions/DOB'
      phone:
        type: array
        items:
          $ref: '#/definitions/Phone'
      currentAddress:
        $ref: '#/definitions/Address'
    required:
      - name
      - dob
      - ssn
      - currentAddress
  Requestor:
    type: object
    description: Information on the API requestor
    properties:
      subscriberCode:
        type: string
        description: Subscriber Number assigned by Experian
        default: '5991764'
      verifierName:
        type: string
        description: the company name of verifier (ex. the name of the lender)
        default: 'ABC company'
    required:
      - subscriberCode
      - verifierName
  VendorData:
    type: object
    description: >-
      Optional field. To understand whose application the client is using to send in the inquiry - Vendor, 3rd Party, Reseller, or client home grown.
    properties:
      vendorNumber:
        type: string
        description: Required. Vendor Number assigned by Experian at set up time. Alpha-numeric. Must be 3 Character long.
        default: 1.00
      vendorVersion:
        type: string
        description: Optional. Vendor’s Application version. Alpha-numeric with dot(.). Max length is 6.
  ResellerInfo:
    type: object
    description : End User Identification. Resellers must enter the name of the end user if not already identified in the client’s subcode. 
    properties:
      endUserName:
        type: string
        description: reseller endusername
  CustomOptions:
    type: object
    description: >-
      Ancillary Options such as ICRAA (Client custom options if any that have been setup) that can be requested by client. When Custom Options are provided, customOptions and optionID tags are required.
    properties:
      optionId:
        type: array
        items:
          type: string
          description: Value= “ICRAA” (not case sensitive)ICRAA = Investigative Consumer Reporting Agencies Act ICRAA regulates the use of consumer reports for employment, insurance and rental property decisions where the consumer is located in California, the place of employment is located in California or the subject of the insurance coverage is located in California or the rental property is located in California, OR the employment, insurance or rental decision is made in California.  If an Experian Verify request is subject to ICRAA, provide “ICRAA” as the CustomOption upon inquiry.
                      Value= “filterOff” (not case sensitive)If this value is sent in customOptions, the following report logic will be lifted
                    •  Will search pay beyond 90 days (default)
                    •  Will return all work statuses
                    •  Will lift all existing business logic for data checks.
                    This will return the data as received from the data provider.

  voieResponse:
    type: object
    properties:
      expVerifyReport:
        $ref: '#/definitions/consumerReportResponse'
      incomeReport:
        $ref: '#/definitions/consumerReportResponse'
      pdfbytes:
        type: string
        description: pdf bytes array base 64 encoding
  consumerReportResponse:
    type: object
    description: Response information for consumer body
    properties:
      reportId:
        type: string
        description: unique id given to consumer report
      reportType:
        type: string
        description: type of verification report client
        enum:
          - ExpVerify-Reverify-VOIE
        default: ExpVerify-Reverify-VOIE
      reportGeneratedDate:
        type: string
        description: report created date by experian (unixtimestamp)
      requestor:
        $ref: '#/definitions/Requestor'
      resellerInfo:
        $ref: '#/definitions/ResellerInfo'
      reportCustomLabels:
        $ref: '#/definitions/reportCustomLabels'
      consumerPii:
        $ref: '#/definitions/PIIList'
  PIIList:
    type: object
    description: Personally Identifiable Information
    properties:
      applicantInformation:
        $ref: '#/definitions/ApplicantResponse'
      employmentHistory:
        type: array
        description : contains consumers employer information
        items:
          $ref: '#/definitions/employmentHistoryList'
  PANameResponse:
    type: object
    description: Consumer's Name
    properties:
      lastName:
        type: string
        description: >-
          Last Name given in data provider report
      firstName:
        type: string
        description: >-
          First Name given in data provider report
      middleName:
        type: string
        description: >-
          Middle Name given in data provider report
      generationCode:
        type: string
        description: Generation Code
        default: ""
  SSNResponse:
    type: object
    description: Consumer's Social Security Number
    properties:
      ssn:
        type: string
        description: Social Security Number

  DOBResponse:
    type: object
    description: Consumer's Date of Birth
    properties:
      dob:
        type: string
        description: date of birth

  ApplicantResponse:
    type: object
    description: Applicant Information to get voie
    properties:
      name:
        $ref: '#/definitions/PANameResponse'
      ssn:
        $ref: '#/definitions/SSNResponse'
      dob:
        $ref: '#/definitions/DOBResponse'
      phone:
        type: array
        items:
          $ref: '#/definitions/Phone'
      currentAddress:
        $ref: '#/definitions/Address'
    required:
      - name
      - dob
      - ssn
      - currentAddress
  totalAnnualRemunerationList:
    type: object
    description: contains employment history details
    properties:
      year:
        type: number
        format: double
        description: payroll year
      payAmountYTD:
        $ref: '#/definitions/YTDLIST'
      deductionsAmountYTD:
        type: number
        format: double
        description: deduction YTD for the pay year
        default: 12.12

  YTDLIST:
    type: object
    description: contains list of consumers individual paycheck deposit details
    properties:
      grossPayYTD:
        type: number
        format: double
        description: Gross Pay YTD for this pay year
        default: "3000.85"
      basePayYTD:
        type: number
        format: double
        description: Gross Pay YTD for this pay year
        default: "3000.85"
      overtimePayYTD:
        type: number
        format: double
        description: Gross Pay YTD for this pay year
        default: "3000.85"
      bonusPayYTD:
        $ref: '#/definitions/YTDbonusesList'
      otherPayYTD:
        $ref: '#/definitions/YTDotherPayAmountList'
      3pspAmountYTD:
        type: number
        format: double
        description: 3Psp YTD amount f
        default: 100.01

  YTDotherPayAmountList:
    type: object
    description : Bonus for this pay period
    properties:
      otherTotalPayYTD:
        type: number
        format: double
        description: otherTotalPayYTD this year
        default: 3000.85
      otherPayDetailsYTD:
        items:
          $ref: '#/definitions/YTDOtherPayDetailsListItem'

  YTDOtherPayDetailsListItem:
    type: object
    description: YTD other pay components details for this remuneration pay year
    properties:
      name:
        type: string
      amount:
        type: string


  YTDbonusesList:
    type: object
    description: Bonus for this pay period
    properties:
      bonusTotalPayYTD:
        type: number
        format: double
        description: bonusTotalPayYTD Amount
        default: 3000.85
      bonusPayDetailsYTD:
        items:
          $ref: '#/definitions/YTDbonusesListItem'

  YTDbonusesListItem:
    type: object
    description: YTD bonus components details for this remuneration pay year
    properties:
      name:
        type: string
      amount:
        type: string

  employmentHistoryList:
    type: object
    description: contains employment history details
    properties:
      asOfDate:
        type: string
        description: Date on which the employer record was last updated
      originReportId:
        type: string
        description: Unique id provided by data provider
      originSourceId:
        type: string
        description: Internal use only – will be returned as a null value 
      employerIdentificationNumber:
        type: string
        description: Federal employer Identification Number (FEIN)
      employerName:
        type: string
        description: Employer’s name
      originalHireDate:
        type: string
        description: date on which employee was hired. ex 01012009 (MMDDYYYY) 8 digits. 
      mostRecentHireDate :
        type: string
        description: most recent date on which employee was hired. ex 01012009 (MMDDYYYY) 8 digits.
      positionEndDate:
        type: string
        description: Date on which employee left employer. ex 01012009 (MMDDYYYY) 8 digits.
        default: string
      positionTitle:
        type: string
        description: Job title or type of business
        default: string
      positionTenure:
        type: string
        description: Duration of employment within position. Format will be returned in ISO 8601. ex P3Y6M4D represents a duration of three years, six months, four days.
        default: "P2Y11M9D"
      currencyCode:
        type: string
        description: currency code for this employer
        default: "USD"
      employerAddress:
        $ref: '#/definitions/employerAddressFields'
      employmentStatus:
        $ref: '#/definitions/employmentstatus'
      workStatus:
        $ref: '#/definitions/workstatus'
      paymentHistory:
        $ref: '#/definitions/paymentHistoryList'
      totalAnnualRemuneration:
        type: array
        description : contains consumers employer information
        items:
          $ref: '#/definitions/totalAnnualRemunerationList'
      employerDisclaimers :
        type: string
        description: >-
          Employer-provided disclaimers will appear if available. Disclaimers can be returned as a larger text data up to 4k.

  deductionCodeList:
    type: object
    description: deposit details
    properties:
      name:
        type: string
        description: deposited amount for the pay period
        default: "Federal tax"
        enum:
          - Federal tax
          - State tax
          - Local tax
          - Social security tax
          - Retirement deductions
          - Garnishment deductions
          - Benefit deductions
          - SUI SDI VPDI tax
          - Other deductions
  deductionAmountList:
    type: object
    description: deposit details
    properties:
      amount:
        type: number
        format: double
        description: deposited amount for the pay period
        default: "120.76"
      currencyCode:
        type: string
        description: deposited amount currency code for the pay period
        default: "USD"

  paymentHistoryList:
    type: array
    description: contains list of consumers individual paycheck data
    items:
      $ref: '#/definitions/payment'
  payment:
    type: object
    description: Summary Attributes
    properties:
      payDate:
        type: string
        description: individual paycheck generated date
      payDescription:
        type: string
        description: pay description for the employee. The payUnitType will also be appended to this field following the payDescription response.
        default: Hourly | payUnitType - Hour
      payCycle:
        type: string
        description: pay frequency
      basePayRate:
        type: string
        description: base pay rate for the pay period
        default: "120.04"
      payPeriodHours:
        type: number
        format: double
        description: individual paycheck hours
        default: "37.5"
      payPeriod:
        $ref: '#/definitions/payPeriodList'
      payAmount:
        $ref: '#/definitions/payAmountList'
      deductions:
        $ref: '#/definitions/deductionsList'
      payDistributions:
        items:
          $ref: '#/definitions/payDistributionsList'

  deductionsList:
    type: object
    description: tax deductions
    properties:
      deductionsTotal:
        type: number
        format: double
        description: Total Deduction Amount
        default: 12.12
      deductionsDetails:
        items:
          $ref: '#/definitions/deductionDetailsItem'

  deductionDetailsItem:
    type: object
    description: Individual deductions Item Details such as Federal tax, State tax, Local tax, Social security tax, Medicare tax, SUI SDI VPDI tax, Retirement deductions, Benefit deductions, Garnishment deductions, Other deductions
    properties:
      name:
        type: string
      amount:
        type: string

  payAmountList:
    type: object
    description: contains list of consumers individual paycheck deposit details
    properties:
      grossPay:
        type: string
        description: gross pay for that pay period
        default: "5000.01"
      basePay:
        type: string
        description: gross pay for that pay period
        default: "4000.01"
      overtimePay:
        type: string
        description: overtime pay for that pay period
        default: "500.01"
      bonusPay:
        $ref: '#/definitions/bonusesList'
      otherPay:
        $ref: '#/definitions/otherPayList'
      3pspAmount:
        type: string
        description: 3psp pay for that pay period
        default: 100.01

  payDistributionsList:
    type: object
    description: contains paycheck deposit details of consumer
    properties:
      depositAmount:
        type: number
        format: double
        description: deposit amount
        default: "2000.55"
      depositAccount:
        $ref: '#/definitions/depositAccountList'

  depositList:
    type: object
    description: deposit details
    properties:
      amount:
        type: number
        format: double
        description: deposited amount for the pay period
        default: "4200.76"
      currencyCode:
        type: string
        description: deposited amount currency code for the pay period
        default: "USD"

  depositAccountList:
    type: object
    description : deposited account details
    properties:
      routingTransitID:
        type: number
        format: double
        description: Routing number to be returned in the following format “000000000”
        default: "000000000"
      accountNumber:
        type: string
        description: Direct deposit account number to be returned in the following format “xxx-xx-0000”
        default: "xxx-xx-0000"
      accountTypeCode:
        type: string
        description: Bank account type (checking, saving, share deposit, loan deposit)
        enum:
          - checking
          - savings
          - share deposit
          - loan deposit
        default: checking

  basePayAmountList:
    type: object
    description: commission for this pay period
    properties:
      amount:
        type: number
        format: double
        description: commission amount for this pay period
        default: "3000.85"
      currencyCode:
        type: string
        description: commission currency code for this pay period
        default: USD

  otherPayList:
    type: object
    description: other pay
    properties:
      otherPayTotal:
        type: number
        format: double
        description: toal other pay amount for this pay period
        default: "3000.85"
      otherPayDetails:
        type: array
        description: other Pay components details for this pay Period
        items:
          $ref: '#/definitions/otherPayDetailsItem'
  otherPayDetailsItem:
    type: object
    description: Individual other Pay Item Details such as bonus, commissions, pension, ptoHoliday, severance, sick, stock, tips, workersComp, miscellaneous
    properties:
      name:
        type: string
      amount:
        type: string

  bonusesList:
    type: object
    description : Bonus for this pay period
    properties:
      bonusPayTotal:
        type: number
        format: double
        description: toal bonus amount for this pay period
        default: 3000.85
      bonusPayDetails:
        type: array
        description: Bonus Pay components details for this pay Period
        items:
          $ref: '#/definitions/bonusPayDetailsItem'
  bonusPayDetailsItem:
    type: object
    description: Individual Bonus Pay Item Details such as bonus, commissions, severance, stock, tips, miscellaneous
    properties:
      name:
        type: string
      amount:
        type: string

  overTimeList:
    type: object
    description : overtime information for this pay period
    properties:
      amount:
        type: number
