        type: object
        properties:
            status:
                type: string
                example: success
            data:
                maxItems: 100
                type: array
                items:
                    type: string

    QueryRangeResponse:
        type: object
        required:
            - status
        description:
            |
            Response data from Loki corresponding to the query. Can be either a matrix or a stream depending on request.
            Matrix response is a table of values where each row represents a different label set and the columns are each sample value for that row over the queried time. Matrix types are only returned when running a query that computes some value.
            A stream is a set of all values (logs) for a given label set over the queried time range. Streams are the only type that will result in log lines being returned.

            Matrix example:
            ```
            {
                "resultType": "matrix",
                "result": [
                    {
                        "metric": {
                            "level": "info"
                        },
                        "values": [
                            [
                                1588889221,
                                "137.95"
                            ],
                            [
                                1588889221,
                                "467.115"
                            ],
                            [
                                1588889221,
                                "658.8516666666667"
                            ]
                        ]
                    },
                    {
                        "metric": {
                            "level": "warn"
                        },
                        "values": [
                            [
                                1588889221,
                                "137.27833333333334"
                            ],
                            [
                                1588889221,
                                "467.69"
                            ],
                            [
                                1588889221,
                                "660.6933333333334"
                            ]
                        ]
                    }
                ],
                "stats": {
                    ...
                }
            }
            ```
            Stream Example:
            ```
            {
                "resultType": "stream",
                "result": [
                    {
                        "stream": {
                            "filename": "/var/log/myproject.log",
                            "job": "varlogs",
                            "level": "info"
                        },
                        "values": [
                            [
                                "1569266497240578000",
                                "foo"
                            ],
                            [
                                "1569266492548155000",
                                "bar"
                            ]
                        ]
                    }
                ],
                "stats": {
                    ...
                }
            }
            ```
        properties:
            status:
                type: string
            data:
                required:
                    - result
                    - resultType
                    - stats
                type: object
                properties:
                    resultType:
                        type: string
                        enum:
                            - matrix
                            - streams
                    result:
                        $ref: '#/definitions/LokiQueryResult'
                    stats:
                        $ref: '#/definitions/LokiStats'

    LokiQueryResult:
        type: object
        required:
            - values
        properties:
            metric:
                type: object
                additionalProperties:
                    type: string
            stream:
                type: object
                additionalProperties:
                    type: string
            values:
                type: array
                description: If the result type is matrix then this will be an array of arrays each containing a second unix epoch and a string value. If the result type is stream then this will be an array of arrays each containing a nanosecond unix epoch and a string log line.
                items:
                    type: array
                    minLength: 2
                    maxLength: 2
                    items:
                        type: string
    LokiStats:
        type: object
        properties:
            ingester:
                type: object
                properties:
                    compressedBytes:
                        description: Total bytes of compressed chunks (blocks) processed by ingesters
                        type: number
                    decompressedBytes:
                        description: Total bytes decompressed and processed by ingesters
                        type: number
                    decompressedLines:
                        description: Total lines decompressed and processed by ingesters
                        type: number
                    headChunkBytes:
                        description: Total bytes read from ingesters head chunks
                        type: number
                    headChunkLines:
                        description: Total lines read from ingesters head chunks
                        type: number
                    totalBatches:
                        description: Total batches sent by ingesters
                        type: number
                    totalChunksMatched:
                        description: Total chunks matched by ingesters
                        type: number
                    totalDuplicates:
                        description: Total of duplicates found by ingesters
                        type: number
                    totalLinesSent:
                        description: Total lines sent by ingesters
                        type: number
                    totalReached:
                        description: Amount of ingesters reached
                        type: number
            store:
                type: object
                properties:
                    compressedBytes:
                        description: Total bytes of compressed chunks (blocks) processed by the store
                        type: number
                    decompressedBytes:
                        description: Total bytes decompressed and processed by the store
                        type: number
                    decompressedLines:
                        description: Total lines decompressed and processed by the store
                        type: number
                    chunksDownloadTime:
                        description: Total time spent downloading chunks in seconds (float)
                        type: number
                    totalChunksRef:
                        description: Total chunks found in the index for the current query
                        type: number
                    totalChunksDownloaded:
                        description: Total of chunks downloaded
                        type: number
                    totalDuplicates:
                        description: Total of duplicates removed from replication
                        type: number
            summary:
                type: object
                properties:
                    bytesProcessedPerSecond:
                        description: Total of bytes processed per second
                        type: number
                    execTime:
                        description: Total execution time in seconds (float)
                        type: number
                    linesProcessedPerSecond:
                        description: Total lines processed per second
                        type: number
                    totalBytesProcessed:
                        description: Total amount of bytes processed overall for this request
                        type: number
                    totalLinesProcessed:
                        description: Total amount of lines processed overall for this request
                        type: number

    Route:
        type: "object"
        properties:
            id:
                type: "integer"
                format: "int64"
                description: ID associated to the route on its creation
                example: "1"
            eventCategoryId:
                type: "integer"
                format: "int64"
                description: event category ID associated to the route
                example: "1"
            destinationId:
                type: "integer"
                format: "int64"
                description: destination ID associated to the route
                example: "1"
            environmentType:
                type: "string"
                description: environment type associated to the route
                example: "PROD"
            environmentId:
                type: "integer"
                format: "int64"
                description: Environment id associated to the route
                example: "2345"
            filterKey:
                type: "string"
                description: provides additional filtration. It could be anything that is part of the event payload (for user-defined events, originating from the event generation component as set in the design studio), as the property should be used with an underscore prefix, which indicates that a value inside the "payload" node will be extracted. Then the actual property name is added. E.g., "_EnvironmentType" indicates to the EnvironmentType property of the payload object. If the property is inside of a nested object of the payload node, the object name should be used, followed by underscore and appended with the actual property name, e.g., "_BIEventPayload_ProductID"
                example: "_BIEventPayload_ProductID"
            filterValue:
                type: "string"
                description: provides additional filtration by holding value used to compare against the filtered value
                example: "ProductID_Value"
    EventCategoryPostModel:
