        post:
            tags:
                - Routes
            summary: "Create a mapping between an event category and destination"
            description: "Create a mapping between an event category configuration and specific destination configuration per environment type with option to add additional filtering via 'filterKey' and 'filterValue'. 'filterKey' will hold xpath based key to search within event payload. In case the same event category and environment type have to be associated with more destinations additional routes need to be created."
            operationId: "createRoute"
            consumes:
                - "application/json"
            produces:
                - "application/json"
                - "application/json"
            parameters:
                -  $ref: '#/parameters/authorization'
                -  $ref: '#/parameters/correlationId'
                -  in: "body"
                   name: "RoutePostModel"
                   description: "Route configuration object"
                   required: true
                   schema:
                       type: "object"
                       required:
                           - "destinationId"
                           - "eventCategoryId"
                           - "environmentType"
                       properties:
                           eventCategoryId:
                               type: "integer"
                               format: "int64"
                               description: event category ID to be associated to the route
                               example: "1"
                           destinationId:
                               type: "integer"
                               format: "int64"
                               description: destination ID to be associated to the route
                               example: "1"
                           environmentType:
                               type: "string"
                               description: environment type to be associated to the route, could be DEFAULT, SHARED, SANDBOX, PREVIEW, PROD and empty string, depending on origin where Event is generated
                               example: "PROD"
                           environmentId:
                               type: "integer"
                               format: "int64"
                               description: Route configuration based on 'environmentId' is only allowed to users which have access to the specified environment. Changing or deleting the configuration in the future will only be possible for users with access to the specified environment. All configurations related to 'environmentType' - 'SANDBOX', 'PREVIEW', 'PROD' will require 'environmentId' to be provided
                               example: "2345"
                           filterKey:
                               type: "string"
                               description: provides additional filtration. It could be anything that is part of the event payload (for user-defined events, originating from the event generation component as set in the design studio), as the property should be used with an underscore prefix, which indicates that a value inside the "payload" node will be extracted. Then the actual property name is added. E.g., "_EnvironmentType" indicates to the EnvironmentType property of the payload object. If the property is inside of a nested object of the payload node, the object name should be used, followed by underscore and appended with the actual property name, e.g., "_BIEventPayload_ProductID"
                               example: "_BIEventPayload_ProductID"
                           filterValue:
                               type: "string"
                               description: provides additional filtration by holding value used to compare against the filtered value
                               example: "ProductID_Value"
            responses:
                "200":
                    description: "The route has been successfully added"
                    schema:
                        $ref: '#/definitions/Route'
                "400":
                    $ref: '#/responses/BadRequestError'
                "401":
                    $ref: '#/responses/UnauthorisedError'
                "403":
                    $ref: '#/responses/ForbiddenError'
                "404":
                    $ref: '#/responses/NotFoundError'
                "415":
                    $ref: '#/responses/UnsupportedMediaTypeError'
                "500":
                    $ref: '#/responses/InternalServerError'
        get:
            tags:
                - Routes
            summary: "Get the list of routes"
            description: "Get the list of all existing configured routes"
            operationId: "getAllRoutes"
            produces:
                - "application/json"
