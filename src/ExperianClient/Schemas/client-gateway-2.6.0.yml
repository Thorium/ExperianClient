swagger: '2.0'
info:
    title: Client Gateway API
    description: >
        The ‘Client Gateway API’ is a set of services allowing to interact with the Experian One platform in client self-service.

        This set of services allows clients to:
            - Upload, deploy, and troubleshoot Originations & Strategy Solutions
            - Update the Tactical Parameters configuration
            - Configure and troubleshoot the Event Broker Service and Audit Consumer Service
            - Manage client data jobs
            - Fetch available monitoring data

    version: 2.6.0

host: developer.experian.com
basePath: /v1
schemes:
    - https

tags:
    -   name: File Management
        description: Upload an Originations screenless or Strategy solution
    -   name: File Processing
        description: Upload a file for further processing, list and download available processing related files
    -   name: Environment
        description: Fetch runtime environments information
    -   name: Deployment
        description: Deploy Originations or Strategy solution
    -   name: Parameters
        description: Manage Parameters Group of an environment
    -   name: Promotion
        description: Deploy published configurations to an environment
    -   name: Hybrid Deployment
        description: Generate and execute hybrid deployment of decisioning package
    -   name: Log Level
        description: Set log levels
    -   name: Logs
        description: Retrieve logs
    -   name: Audit Trail
        description: Gives access to user activities, changes, and security-related events in the client namespace.
    -   name: Event Categories
        description: Manage an "event category"
    -   name: Routes
        description: Manage a mapping between an "event category" and "destination" per environment type
    -   name: Destinations
        description: Manage a "destination" to which an "event categories" are routed
    -   name: Recipients
        description: Manage email recipients of notifications for specific events
    -   name: Failed Events
        description: Gives access to all details about persisted failed events and the reprocess functionality
    -   name: Kinesis
        description: Gives access to events via kinesis stream
    -   name: Client Data
        description: Provides access to client data management functionalities, including importing, scheduling, and querying client data jobs.
    -   name: Monitoring
        description: Gives insight to monitoring data such as metrics
    -   name: Access Management
        description: Identity access management, view users and groups, assign users to groups and vice versa
    -   name: Config Diff
        description: Gives access to configuration differences for an environment

parameters:
    environmentId:
        in: path
        type: number
        format: int64
        name: environmentId
        required: true
        x-example: 36242
    correlationId:
        name: X-Correlation-Id
        in: header
        description: The correlation ID for this request.
        required: true
        type: string
        format: uuid
        x-example: ded76cef-e091-481e-a560-804cb56f527f
    optionalCorrelationId:
        name: X-Correlation-Id
        in: header
        description: The correlation ID for this request.
        required: false
        type: string
        format: uuid
        x-example: ded76cef-e091-481e-a560-804cb56f527f
    fileCategory:
        name: fileCategory
        in: path
        description: The unique tag for the file type. Either 'solution', 'strategy', 'da-trace-log', or 'config-diff'.
        required: true
        type: string
        x-example: solution
    fileType:
        name: fileCategory
        in: path
        required: true
        description: The unique tag for the file type.
        type: string
        enum:
            - strategy
            - smaas-batch
        default: smaas-batch
        x-example: smaas-batch
    fileId:
        name: fileId
        in: path
        description: The file identifier of the file to retrieve.
        required: true
        type: string
        x-example: 8fa70f5d-4954-4ad7-8ab1-91e12378dd92
    useCase:
        name: useCase
        in: path
        description: Use case the file/deployables correspond to.
        type: string
        required: true
        x-example: pc-userjourney
    authorization:
        name: Authorization
        in: header
        description: The Experian One JWT token to be used as a bearer token.
        pattern: '^Bearer\s.+$'
        required: true
        type: string
        x-example: Bearer ZGVtbzpwQDU1dzByZA==
    page:
        name: page
        in: query
        description: Page number to be viewed.
        type: integer
        format: int32
        default: 0
        minimum: 0
        x-example: 1
    size:
        name: size
        in: query
        description: Size of the pages being viewed
        type: integer
        format: int32
        default: 10
        minimum: 1
        x-example: 3
    eventCategoryId:
        in: path
        name: eventCategoryId
        description: The ID assigned to the event category on its creation
        required: true
        type: integer
        minimum: 1
        format: int64
    routeId:
        in: path
        name: routeId
        description: The ID assigned to the route on its creation
        required: true
        type: integer
        format: int64
    destinationId:
        in: path
        name: destinationId
        description: The ID assigned to the destination on its creation
        required: true
        type: integer
        minimum: 1
        format: int64
    recipientId:
        in: "path"
        name: recipientId
        description: The ID assigned to the recipient on its creation
        required: true
        type: integer
        format: int64
        minimum: 1
    recipientConfig:
        in: body
        name: RecipientPostModel
        description: Recipient object and mapping to specific destination configurations
        required: true
        schema:
            $ref: "#/definitions/RecipientPostModel"
    groupId:
        name: "id"
        in: "path"
        description: "The component id of the group of interest."
        type: "string"
        required: true
    partNumber:
        name: partNumber
        in: path
        description: Integer representation of the part number under which part of the file content will be uploaded trough the URL
        required: true
        type: integer
    id:
        name: id
        in: path
        description: The identifier of the file for processing
        required: true
        type: string
        x-example: 49d574f8-c584-4480-806f-95340700ff55
    pageNumber:
        name: pageNumber
        in: query
        description: The number of the page with objects to be returned. When provided, the "pageLimit" parameter must be provided as well indicating the number of objects to be returned per page.
        type: integer
    pageLimit:
        name: pageLimit
        in: query
        description: A limit on the number of objects to be returned per page, "pageNumber" parameter must be provided when this is set.
        type: integer
    fileName:
        name: fileName
        in: path
        description: The name of the file
        required: true
        type: string
        x-example: test.xml
    layer:
        name: layer
        in: query
        description: The layer based on which the environments will be filtered
        required: false
        type: string
        enum:
            - CLIENT
            - USE_CASE
        default: USE_CASE
        x-example: "USE_CASE"
    jobId:
        name: id
        in: path
        description: The identifier of the submitted import client data job
        required: true
        type: integer
        format: int64
        x-example: 123456789
    type:
        name: type
        in: query
        description: The type of schedule to be retrieved.
        required: true
        type: string
        enum:
            - import
            - housekeeping
        x-example: import
    envId:
        in: path
        type: integer
        format: int64
        name: envId
        required: true
        x-example: 36242
    metricsFilter:
        name: filter
        in: query
        required: true
        description: Required applicable filter to fetch a subset of metrics data
        type: string
        x-example: "bps"
    iamGroupId:
        in: path
        name: groupId
        description: The target group ID
        required: true
        type: string
    iamProductId:
        in: path
        name: productId
        description: The target product ID
        required: true
        type: string
    iamUserId:
        in: path
        name: userId
        description: The target user ID
        required: true
        type: string

    metricsEnvironmentId:
        name: environmentId
        in: query
        required: false
        description: Optional environment ID to scope the metrics data retrieval
        type: integer
        format: int64
        x-example: 1
    eventFrom:
        name: eventFrom
        in: query
        description: |
            Start of the event time range (ISO 8601 format: YYYY-MM-DDTHH:MM:SSZ).
        required: false
        type: string
        format: date-time
        x-example: "2026-02-03T19:33:00Z"
    eventTo:
        name: eventTo
        in: query
        description: |
            End of the event time range (ISO 8601 format: YYYY-MM-DDTHH:MM:SSZ).
        required: false
        type: string
        format: date-time
        x-example: "2026-02-03T19:34:00Z"
    cursor:
        name: cursor
        in: query
        description: Cursor for pagination.
        required: false
        type: string
    limit:
        name: limit
        in: query
        description: Maximum number of results to return.
        required: false
        type: integer
        format: int32
        minimum: 1
        maximum: 50
    diffStatus:
        name: status
        in: query
        description: |
            Status of the diff record to filter by.
            A - Active, F - Failed, R - Archived
        required: false
        type: string
        enum:
            - A
            - F
            - R
        x-example: A
    configName:
        name: name
        in: query
        description: The name of the configuration to filter by.
        required: false
        type: string
        x-example: "Bureau_Enabler_TP - TP - Bureau Enabler"
    configurationDiffType:
        name: type
        in: query
        required: false
        description: |
            Configuration category for the diff listing. When omitted, empty, or whitespace-only, all configuration types are returned (no downstream type filter).
            Use the exact value `tacticalParameters` (case-sensitive) to filter tactical-parameter diffs. Values such as `tacticalparameters`, `tacticalparametersx`, `dynamicparameters`, or the literal `null` return HTTP 200 with an empty list and do not call downstream.
        type: string
        x-example: tacticalParameters
responses:
    BadRequestError:
        description: Bad Request
        headers:
            Cache-Control:
                type: string
                enum:
                    - no-store
                description: Will always be 'no-store'
            Pragma:
                type: string
                enum:
                    - no-cache
                description: Will always be 'no-cache'
            X-Correlation-Id:
                description: The correlation ID for this request.
                type: string
        schema:
            $ref: '#/definitions/ClientError'
    NotFoundError:
        description: Resource requested cannot be found.
        headers:
            Cache-Control:
                type: string
                enum:
                    - no-store
                description: Will always be 'no-store'
            Pragma:
                type: string
                enum:
                    - no-cache
                description: Will always be 'no-cache'
            X-Correlation-Id:
                description: The correlation ID for this request.
                type: string
        schema:
            allOf:
                -   type: object
                    properties:
                        code:
                            type: string
                            minLength: 3
                            description: "Error code."
                            example: "404-000"
                        description:
                            type: string
                            minLength: 1
                            description: "Error description."
                            example: "There has been an error. Either try again in a few seconds, or contact your administrator."
                        reason:
                            type: string
                            minLength: 1
                            description: "Error reason."
                            example: "Error reason."

    UnauthorisedError:
        description: Credentials are invalid.
        headers:
            Cache-Control:
                type: string
                enum:
                    - no-store
                description: Will always be 'no-store'
            Pragma:
                type: string
                enum:
                    - no-cache
                description: Will always be 'no-cache'
            WWW-Authenticate:
                type: string
                description: The authentication schemes for the current end point.
            X-Correlation-Id:
                description: The correlation ID for this request.
                type: string
        schema:
            allOf:
                -   type: object
                    properties:
                        code:
                            type: string
                            minLength: 3
                            description: "Error code."
                            example: "401-000"
                        description:
                            type: string
                            minLength: 1
                            description: "Error description."
                            example: "There is a problem with your session. Please log in again."
                        reason:
                            type: string
                            minLength: 1
                            description: "Error reason."
                            example: "Invalid token"

    InternalServerError:
        description: Internal server error
        headers:
            Cache-Control:
                type: string
                enum:
                    - no-store
                description: Will always be 'no-store'
            Pragma:
                type: string
                enum:
                    - no-cache
                description: Will always be 'no-cache'
            X-Correlation-Id:
                description: The correlation ID for this request.
                type: string
        schema:
            $ref: '#/definitions/ServerError'

    NotAcceptableError:
        description: Not acceptable
        headers:
            Cache-Control:
                type: string
                enum:
                    - no-store
                description: Will always be 'no-store'
            Pragma:
                type: string
                enum:
                    - no-cache
                description: Will always be 'no-cache'
            Content-Language:
                type: string
                description: This is the language this content is intended for.
            Vary:
                description: What headers in combination with the HTTP method and URI form the
                    unique key for a request.
                type: string
            X-Correlation-Id:
                description: The correlation ID for this request
                type: string
        schema:
            "$ref": "#/definitions/ClientError"
    ConflictError:
        description: Conflict
        headers:
            Cache-Control:
                type: string
                enum:
                    - no-store
                description: Will always be 'no-store'
            Pragma:
                type: string
                enum:
                    - no-cache
                description: Will always be 'no-cache'
            X-Correlation-Id:
                description: The correlation ID for this request
                type: string
        schema:
            "$ref": "#/definitions/ClientError"
    ForbiddenError:
        description: No permission to access
        headers:
            Cache-Control:
                type: string
                enum:
                    - no-store
                description: Will always be 'no-store'
            Pragma:
                type: string
                enum:
                    - no-cache
                description: Will always be 'no-cache'
        schema:
            allOf:
                -   type: object
                    properties:
                        code:
                            type: string
                            minLength: 3
                            description: "Error code."
                            example: "403-000"
                        description:
                            type: string
                            minLength: 1
                            description: "Error description."
                            example: "You are not authorised to complete this action. Please contact your administrator."
                        reason:
                            type: string
                            minLength: 1
                            description: "Error reason."
                            example: "Access denied by ACL"
    UnsupportedMediaTypeError:
        description: Unsupported Media Type
        headers:
            Cache-Control:
                type: string
                enum:
                    - no-store
                description: Will always be 'no-store'
            Pragma:
                type: string
                enum:
                    - no-cache
                description: Will always be 'no-cache'
        schema:
            $ref: '#/definitions/ClientError'
    UnprocessableEntityError:
        description: Unprocessable entity
        headers:
            Cache-Control:
                type: string
                enum:
                    - no-store
                description: Will always be 'no-store'
            Pragma:
                type: string
                enum:
                    - no-cache
                description: Will always be 'no-cache'
        schema:
            "$ref": "#/definitions/ClientError"
    ServiceNotAvailable:
        description: Service not available
        headers:
            Cache-Control:
                type: string
                enum:
                    - no-store
                description: Will always be 'no-store'
            Pragma:
                type: string
                enum:
                    - no-cache
                description: Will always be 'no-cache'
            X-Correlation-Id:
                description: The correlation ID for this request.
                type: string
        schema:
            allOf:
                -   type: object
                    properties:
                        code:
                            type: string
                            minLength: 3
                            description: "Error code."
                            example: "503-000"
                        description:
                            type: string
                            minLength: 1
                            description: "Error description."
                            example: "Service is currently unavailable."

paths:
    /files/{fileCategory}:
        post:
            summary: Generate a pre-signed url for file upload
            description: >
                A process that allows the user to upload larger files. It provides a pre-signed URL to upload a file to a particular storage.
                The upload url is for a single use and has expiry time of 1 minute so it should be used right away for file upload.

                If using archives as files to be uploaded, they must be structured so that they can contain any deployables in an xml format and a YAML file, describing the deployables. The YAML file is required in any case, no matter if strategy only or full solution is being processed. It could list only single strategy that should be processed and not the whole solution.

                **YAML file definition**

                This file describes the list of components that will be deployed

                  * `name` is the solution name

                For each deployable:

                  * `deployableName` is the label name (repo-cmd-service will create a label based on this name - you need to ensure that there's no duplicated deployableName within your yaml file)
                  * `componentName`
                    * for anything other than Decision Process Flow (DPF), this is your component name of your deployable
                    * for Decision Process Flow, this is your DPF alias name
                  * `componentKey` is the coding side of key
                    * Business Composition Manager = "WorkflowComposition"
                    * Enrichment Access Strategy = "EnrichmentAccessFlow"
                    * Decision Process Flow = "DecisionProcessFlow"

                **Example YAML File**

                    name: User Journey Use Case-20171012
                    deployables:
                    - deployableName: Business Process Composition
                      componentName: Business Process Composition
                      componentKey: WorkflowComposition
                    - deployableName: AlphaCC
                      componentName: Credit Card
                      componentKey: DecisionProcessFlow
                    - deployableName: CEAS1.0
                      componentName: CEAS
                      componentKey: EnrichmentAccessFlow

            operationId: asyncUpload
            tags:
                - File Management
            produces:
                - application/json
                - application/json
                - application/json
            consumes:
                - application/json
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/fileCategory'
                -   in: body
                    name: body
                    required: true
                    schema:
                        $ref: '#/definitions/AsyncFileUploadPostModel'
            responses:
                201:
                    description: A target url has been successfully generated.
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request.
                            type: string
                        X-FMS-Warning:
                            type: string
                            description: Additional warning header for sensitive data validations
                        X-FMS-Info:
                            type: string
                            description: Additional info header for sensitive data validations
                    schema:
                        $ref: '#/definitions/AsyncFileItemModel'
                400:
                    $ref: '#/responses/BadRequestError'
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                500:
                    $ref: '#/responses/InternalServerError'
    /files/{fileCategory}/{fileId}/file:
        get:
            summary: Generate a pre-signed url for file download
            description: >
                Retrieve a direct URL for downloading a file within a specified category, based on its file identifier.

                The pre-signed URL for downloading the file expires in 1 minute. It provides temporary access with specific security permissions and must be used within 1 minute, after which it will no longer be valid.
            operationId: initiateUrlDownload
            tags:
                - File Management
            produces:
                - application/json
                - application/json
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/fileCategory'
                -   $ref: '#/parameters/fileId'
            responses:
                200:
                    description: A direct download URL has been successfully generated for the given file identifier.
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                    schema:
                        $ref: '#/definitions/DownloadFileItemModel'
                400:
                    $ref: '#/responses/BadRequestError'
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                404:
                    $ref: '#/responses/NotFoundError'
                500:
                    $ref: '#/responses/InternalServerError'
    /processes/{fileCategory}/multi-parts:
        post:
            tags:
                - File Processing
            consumes:
                - application/json
            produces:
                - application/json
                - application/json
            summary: Initiates a file upload that will be executed in several/multi part operations, when completed the file will be processed further
            description: A process that allows the user to start a file upload in several multi part operations. It provides an id under which the separate parts can later on be uploaded and the file completed. Once all parts are uploaded and the file completed, then the file will be processed further.
            operationId: initiateFileProcessingMultipartUpload
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/fileType'
                -   in: body
                    name: body
                    schema:
                        $ref: '#/definitions/ProcessMultiPartsUploadInitiationData'
                    required: true
            responses:
                201:
                    description: Successful multipart file upload initiation for further processing under given category
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request.
                            type: string
                    schema:
                        $ref: '#/definitions/ProcessMultiPartsUploadInitiationPayload'
                400:
                    $ref: '#/responses/BadRequestError'
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                "415":
                    $ref: '#/responses/UnsupportedMediaTypeError'
                500:
                    $ref: '#/responses/InternalServerError'
    /processes/{fileCategory}/multi-parts/{id}/parts/{partNumber}:
        post:
            tags:
                - File Processing
            produces:
                - application/json
                - application/json
            summary: Creates an upload URL for a specific part of the file. Once all parts are uploaded and the file completed, then the file will be processed further.
            description: Once the initiation of processing multi parts upload is done, it must be followed by at least one request for multipart part upload trough pre-signed URL.
                This endpoint provides a direct URL for uploading specific file part number for given id that expires in 1 minute. The id must be the same as the one returned in the response from the initiation of processing multipart upload endpoint.
            operationId: initiateFileProcessingPartUploadUrl
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/fileType'
                -   $ref: '#/parameters/id'
                -   $ref: '#/parameters/partNumber'
            responses:
                201:
                    description: Successful initiation of part file upload under given category and id
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request.
                            type: string
                    schema:
                        $ref: '#/definitions/ProcessingPartUploadPayload'
                400:
                    $ref: '#/responses/BadRequestError'
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                404:
                    $ref: '#/responses/NotFoundError'
                500:
                    $ref: '#/responses/InternalServerError'
    /processes/{fileCategory}/multi-parts/{id}:
        post:
            tags:
                - File Processing
            produces:
                - application/json
                - application/json
            summary: Completes an already started processing multipart upload for given id
            description: Finalizes the multipart upload where the multipart upload initiation is done and then followed by at least one multipart part uploads trough pre-signed URL. Completes an already started multipart upload for given id for further processing for which one or more file parts were already uploaded.
            operationId: completeFileProcessingMultipartUpload
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/fileType'
                -   $ref: '#/parameters/id'
            responses:
                200:
                    description: Successful completion of file upload consisted of one or several parts
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request.
                            type: string
                    schema:
                        $ref: '#/definitions/ProcessingCompleteMultipartsPayload'
                400:
                    $ref: '#/responses/BadRequestError'
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                500:
                    $ref: '#/responses/InternalServerError'
    /processes/{fileCategory}:
        get:
            tags:
                - File Processing
            produces:
                - application/json
                - application/json
            summary: Get all available processing files for the client account
            description: Get all available processing files for the given file category and client account
            operationId: getAllProcessingFiles
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/fileType'
                -   $ref: '#/parameters/pageNumber'
                -   $ref: '#/parameters/pageLimit'
            responses:
                200:
                    description: A list of files has been successfully retrieved
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                    schema:
                        $ref: '#/definitions/V1FileProcessingList'
                400:
                    $ref: '#/responses/BadRequestError'
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                404:
                    $ref: '#/responses/NotFoundError'
                500:
                    $ref: '#/responses/InternalServerError'
        post:
            tags:
                - File Processing
            consumes:
                - application/json
            produces:
                - application/json
                - application/json
            summary: Create a URL for direct file upload that will be processed further
            description: A process where a pre-signed URL that expires in 1 minute is provided and gives the option to the user to make the upload in one go - single upload. After the upload is done, the file will be processed further.
            operationId: initiateFileProcessingUploadUrl
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/fileType'
                -   in: body
                    name: body
                    schema:
                        $ref: '#/definitions/ProcessingUploadData'
                    required: true
            responses:
