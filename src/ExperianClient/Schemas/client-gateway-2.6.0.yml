definitions:
    JobId:
        type: integer
        format: int64
        description: The identifier of the import job
        example: 12345
    CronExpression:
        type: object
        properties:
            cronExpression:
                type: string
                description: The cron expression for scheduling
                example: "0 0/5 14 * * ?"
    ImportedClientData:
        type: object
        properties:
            inputFileName:
                type: string
                description: Input CSV file name
                example: "data.csv"
            tableName:
                type: string
                description: Output database table name
                example: "client_data"
    ImportedClientDataCollection:
        type: object
        properties:
            importedData:
                type: array
                description: List of csv input files and its respective output database table name
                items:
                    $ref: '#/definitions/ImportedClientData'
    ImportedClientDataJobDetails:
        allOf:
            -   $ref: '#/definitions/ClientDataJob'
            -   $ref: '#/definitions/ImportedClientDataCollection'
            -   type: object
                properties:
                    errorMessage:
                        type: array
                        description: Import client data job failure message
                        items:
                            type: string
    ClientDataJob:
        required:
            - executionTimestamp
            - jobId
            - status
        type: object
        properties:
            jobId:
                $ref: '#/definitions/JobId'
            status:
                type: string
                enum:
                    - COMPLETED
                    - STARTING
                    - STARTED
                    - STOPPING
                    - STOPPED
                    - FAILED
                    - ABANDONED
                    - UNKNOWN
                description: The status of the import job
                example: ACTIVE
            executionTimestamp:
                type: string
                description: The timestamp when the job was executed
                example: 2023-10-01T12:34:56Z
    ImportClientDataJob:
        type: object
        properties:
            jobId:
                $ref: '#/definitions/JobId'
            jobMessage:
                type: string
                description: The submission message of the import client data job
                example: "Import job submitted successfully"
    HybridStatus:
        type: "string"
        enum: &HYBRIDDEPLOYMENTSTATUS [
            "IN PROGRESS",
            "SUCCESS",
            "FAILED",
            "OUTDATED"]
        description: |
            IN PROGRESS: Deployment to environment in progress and may or may not be success at this moment.
            FAILED: Deployment to environment failed and is not expected to become success.
            SUCCESS: Configuration is successfully deployed and currently in use.
            OUTDATED: The old configuration that has been overridden by promote, or copy or restore. This is due to other version being success now.
    Solution:
        type: "object"
        properties:
            name:
                type: "string"
                description: "The name of the deployed Decision Process Flow."
                example: "Credit Card"
            deployedVersion:
                type: "string"
                description: "The version of the deployed Decision Process Flow on Promotion Management Unassigned Tab."
                example: "1"
    HybridDeployment:
        type: "object"
        required:
            - description
            - solutions
        properties:
            description:
                type: "string"
                description: "The user defined description for this deployment."
                example: "Multiple hybrid deployments submission"
                minLength: 1
            solutions:
                type: "array"
                description: "A list of published decision process flows"
                items:
                    $ref: "#/definitions/Solution"
                minItems: 1
                uniqueItems: true
                example:
                    - name: "Credit Card"
                      deployedVersion: 1
                    - name: "Post Bureau"
    HybridDeploymentDetail:
        type: "object"
        properties:
            name:
                type: "string"
                description: "The name of the deployed Decision Process Flow"
                example: "Credit Card"
            deployedVersion:
                type: "string"
                description: "The version of the deployed Decision Process Flow on Promotion Management Unassigned Tab"
                example: "1"
            auditId:
                type: "string"
                description: "The audit id of the hybrid deployment"
                example: "8a365f97-2c62-429f-a0d1-fa2902946ca9"
            status:
                type: "string"
                enum: *HYBRIDDEPLOYMENTSTATUS
                example: "SUCCESS"
            packageName:
                type: "string"
                minLength: 1
                description: "The name of the package if hybrid deployment is successful. This field is only populated when package generation is successful"
                example: "decisioning-package-20240506.064918-jwfd4qDXww.zip"
    HybridDeploymentDetails:
        type: "object"
        properties:
            deployments:
                type: "array"
                items:
                    $ref: "#/definitions/HybridDeploymentDetail"
                example:
                    - name: "Credit Card"
                      deployedVersion: 1
                      auditId: "8a365f97-2c62-429f-a0d1-fa2902946ca9"
                      status: "IN PROGRESS"
                    - name: "Post Bureau"
                      deployedVersion: 2
                      auditId: "a5d8d427-11d6-4358-9d33-f401844a39b9"
                      status: "SUCCESS"
                      packageName: "decisioning-package-20240506.064918-jwfd4qDXww.zip"
    AuditIds:
        type: "object"
        properties:
            auditIds:
                type: "array"
                items:
                    type: "string"
                description: "The list of audit ids returned by PMS"
                example:
                    - "a5d8d427-11d6-4358-9d33-f401844a39b9"
                    - "d3e5f8a2-47d6-4b8b-95f1-7e9b843f47f2"

    internalServerError:
        allOf:
            - type: object
              properties:
                  code:
                      type: string
                      minLength: 3
                      description: "Error code."
                      example: "500-001"
                  description:
                      type: string
                      minLength: 1
                      description: "Error description."
                      example: "Unexpected Internal Server Error"
    Ownership:
        type: "string"
        # If the enum is extended and the enum is used in a response, this will require a version bump as it changes an existing response contract.
        enum: &OWNERSHIP [
            "CLIENT",
            "PROPRIETARY"]
    Status:
        type: "string"
        enum: &STATUS [
            "PENDING",
            "ACTIVE",
            "SCHEDULED",
            "OVERRIDDEN",
            "EXPIRED",
            "FAILED",
            "INVALID",
            "REMOVED"]
        description: |
            PENDING: Deployment to environment in progress and may or may not be active at this moment.
            FAILED: Deployment to environment failed and is not expected to become active.
            ACTIVE: Configuration is successfully deployed and currently in use.
            OVERRIDDEN: The old configuration that has been overridden by promote, or copy or restore. This is due to other version being active now.
            SCHEDULED: The configuration is currently being scheduled. This is due to become active in the future, but the recent version is active now.
            EXPIRED: When the scheduled is timeout, the status will become expired.
            REMOVED: The audits belongs to a configuration for which it has been performed a remove action.
            INVALID: The audits belongs to an invalid configuration.
    SubStatus:
        type: "string"
        enum: &SUBSTATUS [
            "PENDING1",
            "PENDING2",
            "PENDING3",
            "CONFIRMED"]
        description: |
            PENDING1: The deployment to environment is in PENDING status and may or may not be active at this moment.
            PENDING2: The deployment is in ACKNOWLEDGE status and the promotion event consumer has received the event.
            PENDING3: The deployment is in ACCEPT status and determined that it is valid.
            CONFIRMED: The status has been consolidated and will not further evolve during the promotion process.
    DeploymentPostModel:
        type: object
        required:
            - fileId
            - environmentId
        description: Represents the deployment post model
        properties:
            fileId:
                type: string
                description: File ID to deploy
                example: 4ebc310d-6ed0-4ea4-ac91-7e78dc8352de
            environmentId:
                type: number
                format: int64
                description: Globally unique identifier for an environment
                example: 37264
            description:
                type: string
                description: Human readable reason for deployment. Can be useful for debugging
                default: Deployed via DX API
            resetSolutionDatabase:
                type: boolean
                description: Flag to reset solution database if there are any breaking changes while deploying the solution. If user requires to reset the Solution database, then this parameter value should be set to 'true'.This is an Optional parameter, if not provided it will be considered as 'false'.
                default: false
                enum: [true, false]
                example: false
    AsyncFileUploadPostModel:
        type: object
        required:
            - file
            - metadata
        description: Represents the deployment post model
        properties:
            file:
                type: string
                description: Sanitized file name for which the direct upload URL will be created.
                example: solution-11.2.3.zip
            size:
                type: number
                description: Approximate file size (in kilobytes). Optional value which when provided will be used to calculate the period of time for the temporary access of the file upload operation.
                format: double
                example: '1024.0'
            metadata:
                $ref: '#/definitions/FileMetadata'
    FileMetadata:
        description: >
            Configuration values added as key/value pairs, that can hold any desired meta information.
            Some possible values are:

            * *useCase* : UseCase to which the file is relevant. **This is a required parameter**.

            * *description* : Description of the file which is used by Deployment Management Service on strategy push.

            * *integrityChecksum* : If provided the file that is uploaded to the generated link will be required to match this hash. If it does not match the hash then the file will be rejected. It can be provided in two ways, one of which is the Base64 Encoded MD5 checksum value of the file. Example: \"rE1MMkHMMzmGqrqQiMXXeA==\". When used, the user should put the \"Content-MD5\" header with the calculated checksum of the file when using the pre-signed URL. \"integrityChecksum\" can also be provided in the following pattern - {algType}:{checksum}. The algorithm and the checksum are separated by \":\". Supported algorithms are \"MD5\" and \"SHA-256\". Example \"integrityChecksum\" representations - \"MD5:7eadc9ae3a4cd05061cc79007d68ded4\", \"SHA-256:5a16d7a7ff4472a3331942790c278860330c12a23b402f55ed84fe31d2843cb2\" When this approach is used, user is not required to put \"Content-MD5\" header when using the pre-signed URL.
        type: object
        example:
            useCase: acq-customer-faster
            description: description
            integrityChecksum: SHA-256:5a16d7a7ff4472a3331942790c278860330c12a23b402f55ed84fe31d2843cb2
        additionalProperties:
            type: string

    PaginatedEnvironments:
        description: Paginated response containing list of environments with total, previous and next links
        required:
            - environments
            - page
            - _links
        type: object
        properties:
            environments:
                type: array
                description: Array of environments
                items:
                    $ref: '#/definitions/EnvironmentModel'
            page:
                $ref: '#/definitions/PageModel'
            _links:
                $ref: '#/definitions/PaginationLinkModel'

    EnvironmentModel:
        type: object
        description: Environment model
        required:
            - id
            - name
            - role
            - type
        properties:
            id:
                type: string
                description: Unique environment identifier.
                example: 123456
            name:
                type: string
                description: Name used to identify a client's environment
                minLength: 1
                maxLength: 255
                example: use-case-sandbox-dev
            displayName:
                type: string
                description: Display name used if set to identify a client's environment
                minLength: 1
                maxLength: 255
                example: Dev sandbox environment
            role:
                type: string
                description: The client environment's role
                minLength: 1
                maxLength: 255
                example: use-case
            type:
                type: string
                enum:
                    - SHARED
                    - SANDBOX
                    - PROD
                    - PREVIEW
                description: The client environment's type
                minLength: 1
                maxLength: 255
                example: SANDBOX
            status:
                type: string
                description: The status of the environment
                enum:
                    - CREATED
                    - CREATION_IN_PROGRESS
                    - CREATION_FAILED
                    - FAILED
                    - DELETION_IN_PROGRESS
                    - DELETION_FAILED
                    - DELETED
                    - PENDING_PROVISIONING
                    - PROVISIONING_IN_PROGRESS
                    - UPGRADE_IN_PROGRESS
                    - ACTIVE
                minLength: 1
                maxLength: 50
                example: ACTIVE
            owner:
                type: string
                minLength: 1
                maxLength: 100
                description: Owner of this environment
                example: someone@example.com
            deployablesVersions:
                $ref: '#/definitions/DeployablesModel'
            softwareVersion:
                type: string
                description: version of Powercurve that is currently running

    LinkModel:
        type: object
        required:
            - href
        description: Represents a link to another resource
        properties:
            href:
                type: string
                description: URL to another resource
                example: 'https://dx-api.experianone.com/v1/environments?page=1'

    PaginationLinkModel:
        type: object
        properties:
            next:
                $ref: '#/definitions/LinkModel'
                description: Link to the next page of results
            previous:
                $ref: '#/definitions/LinkModel'
                description: Link to the previous page of results

    PageModel:
        type: object
        required:
            - size
            - totalElements
            - totalPages
            - number
            - sort
        description: Represents the page summary in a paged response
        properties:
            size:
                type: integer
                format: int32
                minimum: 0
                description: page size, i.e., the number of items to be listed in a page. Default value is 10.
                example: 0
            totalElements:
                type: integer
                format: int64
                minimum: 0
                description: Total number of elements in the returned results
                example: 32
            totalPages:
                type: integer
                format: int32
                minimum: 0
                description: how many pages are available so you can display 'page <number> of <totalPages>'
                example: 2
            number:
                type: integer
                format: int32
                minimum: 0
                description: current page number
                example: 0
            sort:
                type: array
                items:
