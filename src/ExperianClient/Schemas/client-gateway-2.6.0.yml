                - "Access Management"
            consumes:
                - application/json
            produces:
                - application/json
                - application/json
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/iamGroupId'
                -   in: body
                    name: body
                    description: Payload of the users to remove from the group
                    schema:
                        $ref: '#/definitions/UserIdList'
                    required: true
            responses:
                200:
                    description: The operation was successful
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                    schema:
                        $ref: '#/definitions/UnassignedGroupUsersStatus'
                400:
                    $ref: '#/responses/BadRequestError'
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                404:
                    $ref: '#/responses/NotFoundError'
                500:
                    $ref: '#/responses/InternalServerError'
    /access-management/users:
        get:
            summary: Get list of users
            description: Retrieve the list of available users. Invoke after triggering and the completion of a sync users job using the POST /access-management/users/jobs/synchronizations endpoint for the latest data.
            operationId: listUsers
            tags:
                - "Access Management"
            produces:
                - application/json
                - application/json
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
            responses:
                '200':
                    description: The operation was successful
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                    schema:
                        $ref: '#/definitions/UserList'

                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                500:
                    $ref: '#/responses/InternalServerError'
    /access-management/users/jobs/synchronizations:
        get:
            summary: Get sync users job status
            description: This endpoint can be used to poll and get the status for already triggered sync users job, intended to indicate whether a call to GET /access-management/users will return the latest users data.
            operationId: getSyncUsersJobStatus
            tags:
                - "Access Management"
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
            produces:
                - application/json
                - application/json
            responses:
                200:
                    description: The request was successful
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                    schema:
                        $ref: '#/definitions/SyncUsersJobStatus'
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                500:
                    $ref: '#/responses/InternalServerError'
        post:
            summary: Sync users
            description: This endpoint triggers a sync users job, which runs asynchronously and when completed, GET /access-management/users can return the latest users data. Clients can use the GET /access-management/users/jobs/synchronizations endpoint to poll for the status of the sync users job.
            operationId: triggerSyncUsersJob
            tags:
                - "Access Management"
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
            produces:
                - application/json
                - application/json
            responses:
                200:
                    description: The operation was successful
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                    schema:
                        $ref: '#/definitions/SyncUsersJob'
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                500:
                    $ref: '#/responses/InternalServerError'
    /access-management/users/{userId}/groups:
        post:
            summary: Add a list of groups to the specific user
            operationId: addGroupsToUser
            tags:
                - "Access Management"
            consumes:
                - application/json
            produces:
                - application/json
                - application/json
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/iamUserId'
                -   in: body
                    name: body
                    description: Payload of the groups to add
                    schema:
                        $ref: '#/definitions/GroupIdList'
                    required: true
            responses:
                200:
                    description: The operation was successful
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                    schema:
                        $ref: '#/definitions/AssignedUserGroupsStatus'
                400:
                    $ref: '#/responses/BadRequestError'
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                404:
                    $ref: '#/responses/NotFoundError'
                500:
                    $ref: '#/responses/InternalServerError'
    /access-management/users/{userId}/groups/delete:
        post:
            summary: Delete a list of groups from the specific user
            operationId: deleteGroupsFromUser
            tags:
                - "Access Management"
            consumes:
                - application/json
            produces:
                - application/json
                - application/json
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/iamUserId'
                -   in: body
                    name: body
                    description: Payload of the groups to remove from the user
                    schema:
                        $ref: '#/definitions/GroupIdList'
                    required: true
            responses:
                200:
                    description: The operation was successful
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                    schema:
                        $ref: '#/definitions/UnassignedUserGroupsStatus'
                400:
                    $ref: '#/responses/BadRequestError'
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                404:
                    $ref: '#/responses/NotFoundError'
                500:
                    $ref: '#/responses/InternalServerError'
    /environments/{environmentId}/configurations/diff:
        get:
            summary: List configuration differences for an environment
            description: |
                Returns configuration differences for the specified environment. The `type` query parameter selects which configuration category to list (for example tactical-parameter diffs).

                - The client sends a single GET request to retrieve matching events.
                - Responses may be **paginated via a `cursor`**. If the response includes a `cursor`, pass it back using the `cursor` query parameter to fetch the next page.
                - If any diff items include a **`url`** field, the diff contents exceed the inline threshold and **must be fetched** from the returned pre-signed URL (FMS/S3).
                - When `url` is present for many items, the client will need to make additional requests per item to retrieve the diff JSON.
            operationId: getConfigurationDiff
            tags:
                - Config Diff
            produces:
                - application/json
                - application/json
                - application/json
            parameters:
                -   $ref: '#/parameters/environmentId'
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/configurationDiffType'
                -   $ref: '#/parameters/eventFrom'
