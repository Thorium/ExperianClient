                    description: A deployment has been started.
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                403:
                    $ref: '#/responses/ForbiddenError'
                404:
                    $ref: '#/responses/NotFoundError'
    /{useCase}/hybrid/deployments:
        parameters:
