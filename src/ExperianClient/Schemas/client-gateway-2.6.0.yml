                        description: Service URL to use when all needed parts are uploaded and complete in order to finish the main file upload

    Pagination:
        type: object
        description: Pagination object will only be present when the optional "pagination" of the results is requested trough the "pageNumber" and "pageLimit" parameters
        properties:
            pageNumber:
