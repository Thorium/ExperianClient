                description: Total number of pages
                example: '5'
            links:
                type: object
                properties:
                    previousPage:
                        type: string
                        description: Service URL trough which the previous page can be loaded. Present only when there is previous page relevant to the current one.
                    nextPage:
                        type: string
                        description: Service URL trough which the next page can be loaded. Present only when there is next page relevant to the current one

    FileStatus:
        type: string
        description: The statuses in which the file goes through internally during file processing indicating their current state. The “NEW“ status is the initial one which will be set after successful creation of direct upload URL. The “VALIDATION“ status indicates that the file is currently under verification. The “READY“ status will be set after successful file verification. The “FAILED“ status is set if the file fails the verification process.
        example: READY
        enum:
            - NEW
            - VALIDATION
            - READY
            - FAILED
        default: NEW

