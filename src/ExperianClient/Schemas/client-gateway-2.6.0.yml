    ListShardsPostModel:
        type: object
        required:
            - PartitionKey
        properties:
            MaxResults:
                type: integer
                description: The maximum number of shards to return in a single call to ListShards. The maximum number of shards to return in a single call. The default value is 1000. At most 1000 results are returned.
                default: 1000
                minimum: 1
                maximum: 10000
            NextToken:
                type: string
                description: When the number of shards in the data stream is greater than the default value for the MaxResults parameter, or if you explicitly specify a value for MaxResults that is less than the number of shards in the data stream, the response includes a pagination token named NextToken. You can specify this NextToken value in a subsequent call to ListShards to list the next set of shards.
            PartitionKey:
                type: string
                description: Partition key used to filter and return appropriate shards.
                example: "PROD"
                pattern: "^(PROD|SANDBOX)$"
    ListShards:
        type: object
        description: Lists the shards in a stream and provides information about each shard.
        properties:
            NextToken:
                type: string
                description: When the number of shards in the data stream is greater than the default value for the MaxResults parameter, or if you explicitly specify a value for MaxResults that is less than the number of shards in the data stream, the response includes a pagination token named NextToken.
                minLength: 1
                maxLength: 1048576
            Shards:
                type: array
                items:
                    $ref: '#/definitions/Shard'
    Shard:
        type: object
        description: A uniquely identified group of data records in a Kinesis data stream.
        required:
            - SequenceNumberRange
            - ShardId
            - HashKeyRange
        properties:
            AdjacentParentShardId:
                type: string
                pattern: '[a-zA-Z0-9_.-]+'
                description: The shard ID of the shard adjacent to the shard's parent.
                minLength: 1
                maxLength: 128
            HashKeyRange:
                $ref: '#/definitions/HashKeyRange'
            ParentShardId:
                type: string
                description: The shard ID of the shard's parent.
                pattern: '[a-zA-Z0-9_.-]+'
                minLength: 1
                maxLength: 128
            SequenceNumberRange:
                $ref: '#/definitions/SequenceNumberRange'
            ShardId:
                type: string
                description: The unique identifier of the shard within the stream.
                pattern: '[a-zA-Z0-9_.-]+'
                minLength: 1
                maxLength: 128

    HashKeyRange:
        type: object
        description: The range of possible hash key values for the shard, which is a set of ordered contiguous positive integers.
        required:
            - EndingHashKey
            - StartingHashKey
        properties:
            EndingHashKey:
                type: string
                description: The ending hash key of the hash key range.
                pattern: '0|([1-9]\d{0,38})'
            StartingHashKey:
                type: string
                description: The starting hash key of the hash key range.
                pattern: '0|([1-9]\d{0,38})'

    SequenceNumberRange:
        type: object
        description: The range of possible sequence numbers for the shard.
        required:
            - StartingSequenceNumber
        properties:
            StartingSequenceNumber:
                type: string
                description: The starting sequence number for the range.
                pattern: '0|([1-9]\d{0,128})'
            EndingSequenceNumber:
                type: string
                description: The ending sequence number for the range. Shards that are in the OPEN state have an ending sequence number of null.
                pattern: '0|([1-9]\d{0,128})'

    GetShardIteratorPostModel:
        type: object
        required:
            - ShardId
            - ShardIteratorType
        properties:
            ShardId:
                type: string
                description: The shard ID of the Kinesis Data Streams shard to get the iterator for.
                pattern: '[a-zA-Z0-9_.-]+'
                minLength: 1
                maxLength: 128
            ShardIteratorType:
                type: string
                description: Determines how the shard iterator is used to start reading data records from the shard.
                enum:
                    - AT_SEQUENCE_NUMBER
                    - AFTER_SEQUENCE_NUMBER
                    - AT_TIMESTAMP
                    - TRIM_HORIZON
                    - LATEST
            StartingSequenceNumber:
                type: string
                description: Sequence number of record. Used with shard iterator type AT_SEQUENCE_NUMBER and AFTER_SEQUENCE_NUMBER.
                pattern: '0|([1-9]\d{0,128})'
            Timestamp:
                type: string
                format: date-time
                description: The approximate time that the record was inserted into the stream. Used with shard iterator type AT_TIMESTAMP
                example: '2016-04-04T19:58:36Z'

    GetShardIterator:
        type: object
        properties:
            ShardIterator:
                type: string
                description: The position in the shard from which to start reading data records sequentially.
                minLength: 1
                maxLength: 512

    GetRecordsPostModel:
        type: object
        required:
            - ShardIterator
            - PartitionKey
        description: A shard iterator specifies the shard position from which to start reading data records sequentially.
        properties:
            Limit:
                type: integer
                description: The maximum number of records to return. Specify a value of up to 10,000. The default value is 10,000.
            ShardIterator:
                type: string
                description: The position in the shard from which you want to start sequentially reading data records. A shard iterator specifies this position using the sequence number of a data record in the shard
                example: AAAAAAAAAAHscuRQ8D0o3uT+Cq9tuOHpNSqA2Alkck+q2BJrIT5toFyInwpwuDzkLsbGxBW0WouFeOVlU2BynM96aehmbc81y+8wba7LSVHb+BuQO0D+CfkgB5Ja1xIiiaCovTRYhnUwI83pw6+xaEWOsVg/teO7K0f9uPGvQNFGNMW6Y5P6uI0B6W0TGWTAGFA3EIYtnKUkbE91feRGjDgs8fj9NzX+lYlNXcucwXXiJI+Fe2oYBoYbSRAEVAIQM8Ipavy/1/w=
                minLength: 1
                maxLength: 512
            PartitionKey:
                type: string
                description: Partition key used to filter and return appropriate records. When partition key is provided, valid values are PROD or SANDBOX based on which filtered records will be returned. In case partition key is not provided, no filtration is done.
                example: "PROD"
                pattern: "^(PROD|SANDBOX)$"

    GetRecords:
        type: object
        properties:
            ChildShards:
                type: array
                items:
                    $ref: '#/definitions/ChildShard'
            MillisBehindLatest:
                type: integer
                description: The number of milliseconds the GetRecords response is from the tip of the stream, indicating how far behind current time the consumer is. A value of zero indicates that record processing is caught up, and there are no new records to process at this moment.
                minimum: 0
            NextShardIterator:
                type: string
                description: The next position in the shard from which to start sequentially reading data records. If set to null, the shard has been closed and the requested iterator does not return any more data.
                minLength: 1
                maxLength: 512
            Records:
                type: array
                items:
                    $ref: '#/definitions/Record'

    ChildShard:
        type: object
        required:
            - HashKeyRange
            - ParentShards
            - ShardId
        properties:
            HashKeyRange:
                $ref: '#/definitions/HashKeyRange'
            ParentShards:
                type: array
                items:
                    type: string
                    description: The current shard that is the parent of the existing child shard.
                    pattern: '[a-zA-Z0-9_.-]+'
                    minLength: 1
                    maxLength: 128
            ShardId:
                type: string
                description: The shard ID of the existing child shard of the current shard.
                pattern: '[a-zA-Z0-9_.-]+'
                minLength: 1
                maxLength: 128

    Record:
        type: object
        required:
            - PartitionKey
            - SequenceNumber
        properties:
            ApproximateArrivalTimestamp:
                type: integer
                description: The approximate time that the record was inserted into the stream.
            Data:
                type: string
                format: byte
                description: The data blob. The data in the blob is both opaque and immutable to Kinesis Data Streams, which does not inspect, interpret, or change the data in the blob in any way. When the data blob (the payload before base64-encoding) is added to the partition key size, the total size must not exceed the maximum record size (1 MiB).
            EncryptionType:
                type: string
                description: The encryption type used on the record. This parameter can be one of the following values
                enum:
                    - NONE
                    - KMS
            PartitionKey:
                type: string
                description: Identifies which shard in the stream the data record is assigned to.
                minLength: 1
                maxLength: 256
            SequenceNumber:
                type: string
                description: The unique identifier of the record within its shard.
                pattern: '0|([1-9]\d{0,128})'
    TacticalParamGroups:
        type: "array"
        items:
            $ref: "#/definitions/TacticalParamGroup"
    TacticalParamGroup:
        type: "object"
        required:
            - id
            - name
        properties:
            id:
                type: "string"
                description: "The id of the group"
                example: "5fe2316d492f4752a58097d9bded33b2"
                maxLength: 256
            name:
                type: "string"
                description: "The name of the group"
                example: "Underwriter Parameter - Get Underwriter Parameter"
    TacticalParameterVersions:
        type: "array"
        items:
            description: "The available versions of a parameter group."
            $ref: "#/definitions/TacticalParameterVersion"
    TacticalParameterVersion:
        allOf:
            - $ref: "#/definitions/ConfigId"
            - type: "object"
              required:
                  - configId
                  - version
                  - description
              properties:
                  legacyVersion:
                      type: "string"
                      description: "Present if the version was created using legacy versioning scheme."
                  version:
                      type: "string"
                      description: "The version number of this group."
                      example: "3"
                  description:
                      type: "string"
                      description: "The description of the version."
                      example: "The addition of a the 2020 debit card options."
                  date:
                      type: "string"
                      format: "date-time"
                      description: "The date and time that the version was published or deployed into the environment."
                      example: "2019-01-21T10:21:00Z"
                  statusInEnvironment:
                      type: "string"
                      # Only returned if the env has been specified in the request.
                      enum:
                          - active
                          - scheduled
                          - expired
                          - overridden
                      description: >
                          Sort order:
                           * active - In the environment of interest the group is currently being used for decisioning based on its scheduled active dates.
                           * scheduled - In the environment of interest the group is not currently being used for decisioning but is scheduled to become active at a future date.
                           * expired - In the environment of interest the group has been scheduled to expire before the current date.
                           * overridden - In the environment of interest the group would be active given its scheduled dates but a later version has taken precedence.
    DraftModel:
        type: "object"
        description: "The draft parameter group to be saved."
        required:
            - description
            - records
            - checksum
        properties:
            description:
                type: "string"
                description: "The description for the draft."
                example: "Spring 2019 Loan Offers."
            records:
                $ref: "#/definitions/RecordsModel"
            checksum:
                type: "string"
                description: "This field should be supplied when updating a version and is used to check for save conflicts."
                example: "7c9bec2a9df7c91a9a7cc1a973530085c9649665629e54c52c99f4d31e0dc0f8"
    RecordsModel:
        type: "array"
        description: "A list of records to save for this group."
        items:
            $ref: "#/definitions/RecordModel"
    RecordModel:
        type: "array"
        description: "A record to save for this group - note that if a value in the Record is for a dropdown, the internal code for that value will be expected."
        items:
            type: string
    TacticalParameterDraftUpdated:
        type: object
        properties:
            checksum:
                type: string
                example: "7c9bec2a9df7c91a9a7cc1a973530085c9649665629e54c52c99f4d31e0dc0f8"
    PublicationModel:
        type: "object"
        description: "The draft parameter group to be published."
        required:
            - checksum
        properties:
            checksum:
                type: "string"
                description: "This field should be supplied when publishing a version and is used to check for stale data."
                example: "7c9bec2a9df7c91a9a7cc1a973530085c9649665629e54c52c99f4d31e0dc0f8"
    ConfigVersionModel:
        allOf:
            - $ref: "#/definitions/ConfigId"
        required:
            - configId
    ConfigId:
        type: "object"
        required:
            - configId
        properties:
            configId:
                type: "string"
                description: "The identifier by which this configuration version is known."
                maxLength: 256
    TacticalParameterScreen:
        type: "object"
        required:
            - container
        properties:
            container:
                $ref: "#/definitions/Container"
    Container:
        allOf:
            - $ref: "#/definitions/SharedDisplayComponentSchema"
            - type: "object"
              required:
                  - content
              properties:
                  content:
                      $ref: "#/definitions/Components"
    Components:
        type: "array"
        items:
            $ref: "#/definitions/Component"
    Component:
        type: "object"
        description: "A component will be typed according to one, and only one, of these properties."
        # What is needed here is swagger-3 `oneOf` for polymorphism.
        properties:
            parametersTable:
                $ref: "#/definitions/ParametersTableComponent"
    ParametersTableComponent:
        allOf:
            - $ref: "#/definitions/SharedInputComponentSchema"
            - type: "object"
              required:
                  - config
              properties:
                  config:
                      $ref: "#/definitions/ParametersTableComponentConfiguration"
    ParametersTableComponentConfiguration:
        type: "object"
        required:
            - propertyId
            - parametersGroupName
            - checksum
            - overview
            - values
            - table
        properties:
            propertyId:
                description: "The id of the component property which is unique within the screen so can be used to reference the property and access its value(s)."
                example: "parameter-table-values"
                type: "string"
            parametersGroupName:
                description: "The parameter group name which can be used in a tab title for example."
                example: "Address Parameters"
                type: "string"
            checksum:
                type: "string"
                description: "This field should be supplied when updating a version and is used to check for save conflicts."
                example: "ABCD"
            overview:
                $ref: "#/definitions/ParametersTableOverview"
            table:
                $ref: "#/definitions/ParametersTableProperties"
            values:
                # matrix
                type: "array"
                items:
                    # rows
                    type: "array"
                    items:
                        # cells
                        type: "string"
                        description: "The string version of the value of the cell - note that if a value is for a dropdown, the internal code for that value will be supplied"
                        example: "25"
    ParametersTableOverview:
        type: "object"
        required:
            - description
            - type
            - version
            - timestamp
            - stampedBy
        properties:
            description:
                type: "string"
                description: "A user entered description that provides information about this version of the group."
                example: "Spring 2019 loans offer"
            type:
                type: "string"
                example: "Experian"
            version:
                type: "string"
                description: "The version associated to the parameter group."
                example: "5"
            timestamp:
                type: "string"
                format: "date-time"
                description: "The date and time when the version was created or last changed."
                example: "2019-01-21T10:21:00Z"
            stampedBy:
                type: "string"
                description: "The user that responsible for the last timestamp."
                example: "jack.smith@experian.com"
    ParametersTableProperties:
        required:
            - section
            - columns
        properties:
            section:
                type: "array"
                items:
                    $ref: "#/definitions/ParametersTableHeaderSectionProperties"
            columns:
                type: "array"
                items:
                    $ref: "#/definitions/ParametersTableColumnProperties"
    ParametersTableHeaderSectionProperties:
        required:
            - label
            - span
        properties:
            label:
                type: "string"
                description: "A label for header"
                example: "Input"
            span:
                type: "integer"
                description: "The number of columns this section spans, for example if we three Input columns and two Output columns, Input=3, Output=2"
                example: 1
    ParametersTableColumnProperties:
        required:
            - label
            - required
            - span
        properties:
            label:
                type: "string"
                description: "A label for the column"
                example: "Age Limit"
            required:
                type: "boolean"
                description: "Indicates if entry in this field is mandatory."
                example: true
            type:
                $ref: "#/definitions/ColumnType"
    ColumnType:
        type: "object"
        description: "A column will be typed according to one, and only one, of these properties."
        # What is needed here is swagger-3 `oneOf` for polymorphism.
        properties:
            textField:
                $ref: "#/definitions/TextFieldMeta"
            customDropDown:
                $ref: "#/definitions/CustomDropDownMetaModel"
            dropDown:
                $ref: "#/definitions/DropDownMetaModel"
    DropDownMetaModel:
        allOf:
            - type: "object"
              required:
                  - entries
              properties:
                  entries:
                      type: "array"
                      description: "An array of entries for the drop down containing the available choices."
                      items:
                          $ref: "#/definitions/DropDownChoice"
    DropDownChoice:
        type: "object"
        required:
            - label
            - internalCode
        properties:
            label:
                type: "string"
                description: "The label to display in the drop down."
                example: "United Kingdom"
            internalCode:
                type: "string"
                description: "The value for the selected label."
                example: "UK"
    CustomDropDownMetaModel:
        allOf:
            - type: "object"
              required:
                  - dynamicName
                  - dynamicKey
                  - entries
                  - _links
              properties:
                  dynamicName:
                      type: "string"
                      description: "The name of the drop-down group containing the entries of interest."
                      example: "Country-State-City"
                  dynamicKey:
                      type: "string"
                      description: "The Key of the drop-down group containing the entries of interest."
                  entries:
                      type: "array"
                      description: "An array of entries for the drop down containing the available choices."
                      items:
                          $ref: "#/definitions/CustomDropDownChoice"
                  _links:
                      type: "object"
                      properties:
                          getRootChoices:
                              description: "The link to get a refreshed list of drop down choices for a root custom drop down."
                              example: "/v0/parameters/custom-dropdown/BODYGUARD/children"
                              $ref: "#/definitions/Link"
    CustomDropDownChoice:
        allOf:
            - $ref: "#/definitions/DropDownChoice"
            - type: "object"
              required:
                  - internalCode
                  - label
                  - _links
              properties:
                  internalCode:
                      type: "string"
                      description: "The internal code of the drop down entry."
                      example: "UK"
                  label:
                      type: "string"
                      description: "The label of the of the drop down entry."
                      example: "United Kingdom"
                  _links:
                      type: "array"
                      description: "Links of entries include its children"
                      items:
                          $ref: "#/definitions/Link"
    Link:
        type: "object"
        properties:
            rel:
                type: "string"
                example: "children"
            type:
                type: "string"
                example: "GET"
            href:
                type: "string"
                example: "/v0/parameters/custom-dropdown/BODYGUARD/children"
    TextFieldMeta:
        type: "object"
        required:
            - type
            - length
        properties:
            type:
                # May become an enum once the known possible value set is formalised.
                type: "string"
                description: "The type of data that can be entered in the text field."
                # Known possible values: String/Integer/Float/Decimal
                example: "String"
            length:
                type: "integer"
                description: "The number of characters that can be entered in the text field (excludes the decimal point for fractional numbers)."
                example: "40"
            scale:
                type: "integer"
                description: "The scale for field types of which are fractional, ie the number of digits after the decimal point."
                example: "2"
            password:
                type: "boolean"
                description: "True if the text field is a password."
                example: false
    SharedInputComponentSchema:
        allOf:
            - $ref: "#/definitions/SharedDisplayComponentSchema"
            - type: "object"
              properties:
                  enableCondition:
                      $ref: "#/definitions/Condition"
                  required:
                      type: "boolean"
                      description: "Indicates if entry of the field is mandatory."
                      example: true
                  toolTip:
                      type: "string"
                      description: "The associated tool-tip text."
                      example: "Press here to proceed."
    SharedDisplayComponentSchema:
        type: "object"
        required:
            - componentId
        properties:
            componentId:
                description: "The id of the component which will be unique within the screen."
                example: "main-container-parameters"
                type: "string"
    Condition:
        type: "object"
        description: "Absence of a Condition indices true; if present this is always EITHER a boolean result OR a map of regular expression comparisons to all be evaluated, all of which must be true for the condition to be true."
        # What is needed here is swagger-3 `oneOf` for polymorphism.
        properties:
            regex:
                description: "A map of regular expression comparisons which should be evaluated against the value referenced by the map key to return true if the referenced value matches the regular expression. All entries in the map must evaluate to true for the condition to be true."
                example: "drop-down-name-text : $A.*  (note this represents a key:value entry in a map of many entries)"
                type: object
                additionalProperties:
                    type: "string"
            result:
                type: "boolean"
                description: "If the condition contains a result, that result value is the state of the condition."
                example: false
    DeploymentModel:
        type: "object"
        required:
            - description
            - sourceEnvironment
            - auditIds
            - schedule
        properties:
            description:
                type: "string"
                description: "The user defined description for this Audit."
                example: "Spring 2012"
                minLength: 1
            sourceEnvironment:
                type: "integer"
                format: "int64"
                description: "Environment from which the config is currently deployed to"
                example: 2345
            auditIds:
                type: "array"
                description: |
                    A list of deployments in relation to the config type being deployed.
                    N.B. The supported config types are part of the description of the GET ../promotion/configs endpoint.
                example: '["7d3cc7f6-1fa7-44aa-ae16-6047d5faca17", "3d0c4164-1540-4a7d-a3cf-cd68e5853b58"]'
                items:
                    type: "string"
                    minLength: 1
                minItems: 1
                uniqueItems: true
            schedule:
                $ref: "#/definitions/Schedule"
    Schedule:
        description: |
            Scheduling information.
            Insert `{}` if no schedule is planned.
            * For example:
                `"schedule": {}`
        type: "object"
        properties:
            scheduledFrom:
                type: "string"
                example: "2012-04-01T00:00:00Z"
                format: "date-time"
                description: "The scheduled from date for the configuration being deployed (where relevant)."
            scheduledTo:
                type: "string"
                example: "2022-03-31T23:59:59Z"
                format: "date-time"
                description: "The scheduled to date for the configuration being deployed (where relevant)."
    ConfigAudits:
        type: "object"
        properties:
            schedulableTypes:
                type: "array"
                items:
                    properties:
                        configType:
                            type: string
                            example: TACTICAL_PARAMETER_SET
            ownershipTypes:
                description: "A list of the ownership types of interest to this user"
                type: "array"
                items:
                    properties:
                        ownership:
                            type: "string"
                            enum: *OWNERSHIP
                            example: "CLIENT"
            statusTypes:
                description: "A list of the status types"
                type: "array"
                items:
                    properties:
                        status:
                            type: "string"
                            enum: *STATUS
                            example: "ACTIVE"
            audits:
                type: "array"
                items:
                    $ref: "#/definitions/ConfigAudit"
                example:
                    - auditId: 7d3cc7f6-1fa7-44aa-ae16-6047d5faca17
                      auditDTM: 2012-04-01T00:00:00Z
                      userId: solution-dev@example.com
                      userDisplayName: solution-dev@example.com
                      configType: TACTICAL_PARAMETER_SET
                      name: MiddleName_Mandatory - TP - Middle Name Mandatory
                      configVersion: 2
                      auditType: Deployed
                      status: ACTIVE
                      description: TP change
                      scheduledFrom: 2023-07-21T00:00:00Z
                      scheduledTo: 2023-07-23T23:59:59Z
                      sourceEnvironment: 24750
                      sourceId: aeeabb0c-1e77-4756-ad4d-0aa5f0a935ce
                      latest: true
                      reverted: false
                      ownership: CLIENT
                      edition: 321213856
                    - auditId: ccf89a77-64ae-4182-af2d-5190244c2e76
                      auditDTM: 2023-07-31T04:03:27.141886455Z
                      userId: solution-dev@example.com
                      userDisplayName: solution-dev@example.com
                      configId: XrsxGxv7W9
                      configType: Solution_Promo
                      name: Business Process Composition
                      configVersion: 2
                      auditType: Deployed
                      status: ACTIVE
                      subStatus: CONFIRMED
                      description: New deployment
                      sourceEnvironment: 24750
                      sourceId: bdeabb0c-1e77-4756-ad4d-0aa5f0a935ce
                      latest: true
                      ownership: CLIENT
                      edition: 321213860
                    - auditId: 79979337-3e0c-49e9-9f94-e1ccb80f24e3
                      auditDTM: 2023-07-31T04:11:02.253949255Z
                      userId: solution-dev@example.com
                      userDisplayName: solution-dev@example.com
                      configId: SnjHwcChbX
                      configType: Strategy_Promo
                      name: Pre-Bureau
                      configVersion: 3
                      auditType: Deployed
                      status: PENDING
                      description: PENDING2
                      sourceEnvironment: 24750
                      sourceId: 72393838-5dae-4ab3-a95a-4ff1523b2a96
                      latest: false
                      ownership: CLIENT
                      edition: 321213859
                    - auditId: 140ce443-cdcc-4b04-a997-b2dc8ed40b8f
                      auditDTM: 2023-08-01T01:16:55.347151847Z
                      userId: solution-dev@example.com
                      userDisplayName: solution-dev@example.com
                      configId: 22h7sKjDzY
                      configType: EAS_Promo
                      name: INExpCon_EAS
                      configVersion: 1
                      auditType: Deployed
                      status: FAILED
                      sourceEnvironment: 24750
                      sourceId: 4a941ef9-039e-4337-bcdc-610bf8a6d5df
                      latest: true
                      reverted: false
                      ownership: CLIENT
                      edition: 321213857
    ConfigAudit:
        type: "object"
        required:
            - auditId
            - auditDTM
            - userId
            - userDisplayName
            - configType
            - name
            - configVersion
            - status
            - description
            - latest
            - ownership
        properties:
            auditId:
                type: "string"
                description: "The unique id for the audit."
                minLength: 1
                example: 7d3cc7f6-1fa7-44aa-ae16-6047d5faca17
            auditDTM:
                type: "string"
                example: "2012-04-01T00:00:00Z"
                format: "date-time"
                description: "The time that the version was published/deployed/rolled back."
                minLength: 1
            userId:
                type: "string"
                description: "The id of the user that published/deployed/rolled back the configuration."
                minLength: 1
                example: solution-dev@example.com
            userDisplayName:
                type: "string"
                description: "The name of the user that published the configuration. This can be used to provide a more user friendly name to display to users when the user Id from authentication data is not in the desired format. This field is not used for any authentication, authorisation, or validation purposes and is captured for display purposes only. If the userDisplayName override has not been provided this will be set to the userId value."
                minLength: 1
                example: solution-dev@example.com
            configId:
                type: "string"
                description: "The unique id for the published config."
                minLength: 1
                example: Xesz3BDTjy
            configType:
                type: "string"
                description: "The type of configuration to which this audit relates."
                minLength: 1
                maxLength: 50
                example: TACTICAL_PARAMETER_SET
            name:
                type: "string"
                description: "The name of the configuration, e.g. the TP Group name."
                minLength: 1
                example: MiddleName_Mandatory - TP - Middle Name Mandatory
            configVersion:
                type: "string"
                description: "The version from which this configuration was published/deployed/rolled back."
                example: "2"
                maxLength: 50
            auditType:
                type: "string"
                description: "How this audit was created, Published or Deployed."
                example: Deployed
            status:
                type: "string"
                description: |
                    The current status of the configuration in this environment i.e. Pending, Active, Scheduled, Overridden, Expired, Failed, Invalid.
                    ```
                    PENDING: Deployment to environment in progress and may or may not be active at this moment.

                    FAILED: Deployment to environment failed and is not expected to become active.

                    ACTIVE: Configuration is successfully deployed and currently in use.

                    OVERRIDDEN: The old configuration that has been overridden by promote, or copy or restore. This is due to other version being active now.

                    SCHEDULED: The configuration is currently being scheduled. This is due to become active in the future, but the recent version is active now.

                    EXPIRED: When the scheduled is timeout, the status will become expired.

                    REMOVED: The audits belongs to a configuration for which it has been performed a remove action.

                    INVALID: The audits belongs to an invalid configuration.
                    ```
                enum: *STATUS
            subStatus:
                type: "string"
                description: |
                    The current subStatus of the configuration in this environment when the status is Pending i.e. PENDING1, PENDING2, PENDING3.
                    ```
                    PENDING1: The deployment to environment is in PENDING status and may or may not be active this precise moment

                    PENDING2: The deployment is in ACKNOWLEDGE status and the promotion event consumer has received the event

                    PENDING3: The deployment is in ACCEPT status and determined that it is valid.

                    CONFIRMED: The status has been consolidated and will not further evolve during the promotion process
                    ```
                enum: *SUBSTATUS
            description:
                type: "string"
                description: "The user defined description for this Audit."
                example: "Spring 2012"
            scheduledFrom:
                type: "string"
                example: "2012-04-01T00:00:00Z"
                format: "date-time"
                description: "The scheduled from date for the published configuration (where relevant)."
            scheduledTo:
                type: "string"
                example: "2022-03-31T23:59:59Z"
                format: "date-time"
                description: "The scheduled to date for the published configuration (where relevant)."
            sourceEnvironment:
                type: "string"
                description: "The id of the environment from which the configuration originated. If not specified when the promotion was created this value defaults to 'UNASSIGNED' to indicate that no environment Id was supplied and the data came from an external source."
                example: "1234567890123456789"
                maxLength: 20
            sourceId:
                type: "string"
                description: "The id of the audit from which the promotion or rollback was triggered"
                example: aeeabb0c-1e77-4756-ad4d-0aa5f0a935ce
            latest:
                type: "boolean"
                description: "A flag indicating the latest version of each name of configuration that is in that environment, i.e. not rolled back."
                example: true
            reverted:
                type: "boolean"
                description: "Indicates if the configuration in this Audit was rolled back at a later point."
                example: false
            ownership:
                type: "string"
                enum: *OWNERSHIP
                description: "The owner of the configuration data: CLIENT = access open to client (default); PROPRIETARY = access restricted to Experian."
                default: "CLIENT"
                example: "PROPRIETARY"
            edition:
                type: "string"
                description: "Reference for this version of the configuration which can be used to compare against the active running configuration in an environment"
                minLength: 0
                maxLength: 50
    Resource:
        type: "object"
        format: "binary"
    ProductTemplate:
        type: object
        properties:
            id:
                type: string
                description: Product template ID
                example: usecase-template
            name:
                type: string
                description: Product template name
                example: Use Case Template
            isDeleted:
                type: boolean
                description: True if the product template is deleted
                example: false
    ProductCustomOption:
        allOf:
            -   $ref: '#/definitions/UpdateProductCustomOption'
            -   type: object
                properties:
                    type:
                        $ref: '#/definitions/ProductOptionType'
    UpdateProductCustomOption:
        type: object
        required:
            - displayName
            - name
            - permissionGroups
        properties:
            displayName:
                type: string
                description: Custom role display name
                example: Custom Role 1
                minLength: 1
                maxLength: 100
                pattern: ^.*\S.*$
            name:
                type: string
                description: Custom role name
                example: $PREFIX_CUSTOM_OPTION_1
                minLength: 1
                maxLength: 100
                pattern: ^.*\S.*$
            permissionGroups:
                type: array
                description: Permission groups associated with custom option
                items:
                    $ref: '#/definitions/CustomOptionPermissionGroup'
                example:
                    -   name: Manage Resources
                    -   name: Read Resources
    ProductOptionType:
        type: string
        description: Product option type
        enum:
            - boolean
            - text
        example: boolean
    CustomOptionPermissionGroup:
        type: object
        description: Permission group associated to the template
        properties:
            name:
                type: string
                description: Name of permission group
    ProductEnvironment:
        allOf:
            -   $ref: '#/definitions/Environment'
            -   type: object
                properties:
                    isDeleted:
                        type: boolean
                        description: True if the environment is deleted
                        example: false
    Environment:
        type: object
        properties:
            id:
                type: integer
                format: int64
                description: Environment ID
                example: 1
            name:
                type: string
                description: Environment name
                example: User Journey (Prod)
            type:
                type: string
                description: Environment type
                example: PROD
            role:
                type: string
                description: Environment role
                example: pc-userjourney
    GroupList:
        type: object
        properties:
            groups:
                type: array
                items:
                    $ref: '#/definitions/Group'
    Group:
        type: object
        properties:
            id:
                type: integer
                description: Group ID
                example: '1'
            type:
                type: string
                enum:
                    - client
                description: Group type
                example: client
            name:
                type: string
                description: Group name
                example: Client Administrator
            description:
                type: string
                description: Group description
                example: Client Administrator
            urn:
                type: string
                description: Group URN
                example: urn:e1:iam:group:V4CRUlqbb3C0UWhP
            products:
                type: array
                items:
                    $ref: '#/definitions/GroupProduct'
    GroupProduct:
        type: object
        properties:
            id:
                type: integer
                description: Product ID
                example: '1'
            type:
                type: string
                enum:
                    - client
                description: Product type
                example: client
            name:
                type: string
                description: Product name
                example: User Journey (Prod)
            description:
                type: string
                description: Product description
                example: User Journey for Production
            environment:
                $ref: '#/definitions/ProductEnvironment'
            template:
                $ref: '#/definitions/ProductTemplate'
            options:
                type: array
                items:
                    $ref: '#/definitions/GroupProductOption'
    GroupProductOption:
        properties:
            name:
                type: string
                description: Product option name
                example: CLIENT_ADMIN
            displayName:
                type: string
                description: Product option display name
                example: Client Administrator
            value:
                type: string
                description: Product option value
                example: 'true'
            type:
                $ref: '#/definitions/ProductOptionType'
            isDeleted:
                type: boolean
                description: True if the product option is deleted
                example: false
    UserList:
        type: object
        properties:
            users:
                type: array
                items:
                    $ref: '#/definitions/User'
    User:
        type: object
        properties:
            id:
                type: integer
                description: User ID
                example: '1'
            idpId:
                type: string
                description: User ID in the IDP
                example: ex_stan.marsh@example.com
            type:
                type: string
                enum:
                    - client
                description: User type
                example: client
            status:
                type: string
                description: Status
                enum:
                    - ACTIVE
                    - DELETED
                    - INIT
            profile:
                type: object
                properties:
                    userName:
                        type: string
                        description: User name
                        example: stan.marsh@example.com
                    firstName:
                        type: string
                        description: User first name
                        example: Stan
                    lastName:
                        type: string
                        description: User last name
                        example: Marsh
                    source:
                        type: object
                        properties:
                            companyId:
                                type: string
                                description: User company id
                                example: '123456'
                            groupName:
                                type: string
                                description: User group name
                                example: Admin
            source:
                $ref: '#/definitions/UserSourceEnum'
            tags:
                type: array
                description: List of user tags
                items:
                    $ref: '#/definitions/UserTags'
    UserSourceEnum:
        type: string
        enum:
            - b2b_okta
            - ams
        description: Source of user creation
        example: "b2b_okta"
    UserTags:
        type: object
        description: User tags for tagging
        properties:
            key:
                type: string
            value:
                type: string
    SyncUsersJob:
        type: object
        properties:
            job:
                type: object
                properties:
                    startedAt:
                        type: string
                        description: Timestamp when the job is started (ISO 8601 format)
                        example: '2020-01-01T12:00:00.000Z'
                    status:
                        type: string
                        description: Status of the new sync users job
                        enum:
                            - STARTED
                            - RUNNING
    SyncUsersJobStatus:
        type: object
        properties:
            successAt:
                type: string
                description: Timestamp when the users list is updated successfully (ISO 8601 format). It will be omitted if there's no job started yet.
                example: '2020-01-01T12:00:00.000Z'
            job:
                type: object
                properties:
                    startedAt:
                        type: string
                        description: Timestamp when the job is started (ISO 8601 format)
                        example: '2020-01-01T12:00:00.000Z'
                    updatedAt:
                        type: string
                        description: Timestamp when the job is updated (ISO 8601 format)
                        example: '2020-01-01T12:00:00.000Z'
                    status:
                        type: string
                        description: Status of the current sync users job
                        enum:
                            - NOT_STARTED
                            - SUCCESS
                            - ERROR
                            - RUNNING
                            - STALED
                    errorDetails:
                        type: object
                        properties:
                            reason:
                                type: string
                                description: Reason of the error
                                example: Internal server error
                            xcorrelationId:
                                type: string
                                description: The correlation ID for this error
                                example: xCorrelationId
    GroupIdList:
        type: object
        required:
            - groups
        properties:
            groups:
                type: array
                items:
                    $ref: '#/definitions/GroupIdItem'
                description: List of groups identified by numeric id
    GroupIdItem:
        type: object
        required:
            - id
        properties:
            id:
                type: string
                pattern: ^[0-9]+$
                description: Id of group
                example: '1'
    UserIdList:
        type: object
        required:
            - users
        properties:
            users:
                type: array
                items:
                    $ref: '#/definitions/UserIdItem'
                description: List of users identified by numeric id
    UserIdItem:
        type: object
        required:
            - id
        properties:
            id:
                type: string
                pattern: ^[0-9]+$
                description: Id of user
                example: '1'
    AssignedUserGroupsStatus:
        type: object
        properties:
            assignedCount:
                type: integer
                description: Assigned groups count to user
                example: '1'
            alreadyAssignedCount:
                type: integer
                description: Already assigned groups count to user
                example: '1'
    UnassignedUserGroupsStatus:
        type: object
        properties:
            unassignedCount:
                type: integer
                description: Unassigned group count from user
                example: '1'
            alreadyUnassignedCount:
                type: integer
                description: Already unassigned group count from user
                example: '1'
    AssignedGroupUsersStatus:
        type: object
        properties:
            assignedCount:
                type: integer
                description: Assigned users count to group
                example: '1'
            alreadyAssignedCount:
                type: integer
                description: Already assigned users count to group
                example: '1'
    UnassignedGroupUsersStatus:
        type: object
        properties:
            unassignedCount:
                type: integer
                description: Unassigned users count from group
                example: '1'
            alreadyUnassignedCount:
                type: integer
                description: Already unassigned users count from group
                example: '1'
    DiffListResponse:
        type: object
        description: A page of diff records plus an optional cursor for the next page.
        properties:
            items:
                type: array
                items:
                    $ref: '#/definitions/DiffRecord'
            cursor:
                type: string
                description: Opaque token to fetch the next page. Omitted or null when no further pages.
        required: [ items ]
    DiffRecord:
        type: object
        description: A configuration diff record.
        properties:
            diffId:
                type: string
                format: uuid
                description: Unique identifier for the diff record.
            environmentId:
                type: string
                description: Usecase environment ID.
            type:
                type: string
                description: Configuration type (e.g., tacticalParameters).
                example: tacticalParameters
                enum: [ tacticalParameters ]
            name:
                type: string
                description: Name of the Tactical Parameter.
            fromVersion:
                type: integer
                format: int64
                description: Starting version (null for initial deployment).
            toVersion:
                type: integer
                format: int64
                description: Ending/deployed version.
            sizeBytes:
                type: integer
                format: int64
                description: Size of the diff content in bytes.
            isCurrent:
                type: boolean
                description: Whether this is the latest diff for this TP.
            event:
                $ref: '#/definitions/DiffEvent'
            createdAt:
                type: string
                format: date-time
                description: When this diff record was created (ISO 8601).
            changes:
                type: object
                description: INLINE diff changes (present when under the inline threshold).
            filename:
                type: string
                description: Original filename of the diff file (in FMS).
            fileId:
                type: string
                format: uuid
                description: UUID of the diff file stored in FMS (when applicable).
            status:
                type: string
                description: Status of the diff record.
                enum: [ A, F, R ]
    DiffEvent:
        type: object
        properties:
            id:
                type: string
                description: Event identifier
            action:
                type: string
                description: Event action
                example: deploying
            result:
                type: string
                description: Result of the action
                enum: [ success, failure ]
            userId:
                type: string
                description: User or service principal
            createdAt:
                type: string
                format: date-time
        required: [ id, action, result, createdAt ]
