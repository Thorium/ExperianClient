            description: "Returns persisted failed events based on the provided filters - startDate, endDate and eventType. Pagination is also enabled through the page and pageSize parameters. The search should be at least by start and end date or by eventType. There is a default retention period of 60 days and all failed events older than that will be deleted automatically."
            operationId: "getFailedEvents"
            produces:
                - "application/json"
                - "application/json"
            parameters:
                - $ref: '#/parameters/authorization'
                - $ref: "#/parameters/correlationId"
                - name: "startDate"
                  in: "query"
                  description: "starting date in format dd/mm/yyyy"
                  required: false
                  type: "string"
                - name: "endDate"
                  in: "query"
                  description: "ending date in format dd/mm/yyyy"
                  required: false
                  type: "string"
                - name: "eventType"
                  in: "query"
                  description: "The event type e.g: filemgmt:Uploaded File"
                  required: false
                  type: "string"
                - name: "page"
                  in: "query"
                  description: "The page index. Defaults to 1."
                  required: false
                  type: "integer"
                  minimum: 1
                - name: "pageSize"
                  in: "query"
                  description: "The number of desired failed events to be shown per page. 20 events are displayed by default."
                  required: false
                  type: "integer"
                  minimum: 1
            responses:
                "200":
                    description: "Json object representing the desired page, having all found failed events set in an array"
                    schema:
                        $ref: "#/definitions/PaginatedFailedEvents"
                "400":
                    $ref: '#/responses/BadRequestError'
                "401":
                    $ref: '#/responses/UnauthorisedError'
                "403":
                    $ref: '#/responses/ForbiddenError'
                "404":
                    $ref: '#/responses/NotFoundError'
                "500":
                    $ref: '#/responses/InternalServerError'

