                example: '400'
            description:
                type: string
                minLength: 1
                description: Error description.
                example: Authentication Failed
            reason:
                type: string
                minLength: 1
                description: Error reason.
    ErrorDetail:
        type: object
        properties:
            field:
                type: string
                description: The property in the JSON payload that has failed validation.
                example: user.email
            messages:
                type: array
                description: The error messages that describes the problem.
                items:
                    type: string
                    example: This is not a valid email address.
    FailedEvent:
        type: "object"
        properties:
            id:
                type: "integer"
                format: "int64"
                example: "1"
                description: The id of the failed event
            environmentId:
                type: "integer"
                format: "int64"
                example: "1234"
                description: The environment id, for which this event failed
            destinationType:
                type: "string"
                example: "Rest"
                description: The destination type of the original event - Rest or Email
            eventType:
                type: "string"
                example: "filemgmt:Uploaded File"
                description: The type of the original failed event
            eventBrokerMessage:
                type: "string"
                example: '{"messageId":"1","messageType":"filemgmt:Uploaded File","correlationId":"1","timestamp":1618834812367,"sourceTimestamp":null,"payload":{"clientId":"1","environmentId":"1","environmentName":"cs-core-1","environmentRole":"shared-services","environmentType":"SHARED","region":"us-east-1","zone":"DEV","stack":"non-prod","serviceId":"1","serviceName":"file-management-service","targetNamespace":"da-saas-non-prod-1","ipAddress":"1","nodeName":"ip-1.ec2.internal","podName":"file-management-service-1","createdBy":"pcc-group@pcc-global-blueprint.com","fileId":"1","fileCategory":"pcc-inbound"},"environmenttype":"SHARED","clientid":"1","eventChannelsMap":null,"fromCommonTopic":false}'
                description: Json representation of the original event broker message that failed
            description:
                type: "string"
                example: "Recreated exception of class com.experian.eda.scl.UnsuccessfulException; Original message: Received status code not in range 2xx"
                description: The original error message of the exception that prevented the event from being processed correctly
            createDate:
                type: "string"
                example: "01/01/2022"
                description: The creation date of the failed event
            updateDate:
                type: "string"
                example: "01/01/2022"
                description: Last update date of the failed event
            reprocessURL:
                type: "string"
                example: "https://client-gateway/v1/events/failed/reprocess/1"
                description: Direct link to follow in order to trigger reprocess of the failed event
    PaginatedFailedEvents:
        type: "object"
        properties:
            failedEvents:
                type: "array"
                items:
                    $ref: "#/definitions/FailedEvent"
                example:
                    - id: 1
                      environmentId: 1234
                      destinationType: "Rest"
                      eventType: "filemgmt:Uploaded File"
                      eventBrokerMessage: '{"messageId":"1","messageType":"filemgmt:Uploaded File","correlationId":"1","timestamp":1618834812367,"sourceTimestamp":null,"payload":{"clientId":"1","environmentId":"1","environmentName":"cs-core-1","environmentRole":"shared-services","environmentType":"SHARED","region":"us-east-1","zone":"DEV","stack":"non-prod","serviceId":"1","serviceName":"file-management-service","targetNamespace":"da-saas-non-prod-1","ipAddress":"1","nodeName":"ip-1.ec2.internal","podName":"file-management-service-1","createdBy":"pcc-group@pcc-global-blueprint.com","fileId":"1","fileCategory":"pcc-inbound"},"environmenttype":"SHARED","clientid":"1","eventChannelsMap":null,"fromCommonTopic":false}'
                      description: "Recreated exception of class com.experian.eda.scl.UnsuccessfulException; Original message: Received status code not in range 2xx"
                      createDate: "01/01/2022"
                      updateDate: "01/01/2022"
                      reprocessURL: "https://client-gateway/v1/events/failed/reprocess/1"
                    - id: 2
                      environmentId: 1235
                      destinationType: "Rest"
                      eventType: "filemgmt:Uploaded File"
                      eventBrokerMessage: '{"messageId":"1","messageType":"filemgmt:Uploaded File","correlationId":"1","timestamp":1618834812367,"sourceTimestamp":null,"payload":{"clientId":"1","environmentId":"1","environmentName":"cs-core-1","environmentRole":"shared-services","environmentType":"SHARED","region":"us-east-1","zone":"DEV","stack":"non-prod","serviceId":"1","serviceName":"file-management-service","targetNamespace":"da-saas-non-prod-1","ipAddress":"1","nodeName":"ip-1.ec2.internal","podName":"file-management-service-1","createdBy":"pcc-group@pcc-global-blueprint.com","fileId":"1","fileCategory":"pcc-inbound"},"environmenttype":"SHARED","clientid":"1","eventChannelsMap":null,"fromCommonTopic":false}'
                      description: "Recreated exception of class com.experian.eda.scl.UnsuccessfulException; Original message: Received status code not in range 2xx"
                      createDate: "01/01/2022"
                      updateDate: "01/01/2022"
                description: Array containing all failed events for this page
            reprocessSelectedURL:
                type: "string"
                example: "https://client-gateway/v1/events/failed/reprocess/1"
                description: "The client has only permission to the failed event with 1 that is why reprocessSelectedURL contains only the id of the first event."
            numberOfFailedEvents:
                type: "integer"
                example: 42
                description: Number of all failed events that have been found by the search criteria, not only the ones returned in this page
            numberOfPages:
                type: "integer"
                example: 4
                description: Number of pages that contain failed events by the given criteria
    FailedEventsReprocessModel:
        type: "object"
        properties:
            code:
                type: "string"
                minLength: 3
                description: "Always returns 200 OK status code."
                example: "200"
            description:
                type: "string"
                minLength: 1
                description: "Description of the failed events that are being currently reprocessed and their count."
