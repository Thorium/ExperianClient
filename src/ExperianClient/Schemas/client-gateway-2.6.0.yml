                    $ref: "#/responses/ForbiddenError"
                400:
                    $ref: '#/responses/BadRequestError'
                404:
                    $ref: '#/responses/NotFoundError'
                500:
                    $ref: "#/responses/InternalServerError"
                503:
                    $ref: "#/responses/ServiceNotAvailable"
    /labels:
        get:
            tags:
                - Logs
            summary: Retrieves the list of known labels within a given time span
            description: >
                Retrieves the list of known labels within a given time span. Labels are used to tag log messages so that they are filterable and queryable.

                The default labels that all logs are labeled with are:

                  * clientId: This is only used internally.
                  * clientName: This is only used internally.
                  * envType: This indicates whether the logs came from a SANDBOX, PROD or SHARED environment. SHARED is used for services that are not environment specific e.g., Deployment Management
                  * job: The service that generated the logs.
                  * level: The level of the individual log line.
                  * namespace: A globally unique name for the environment, this can be used to differentiate between multiple SANDBOX environments.
                  * podName: Name of the specific pod in the service where the log line originated from.
            operationId: getLabels
            consumes:
                - application/json
            produces:
                - application/json
                - application/json
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   name: start
                    in: query
                    description: The start time for the query as a nanosecond Unix epoch. Defaults
                        to 6 hours ago
                    type: number
                -   name: end
                    in: query
                    description: The end time for the query as a nanosecond Unix epoch. Defaults
                        to now.
                    type: number
            responses:
                200:
                    description: successful response
                    schema:
                        $ref: '#/definitions/Labels'
                404:
                    $ref: '#/responses/NotFoundError'
    /label/{labelName}/values:
        get:
            tags:
                - Logs
            summary: Retrieves the list of known values for a given label within a given time span
            description: >
                For a specified label this endpoint will return all values that have exist for that label. E.g., if a label podName is provided then a list of all pods that have logged a line in the specific time span will be returned. Once these values are known it is possible to craft a query.
            operationId: getLabelValues
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   name: start
                    in: query
                    description: The start time for the query as a nanosecond Unix epoch. Defaults
                        to 6 hours ago
                    type: number
                -   name: end
                    in: query
                    description: The end time for the query as a nanosecond Unix epoch. Defaults
                        to now.
                    type: number
                -   name: labelName
                    in: path
                    required: true
                    type: string
            responses:
                200:
                    description: successful response
                    schema:
                        $ref: '#/definitions/Labels'
                404:
                    $ref: '#/responses/NotFoundError'
    /query_range:
        get:
            tags:
                - Logs
            summary: Retrieves the list of known values for a given label within a given time span
            description: >
                This allows for complex queries to be made to Loki. Only log queries are supported. For more detailed information on this endpoint please see the official Loki docs: https://grafana.com/docs/loki/latest/api/#get-lokiapiv1query_range

                It is possible to craft very complex queries to Loki, but to return a basic log lines queries could be very simple.
                For example, query: `{job="deployment-mgmt",level="WARN"}`
                Once encoded, the request url will be: `http://{SERVER}:{PORT}/v1/query_range?query=%7Bjob%3D%22deployment-mgmt%22%2Clevel%3D%22WARN%22%7D`

                This will return all warning logs for all instances of deployment-mgmt within the last hour.
                When a user requests logs for an environment, that s/he is not authorised for, s/he will receive no logs for this environment.
            operationId: getQueryRange
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   name: start
                    in: query
                    description: The start time for the query as a nanosecond Unix epoch. Defaults to 1 hour ago
                    type: number
                -   name: end
                    in: query
                    description: The end time for the query as a nanosecond Unix epoch. Defaults to now.
                    type: number
                -   name: query
                    in: query
                    description: The LogQL query to perform. See LogQL docs https://grafana.com/docs/loki/latest/logql/
                    required: true
                    type: string
                -   name: limit
                    in: query
                    description: The max number of entries to return. It defaults to 100. Only applies to query types which produce a stream (log lines) response. There is a server-side limit that defaults to 5000 for the maximum quantity of lines returned for a single query.
                    type: number
                -   name: step
                    in: query
                    description: Query resolution step width in duration format or float number of seconds. Duration refers to Prometheus duration strings of the form [0-9]+[smhdwy]. For example, 5m refers to a duration of 5 minutes. Defaults to a dynamic value based on start and end. Only applies to query types which produce a matrix response
                    type: string
                -   name: interval
                    in: query
                    description: Only return entries at (or greater than) the specified interval, can be a duration format or float number of seconds. Only applies to queries which produce a stream response.
                    type: number
                -   name: direction
                    in: query
                    description: Determines the sort order of logs. Supported values are forward or backward. Defaults to backward
                    type: string
                    enum: [backward,forward]
            responses:
                200:
                    description: successful response
                    schema:
                        $ref: '#/definitions/QueryRangeResponse'
                422:
                    $ref: '#/responses/UnprocessableEntityError'
