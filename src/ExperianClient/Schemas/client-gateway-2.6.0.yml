    /environments/{environmentId}/logLevel:
        get:
            summary: Fetch current log levels
            description: >
                This endpoint will list the current log levels of a subset of the running pods.

                The supported pod types list is as follows:
                  * BPE (Use Case level)
                  * DA (Use Case level)
                  * Deployment (Client Shared level)
                  * EBS (Client Shared level)

                For redundancy and performance reasons a service may consist of multiple instances running concurrently. Each of these instances is described as a 'pod'. Therefore, for each service there may be multiple different log levels returned.

                Pods are regularly refreshed and changed, and the pod names should not be relied upon. Occasionally internally pod names are cache and null may be returned for log level, this indicates that the pod is being refreshed, will not be accessible from other api calls and therefore the log level is irrelevant. The system is resilient, this is not an issue, and everything should continue to perform as usual.

                BPE, EBS and Deployment follow traditional log levels (ERROR, WARN, INFO, DEBUG, TRACE). The DA log level is controlled using a bitwise integer.

                  * TRACE - Extremely detailed messages, very high volume, typically very detailed, a system's state dump
                  * DEBUG - For troubleshooting purposes, debug messages that help in tracking the flow through the system.
                  * INFO
                    * System events for information purposes, e.g., system lifecycle, system overall status
                    * Business transaction events or exception events, e.g., new applications, login failures due to bad credentials, etc.
                  * WARN - Triggered when an unexpected technical or business event has happened where customers may be affected. A system administrator is required to review these issues to understand their impact.
                  * ERROR - The system is failing, customers are probably being affected. A system administrator is required to fix these issues immediately.
                  * ALL - Turns on all logging.

                * * *

                DA Log Levels

                  * 0 - No tracing
                  * 1 - Strategy - Displays the strategy objects that get executed
                  * 2 - Outcome - Sets all the outcome tracing except characteristics
                  * 4 - Data Source - Displays the name and length of every physical data source
                  * 8 - Gets - Show all gets and characteristics values
                  * 16 - Sets - Shows all sets of characteristics values

                To work out which logging values are enabled start with the highest value in the list, if the log level is higher than the level then that level is enabled. If it is enabled subtract the number from the log level and then move onto the next level.

                E.g., if the log level is 21 then start with 16, 21 is greater than 16 so 'Sets' is enabled, subtract 16 leaving 5. 5 is less than 8 so 'Gets' is not enabled. 5 is greater than 4 so 'Data Source' is enabled, subtract 4 leaving 1. 1 is less than 2 so 'Outcome' is not enabled. 1 is the same as 1 so 'Strategy' is enabled.

                It is generally not desirable to have out of sync log levels, this can be resolved by setting the desired log level using the POST endpoint detailed below.

                N.B. If the user has no access to the provided use case environment id, a "403 Unauthorized" response will be returned, even if they have access to the client shared environment

                N.B. Due to a permission limitation it is not currently possible to fetch or retrieve the log level for the Solution Compiler Service (compiler).
            operationId: fetchLogLevel
            tags:
                - Log Level
            produces:
                - application/json
                - application/json
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/environmentId'
            responses:
                200:
                    description: Log levels for each pod for each service
                    schema:
                        $ref: '#/definitions/PodsLogLevelModel'
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                403:
                    $ref: '#/responses/ForbiddenError'
                404:
                    $ref: '#/responses/NotFoundError'
        patch:
            summary: Update logging level
            description: >
                This endpoint will update the log levels of a subset of the running pods in their specified services.

                The supported pod types list is as follows:
                  * BPE (Use Case level)
                  * DA (Use Case level)
                  * Deployment (Client Shared level)
                  * EBS (Client Shared level)

                For redundancy and performance reasons a service may consist of multiple instances running concurrently. Each of these instances is described as a 'pod'. When a log level is provided for a service the log level of all pods in that service is updated.

                Pods are regularly refreshed and changed, so the pod names should not be relied upon.

                Refer to the `/environments/{environmentId}/logLevel` path and its GET method for additional information on the BPE, DA and Deployment log levels.

                Add the numbers together for all the logging that you want to enable.
                For example:
                    - to enable all logging set DA to 31 (1+2+3+4+8+16)
                    - to enable 'Strategy'(1), 'Data Source'(4) and 'Sets'(16) set the DA level to 21 (1+4+16).

                N.B. If the user has no access to the provided use case environment id, a "403 Unauthorized" response will be returned, even if they have access to the client shared environment

                N.B. Due to a permission limitation, it is currently not possible to fetch or retrieve the log level for the Solution Compiler Service (compiler).
            operationId: patchLogLevel
            tags:
                - Log Level
            consumes:
                - application/json
            produces:
                - application/json
                - application/json
            parameters:
                -   $ref: '#/parameters/correlationId'
                -   $ref: '#/parameters/authorization'
                -   $ref: '#/parameters/environmentId'
                -   in: body
                    name: body
                    required: true
                    schema:
                        $ref: '#/definitions/LogLevelModel'
            responses:
                204:
                    description: Log levels have been updated successfully
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                403:
                    $ref: '#/responses/ForbiddenError'
                404:
                    $ref: '#/responses/NotFoundError'
    /{useCase}/deployments:
        post:
            summary: Deploy a solution or strategy into an environment
            description: |
                All deployables contained in the file related to the fileId will be deployed to the provided environment. It is possible to deploy individual deployables but this must be done manually via the promotions UI.

                Deploying requires the BPS to be restarted, this means that it can take up to 15 minutes for the deployed changes to be reflected.

                N.B. "403 Unauthorized" response will be returned for the below reasons,
                -   When resetSolutionDatabase=true and user has no permission
                -   If the user has no access to the provided environment id which is controlled by the "Environment Access Control" feature
            operationId: postDeployment
            tags:
                - Deployment
            consumes:
                - application/json
            produces:
