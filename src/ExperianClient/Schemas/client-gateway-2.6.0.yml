              x-example: pc-userjourney
        get:
            summary: "Retrieve matching published configuration details for the specified environment"
            description: |
                Retrieves the configuration details that are published from the specified environment and based on the config type, auditId and latest filters (if supplied).

                N.B. If the user has no access to the provided environment id, a "403 Unauthorized" response will be returned
            operationId: "listConfigurationDetails"
            tags:
                - Promotion
            produces:
                - application/json
                - application/json
            parameters:
                - name: "environmentId"
                  description: "The id of the environment from which configurations were published. Acceptable value are long or string value of \"unassigned\" (case sensitive)"
                  in: "path"
                  type: "string"
                  required: true
                  x-example: 2345 or unassigned
                - name: "configType"
                  description: |
                      The type of configuration.
                      Below is the list of config types (case sensitive) that can be used to retrieve the configuration details related to,

                      * `TACTICAL_PARAMETER_SET` - Tactical Parameter updates.
                      * `DYNAMIC_PARAMETER_GROUP` - Dynamic Parameter updates.
                      * `Strategy_Promo` - Strategy deployment.
                      * `EAS_Promo` - EAS Strategy deployment.
                      * `Solution_Promo` - Solution deployment.
                      * `CUSTOMISED_DOCUMENT_TEMPLATE` - Document template updates.
                      * `CrossCoreConfiguration` - Cross Core updates.
                  in: "query"
                  type: "string"
                  required: false
                  x-example: TACTICAL_PARAMETER_SET
                - name: "auditId"
