                description: "The start date from which the failed events should be reprocessed. Date must be in the dd/MM/yyyy format."
            endDate:
                type: "string"
                example: "02/01/2022"
                description: "The end date until which the failed events should be reprocessed. Date must be in the dd/MM/yyyy format."
            eventType:
                type: "string"
                example: "filemgmt:Uploaded File"
                description: "The eventType for which the failed events should be reprocessed."
    PaginatedAuditEventCollection:
