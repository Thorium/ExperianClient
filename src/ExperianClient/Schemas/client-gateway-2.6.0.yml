    FileIntegrity:
        type: object
        title: fileIntegrity
        properties:
            algType:
                type: string
                enum:
                    - MD5
                    - SHA-256
                    - SHA-512
                    - SHA3-256
                    - SHA3-512
                description: The type of the hashing algorithm that is used to calculate the file integrity checksum. MD5 usage is discouraged, it is available for backwards compatibility only.
                example: SHA-256
            checksum:
                type: string
                description: The checksum value produced after using the hashing algorithm on the file content
                example: ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
        required:
            - algType
            - checksum
        description: Integrity verification is done only when this property is provided, otherwise file integrity verification is skipped. The file content should match the provided 'checksum' calculated with the specified 'algType', otherwise verification will fail
    Id:
        type: string
        description: The id, identifying the multipart file upload. Separate file parts should be uploaded under this id.
        example: 49d574f8-c584-4480-806f-95340700ff55

    FileName:
        type: string
        description: The file name
        example: test.xml

    FileProcessingName:
        type: string
        description: The name of the file. It contains date and time as prefix plus the initial file name.
        example: 20240920082836_test.xml

    Size:
        type: number
        description: The size of the file in kilobytes
        format: double
        example: 1024
    ExpectedPartsCount:
        type: integer
        description: Expected number of parts that will be uploaded for the given file. Value must not exceed 10_000, prior to completing the upload, it will be used to decide if the expected number of parts were uploaded. In case there is no match between expected parts count and the uploaded ones, then the file is considered as corrupted.
        format: int32
        example: '7'
