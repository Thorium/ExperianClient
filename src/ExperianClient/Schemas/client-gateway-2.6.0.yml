                500:
                    $ref: '#/responses/InternalServerError'
                503:
                    $ref: "#/responses/ServiceNotAvailable"
    /{useCase}/environments/{environmentId}/promotion/deployments:
        parameters:
            - name: "useCase"
              description: "The use case to create the deployment."
              in: "path"
              type: "string"
              required: true
              x-example: pc-userjourney
            - name: "environmentId"
              description: "The id of the environment to create the deployment."
              in: "path"
              type: "integer"
              format: "int64"
              required: true
              x-example: 12456
            - $ref: '#/parameters/correlationId'
            - $ref: '#/parameters/authorization'
        post:
            summary: "Creates a deployment of the published configurations in the specified environment. Returns error if in progress or failed configurations are supplied."
            description: |
                All published configurations related to the supplied auditIds will be promoted/copied from the provided sourceEnvironment to the given (target) environmentId. To restore a particular configuration version in a specific environment, the sourceEnvironment and environmentId must be supplied with the same value.

                AuditIds with below status can only be deployed using this endpoint:
                * ACTIVE - Configuration is successfully deployed and currently in use.
                * SCHEDULED - The configuration is currently being scheduled. This is due to become active in the future, but the recent version is active now.
                * OVERRIDDEN - The old configuration that has been overridden by promote, or copy or restore. This is due to other version being active now.
                * EXPIRED - When the scheduled is timeout, the status will become expired.
                * INVALID - The audit belongs to an invalid configuration.

                The supported config types list is as follows:
                * TACTICAL_PARAMETER_SET - Tactical Parameter updates.
                * DYNAMIC_PARAMETER_GROUP - Dynamic Parameter updates.
                * Strategy_Promo - Strategy deployment.
                * EAS_Promo - EAS Strategy deployment.
                * Solution_Promo - Solution deployment.
                * CUSTOMISED_DOCUMENT_TEMPLATE - Document template updates.
                * CrossCoreConfiguration - Cross Core updates.

                Schedule:
                * Schedule is applicable only for TACTICAL_PARAMETER_SET configType.
                * Provide the 'scheduledFrom' and 'scheduledTo' date and time in the "yyyy-MM-dd'T'HH:mm:ss'Z'" format.
                  For example:
                    ```
                    "schedule": {
                        "scheduledFrom": "2012-04-01T00:00:00Z",
                        "scheduledTo": "2022-03-31T23:59:59Z"
                    }
                    ```
                * Provide schedule as {} in the request body, if no schedule is planned.
                  For example:
                    ```
                    "schedule": {}
                    ```

                N.B.
                  - User can supply auditId of any configType (with status other than PENDING, FAILED, REMOVED) returned from GET ../promotion/configs endpoint to promote the configuration.
                  - This endpoint is not capable of promoting from Unassigned to any desired environments.
                  - If the user has no access to the provided source/target environment ids, a "403 Unauthorized" response will be returned.
            operationId: "createDeployment"
            tags:
                - Promotion
            produces:
                - application/json
                - application/json
            consumes:
                - application/json
            parameters:
                - name: "body"
                  in: "body"
                  description: "Details of the published configuration to deploy."
                  required: true
                  schema:
                      $ref: "#/definitions/DeploymentModel"
            responses:
                204:
                    description: "Deployment accepted, deployment starting"
                    headers:
                        X-Correlation-Id:
                            description: The correlation ID for this request
                            type: string
                400:
                    description: "There is a problem with this request. Could not create the deployment. Please check your request and try again"
                    headers:
                        Cache-Control:
                            type: string
                            enum:
                                - no-store
                            description: Will always be 'no-store'
                        Pragma:
                            type: string
                            enum:
                                - no-cache
                            description: Will always be 'no-cache'
                        X-Correlation-Id:
                            description: The correlation ID for this request.
                            type: string
                    schema:
                        type: object
                        properties:
                            code:
                                type: string
                                minLength: 3
                                description: Error code.
                                example: '400-000'
                            description:
                                type: string
                                minLength: 1
                                description: Error description.
                                example: Invalid Audit id found
                            reason:
                                type: string
                                minLength: 1
                                description: Error reason.
                            details:
                                type: array
                                items:
                                    type: object
                                    properties:
                                        field:
                                            type: string
                                            description: The property in the request has failed validation.
                                        messages:
                                            type: array
                                            description: The error messages that describes the problem.
                                            items:
                                                type: string
                                    example: null
                401:
                    $ref: '#/responses/UnauthorisedError'
                403:
                    $ref: '#/responses/ForbiddenError'
                404:
                    description: "Could not find at least one of the audit ids passed in the request"
                    headers:
                        Cache-Control:
                            type: string
                            enum:
                                - no-store
                            description: Will always be 'no-store'
                        Pragma:
                            type: string
                            enum:
                                - no-cache
                            description: Will always be 'no-cache'
                        X-Correlation-Id:
                            description: The correlation ID for this request.
                            type: string
                    schema:
                        type: object
                        properties:
                            code:
                                type: string
                                minLength: 3
                                description: Error code.
                                example: '404-000'
                            description:
                                type: string
                                minLength: 1
                                description: Error description.
                                example: Could not find all auditIds
                            reason:
                                type: string
                                minLength: 1
                                description: Error reason.
                            details:
                                type: array
                                items:
                                    type: object
                                    properties:
                                        field:
                                            type: string
                                            description: The property in the request has failed validation.
                                        messages:
                                            type: array
                                            description: The error messages that describes the problem.
                                            items:
                                                type: string
                                    example: null
                500:
                    $ref: '#/responses/InternalServerError'
                503:
                    $ref: "#/responses/ServiceNotAvailable"
