nitions/EventCategory\"\r\ndefinitions:  \r\n  EventCategory:    \r\n    type: \"object\"    \r\n    required:    \r\n      - \"id\"    \r\n      - \"topicType\"\r\n      - \"eventType\"\r\n      - \"piiFlag\"\r\n    properties:\r\n      id:\r\n        type: \"integer\"\r\n        format: \"int64\"\r\n      topicType:\r\n        type: \"string\"\r\n      eventType:\r\n        type: \"string\"\r\n        default: \"*\"\r\n      piiFlag:\r\n        type: \"boolean\"\r\n        default: false\r\n      userDefined:\r\n        type: \"boolean\"\r\n        default: false\r\n      isDeleted:\r\n        type: \"boolean\"\r\n        default: false"
