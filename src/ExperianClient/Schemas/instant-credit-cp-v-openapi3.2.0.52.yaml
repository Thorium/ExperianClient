          description: API responds with a JSON.
          headers:
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              schema:
                type: string
            clientReferenceId:
              description: Echo back of the reference Id , if provided on API request
                header
              schema:
                type: string
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/creditProfileResponseFordaas'
        400:
          description: Client Exception due to invalid data.
          headers:
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              schema:
                type: string
            clientReferenceId:
              description: Echo back of the reference Id , if provided on API request
                header
              schema:
                type: string
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ErrorResponseWithHeaderTrailerAndErrorType'
        403:
          description: Request Forbidden.
          headers:
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              schema:
                type: string
            clientReferenceId:
              description: Echo back of the reference Id , if provided on API request
                header
              schema:
                type: string
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ErrorResponseWithHeaderTrailerAndErrorType'
        404:
          description: Not found Data.
          headers:
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              schema:
                type: string
            clientReferenceId:
              description: Echo back of the reference Id , if provided on API request
                header
              schema:
                type: string
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ErrorResponseWithHeaderTrailerAndErrorType'
        500:
          description: Server Related Error.
          headers:
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              schema:
                type: string
            clientReferenceId:
              description: Echo back of the reference Id , if provided on API request
                header
              schema:
                type: string
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ErrorResponseWithHeaderTrailerAndErrorType'
        504:
          description: Timeout.
          headers:
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              schema:
                type: string
            clientReferenceId:
              description: Echo back of the reference Id , if provided on API request
                header
              schema:
                type: string
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ErrorResponseWithHeaderTrailerAndErrorType'
      security:
      - OauthSecurity:
        - user
      x-codegen-request-body-name: body
components:
  schemas:
    attributesRequest:
      required:
      - consumerPii
      - requestor
      - solutionId
      type: object
      properties:
        consumerPii:
          $ref: '#/components/schemas/PIIDAAS'
        requestor:
          $ref: '#/components/schemas/Requestor'
        permissiblePurpose:
          $ref: '#/components/schemas/PermissiblePurpose'
        resellerInfo:
          $ref: '#/components/schemas/Reseller'
        freezeOverride:
          $ref: '#/components/schemas/FreezeOverride'
        vendorData:
          $ref: '#/components/schemas/vendorData'
        addOns:
          $ref: '#/components/schemas/Addons-daas'
        customOptions:
          $ref: '#/components/schemas/CustomOptions'
        solutionId:
          type: string
          description: SolutionId provided by Experian during the setup process used
            for the RR- keyword.  Tells DaaS system how to route to the correct processing
            environment, which will process your request.
        verifyId:
          type: string
          description: verifyId provided by Experian during the setup process used
            for the verify- keyword.  Tells DaaS system how to format the response.
        daasReferenceId:
          type: string
          description: daasReferenceId provided by Experian during the setup process
            used for m- keyword.  Tells DaaS system which DaaS Products you are requesting.
        infoId1:
          $ref: '#/components/schemas/InfoId1'
        infoId2:
          $ref: '#/components/schemas/InfoId2'
        infoId3:
          $ref: '#/components/schemas/InfoId3'
        infoId4:
          $ref: '#/components/schemas/InfoId4'
        infoId5:
          $ref: '#/components/schemas/InfoId5'
      description: Credit Profile Request Body
    PIIDAAS:
      required:
      - primaryApplicant
      type: object
      properties:
        primaryApplicant:
          $ref: '#/components/schemas/PrimaryApplicant'
        secondaryApplicant:
          $ref: '#/components/schemas/SecondaryApplicantDAAS'
      description: Personally Identifiable Information
    PAName:
      required:
      - firstName
      - lastName
      type: object
      properties:
        lastName:
          type: string
          description: The full applicant's surname is required. If the surname contains
            two surnames, then split the surnames with a hyphen (e.g., Smith-Jones).
            The surname can also be input with an apostrophe (e.g., O'Brien), although
            apostrophe usage is limited to the letters D, L, and O.
        firstName:
          type: string
          description: The full first name is required. The minimum entry is the first
            name initial. Blanks and special characters (except dash) are not allowed.
            Compound names should contain a dash (e.g., Billy-Bob).
        middleName:
          type: string
          description: The full middle name should be entered when available. A middle
            initial is acceptable. Blanks and special characters are not allowed.
            Omit if the middle name is not available.

        generationCode:
          type: string
          description: Generation Code
      description: Consumer's Name
    SAName:
      required:
      - firstName
      type: object
      properties:
        lastName:
          type: string
          description: The full applicant's surname is required. If the surname contains
            two surnames, then split the surnames with a hyphen (e.g., Smith-Jones).
            The surname can also be input with an apostrophe (e.g., O'Brien), although
            apostrophe usage is limited to the letters D, L, and O.
        firstName:
          type: string
          description: The full first name is required. The minimum entry is the first
            name initial. Blanks and special characters (except dash) are not allowed.
            Compound names should contain a dash (e.g., Billy-Bob).
        middleName:
          type: string
          description: The full middle name should be entered when available. A middle
            initial is acceptable. Blanks and special characters are not allowed.
            Omit if the middle name is not available.
        generationCode:
          type: string
          description: Generation Code
      description: Consumer's Name
    Address:
      required:
      - line1
      - zipCode
      type: object
      properties:
        line1:
          type: string
          description: Address Line 1
        line2:
          type: string
          description: Address Line 2
        city:
          type: string
          description: City
        state:
          type: string
          description: State
        zipCode:
          type: string
          description: ZIP Code
      description: Consumer's Address
    DOB:
      type: object
      properties:
        dob:
          type: string
          description: Year Of Birth or Date of Birth. This describes year of birth
            of the primary applicant. It must be 4 (YYYY) or 8 (MMDDYYYY) digits.
      description: Consumer's Date of Birth
    SSN:
      type: object
      properties:
        ssn:
          type: string
          description: Social Security Number
      description: Consumer's Social Security Number
    Phone:
      type: object
      properties:
        number:
          type: string
          description: Phone Number
        type:
          type: string
          description: Phone Type
      description: Consumer's Phone
    Employment:
      required:
      - employerName
      type: object
      properties:
        employerName:
          type: string
          description: Employer's Name
        employerAddress:
          $ref: '#/components/schemas/Address'
      description: Consumer's Employment Details
    DriverLicense:
      required:
      - number
      - state
      type: object
      properties:
        number:
          type: string
          description: DL Number
        state:
          type: string
          description: State in which DL was issued
      description: Consumer's Driver License
    PrimaryApplicant:
      required:
      - currentAddress
      - name
      type: object
      properties:
        name:
          $ref: '#/components/schemas/PAName'
        dob:
          $ref: '#/components/schemas/DOB'
        ssn:
          $ref: '#/components/schemas/SSN'
        driverslicense:
          $ref: '#/components/schemas/DriverLicense'
        phone:
          type: array
          items:
            $ref: '#/components/schemas/Phone'
        employment:
          $ref: '#/components/schemas/Employment'
        currentAddress:
          $ref: '#/components/schemas/Address'
        previousAddress:
          type: array
          items:
            $ref: '#/components/schemas/Address'
      description: Primary Credit Applicant Information
    SecondaryApplicantDAAS:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/SAName'
        dob:
          $ref: '#/components/schemas/DOB'
        ssn:
          $ref: '#/components/schemas/SSN'
        driverslicense:
          $ref: '#/components/schemas/DriverLicense'
        phone:
          type: array
          items:
            $ref: '#/components/schemas/Phone'
        employment:
          $ref: '#/components/schemas/Employment'
        currentAddress:
          $ref: '#/components/schemas/Address'
        previousAddress:
          type: array
          items:
            $ref: '#/components/schemas/Address'
      description: Secondary Credit Applicant Information for DAAS
    Requestor:
      required:
      - subscriberCode
      type: object
      properties:
        subscriberCode:
          type: string
          description: Subscriber Number assigned by Experian
      description: Information on the API requestor
    PermissiblePurpose:
      type: object
      properties:
        type:
          type: string
          description: Permissible Purpose Type Code. 2 digits containing the account
            type code only.
        terms:
          type: string
          description: The Terms must be 3 digits. If unknown             , substitute
            three periods. Mortgage loans use terms expressed in YEARS. Revolving
            accounts use terms expressed as either "001" to indicate a monthly payment
            plan or "010" to indicate a revolving account. All other type codes have
            terms that are expressed in MONTHS
        abbreviatedAmount:
          type: string
          description: Input the amount of the account. Must             be 3 digits.
            If unknown, substitute              three periods. Mortgage loans have
            amounts expressed in THOUSANDS.             For example, a $100,000 VA
            mortgage              for 30 years would be entered as "100". Under 1000;
            enter 000. All other type accounts are expressed in HUNDREDS. For example,
            a $15,000 auto loan would be entered as "150". Under 100; input 000.
      description: Specifies information on why this credit inquiry is being submitted
        This is used to denote the purpose type, terms, and amount.
    Reseller:
      required:
      - endUserName
      type: object
      properties:
        endUserName:
          type: string
          description: End User Identification. Resellers of credit reports must enter
            the name of the end user upto 30 characters.
      description: If the API requestor is a reseller submitting a credit inquiry
        to Experian, additional information should be provided.
    Addons-daas:
      type: object
      properties:
        directCheck:
          type: string
          description: Send back subscriber information on the credit profile. When
            set to Y indicates that subscriber and court names, addresses, and phone
            numbers who have reported data on the consumer's profile will be sent
            back on the response.
        demographics:
          type: string
          description: Indicates the type of demographic data that should be returned
            back.
        liftPremium:
          type: string
          description: 'liftPremium "type": "string", "pattern": "^[A-Z]{0,1}$", "enum":
            ["Y", "N",""]'
        clarityEarlyRiskScore:
          type: string
          description: Y.  Returns Clarity's 90 day Clear Early Risk Score (CERS)
            which predict the risk of a consumer going 90 days past due in first 12
            months of a traditional bureau trade. This can be omitted if Clarity Early
            Risk Score is not needed.
        clarityData:
          $ref: '#/components/schemas/clarityAccountData'
        creditScoreNotice:
          type: string
          description: Y.  It makes 'creditScoreNoticeData' a mandatory element.
        creditScoreNoticeData:
          $ref: '#/components/schemas/creditScoreNoticeDataDaas'
        riskModels:
          $ref: '#/components/schemas/RiskModel-daas'
        summaries:
          type: object
          properties:
            summaryType:
              type: array
              items:
                type: string
                description: Summary type being requested
          description: Details of what summaries are requested in output like profile
            summary or auto summary
        fraudShield:
          type: string
          description: Y - Fraud Shield Product Option will be output
        mla:
          type: string
          description: Y - Trigger a screening process of taking the consumer data
            from an inquiry to match against the Dept of Defense MLA lists. Message
            codes 1203-1207 could be returned. Permissible Purpose with valid YOB
            required for getting this option.
        ofacmsg:
          type: string
          description: Y- Trigger a screening process of taking the consumer data
            from an inquiry to match against the OFAC (Office of Foreign Asset Control)
            and PLC (Palestinian Legislative Council) lists. A message 1202 NAME DOES
            NOT MATCH OFAC/PLC LIST will be printed on credit profile if the consumer
            is not found on either OFAC or PLC list. A message 1200 NAME MATCHES OFAC/PLC
            LIST will be printed on credit profile if the consumer is found on either
            OFAC or PLC list.
        ofac:
          type: string
          description: Y- The OFAC keyword is used to trigger a screening process
            of taking the consumer data from an inquiry to match aginst the OFAC(Office
            of Foreign Asset Control)list.  A message "spelling of name used to access
            report matches OFAC list" will be printed on credit profile if the consumer
            is found on OFAC list.
        brokerNumber:
          type: string
          description: Broker Number is required if the inquiry SIN has customer master
            service rule 30/350 set on at fileone system.  And it is retained in the
            reference id field for inquiry logging purpose at fileone system. Broker
            Number is an optional field and accepts 1 to 10 digits of numeric values.
        consumerIdentCheck:
          $ref: '#/components/schemas/ConsumerIdentifierCheckOptions'
        joint:
          type: string
          description: If specified as Y it means that the client is requesting a
            joint credit report. This is used to request the Dual or Joint Report.
            Two separate credit reports are returned?one on the primary applicant
            and one on the secondary applicant. The joint applicant should have the
            same current address as the primary applicant. Include as much information
            on the joint applicant as possible, including the surname if it is different
            from the primary applicant. If NOt specified or N it means that a joint
            report is NOT being requested.
        paymentHistory84:
          type: string
          description: Y.  84 month payment history is requested instead of the 25
            month history. This can be omitted if 84 month history is not needed
        outputType:
          type: string
          description: ENUM JSON,ARF,COMBO,TTY,COMBO1,COMBO2 If JSON is type, API
            coverts the output from DaaS to JSON tags and discards the output from
            DaaS If ARF is type, API creates a JSON wrapper with a single data tag
            that contains the DaaS output. If COMBO is type, API converts the output
            from DaaS (excluding the 700 segments) into JSON and also inserts the
            DaaS output into a single data             tag. If TTY is type, If TTY
            is type, API returns the output in TTY format and wraps that into a single
            JSON data tag. COMBO1 is cobination of JSON and TTY. COMBO2 is used to
            get the third party data source data from 700 segment.
        outputTypeData:
          $ref: '#/components/schemas/OutputTypeDataDaas'
        taxRefundLoan:
          type: string
          description: "Y will be displayed \n  in the indicator field; if no inquiry\
            \ is found for a tax refund loan inquiry from January 1 through October\
            \ 17, an N will be displayed in the indicator field.                  "
        trendedData:
          type: string
          description: To display Trended Data at json response in accordance with
            trendedData request in DaaS api. Enum - Y or N,
        sureProfile:
          type: string
          description: 'Sure profile is a new product for subscribed financial institutions.
            Using machine learning models to assess the overall credit health of a
            consumer,  Experian will guarantee three types of credit types for an
            approved consumer: credit card, revolving credit, and check card.  The
            guarantee will cover one year, and Experian will be financially liable
            to the issuing financial institution if the consumer fails to pay. Enum-
            Y, N'
        ssnIndicators:
          type: string
          description: SSN Indicators is an optional field for DaaS api. Enum - Y
            or N.
        newConsumer:
          type: string
          description: 'Indicates if the consumer is new. This is an optional field
            for DaaS api. Enum - Y or N. '
      description: Add on products that can be requested. Each add on is billable.
        These are optional parameters and can be omitted if not needed.
    OutputTypeDataDaas:
      type: object
      properties:
        heading:
          type: string
      description: Heading element is added to get the column headers in the pages
        for TTY output type based on H- inquiry keyword.  The outputTypeData element
        is optional field and heading element is also optional filed and it supports
        "Y" or "N" enum values.
    RiskModel-daas:
      type: object
      properties:
        modelIndicator:
          type: array
          items:
            type: string
            description: The 2 byte model indicator if the risk score.
        scorePercentile:
          type: string
          description: Y - Percentile data for Risk-based Pricing policies. Must be
            requested along with a Risk Model.
      description: Risk Models that are being requested. Upto 29 models can be requested.
    ConsumerIdentifierCheckOptions:
      type: object
      properties:
        getUniqueConsumerIdentifier:
          type: string
          description: Y -17 byte unique consumer identifier on output.
        verifyPrimaryConsumerIdentifier:
          type: string
          description: Y - 17 byte unique consumer identifier output for Primary Applicant.
        verifySecondaryConsumerIdentifier:
          type: string
          description: Y - 17 byte unique consumer identifier output for Secondary
            Applicant.
      description: Output a 17 byte unique consumer identifier for requestor and/or
        verify an input 17 byte unique consumer identifier.
    CustomOptions:
      type: object
      properties:
        optionId:
          type: array
          items:
            type: string
            description: Custom option id
      description: Ancillary Credit Reporting Options (Client custom options if any
        that have been setup) that can be requested by client. Multiple options can
        be requested here.
    FreezeOverride:
      type: object
      properties:
        primaryApplFreezeOverrideCode:
          type: string
          description: This is the freeze override code for the primary applicant
            Used when a consumer has authorized the client to access his or her frozen
            file and has provided the client with his or her pass code. This passcode
            is to be provided to Experian so that Experian can override the freeze
            and return credit data for the consumer back to the client.
        secondaryApplFreezeOverrideCode:
          type: string
          description: This is the freeze override code for the secondary applicant
            Used when a consumer has authorized the client to access his or her frozen
            file and has provided the client with his or her pass code. This passcode
            is to be provided to Experian so that Experian can override the freeze
            and return credit data for the consumer back to the client.
      description: If a consumer's profile is frozen, then consumer can get a password
        using which a lender can override the freeze and get credit data. This parameter
        is provided when consumer has provided the lender with the password to override
        his profile freeze.
    InfoId1:
      type: object
      properties:
        item:
          type: array
          items:
            type: string
            description: info- keyword Custom Properties
      description: infoId1 contains additional properties or parameters needed by
        Decisioning to complete the request.
    InfoId2:
      type: object
      properties:
        item:
          type: array
          items:
            type: string
            description: info2- keyword Custom Properties
      description: infoId2 contains additional properties or parameters needed by
        Decisioning to complete the request.
    InfoId3:
      type: object
      properties:
        item:
          type: array
          items:
            type: string
            description: info3- keyword Custom Properties
      description: infoId3 contains additional properties or parameters needed by
        Decisioning to complete the request.
    InfoId4:
      type: object
      properties:
        item:
          type: array
          items:
            type: string
            description: info4- keyword Custom Properties
      description: infoId4 contains additional properties or parameters needed by
        Decisioning to complete the request.
    InfoId5:
      type: object
      properties:
        item:
          type: array
          items:
            type: string
            description: info5- keyword Custom Properties
      description: infoId5 contains additional properties or parameters needed by
        Decisioning to complete the request.
    vendorData:
      type: object
      properties:
        vendorNumber:
          type: string
          description: Optional. Alpha-numeric. Must be 3 Character long.
        vendorVersion:
          type: string
          description: Optional. Alpha-numeric with dot(.). Max length is 6.
      description: Optional field. To understand who's application the client is using
        to send in the inquiry - Vendor, 3rd Party, Reseller, or client home grown.
    creditProfileResponseFordaas:
      type: object
      properties:
        creditProfile:
          type: array
          description: DaaS Credit Profile Response
          items:
            $ref: '#/components/schemas/creditProfileRespFordaasData'
        arf:
          $ref: '#/components/schemas/arf'
        tty:
          $ref: '#/components/schemas/ttyResponse'
        dataSource:
          $ref: '#/components/schemas/dataSourceDaas'
    creditProfileRespFordaasData:
      type: object
      properties:
        headerRecord:
          $ref: '#/components/schemas/headerRecord'
        addressInformation:
          type: array
          description: Best Consumer Addresses
          items:
            $ref: '#/components/schemas/addressInformationRespDaas'
        consumerAssistanceReferralAddress:
          $ref: '#/components/schemas/consumerAssistanceReferralAddress'
        consumerIdentity:
          $ref: '#/components/schemas/consumerIdentityDaas'
        directCheck:
          $ref: '#/components/schemas/directCheck'
        employmentInformation:
          $ref: '#/components/schemas/employmentInformation'
        fraudShield:
          $ref: '#/components/schemas/fraudShieldDaas'
        informationalMessage:
          $ref: '#/components/schemas/informationalMessagefordaas'
        inquiry:
          $ref: '#/components/schemas/inquiryDaas'
        mla:
          $ref: '#/components/schemas/mlaResp'
        ofac:
          $ref: '#/components/schemas/ofacResp'
        summaries:
          $ref: '#/components/schemas/summaries'
        publicRecord:
          $ref: '#/components/schemas/publicRecordDaas'
        riskModel:
          $ref: '#/components/schemas/riskModelDaas'
        ssn:
          $ref: '#/components/schemas/ssnDaas'
        statement:
          $ref: '#/components/schemas/statement'
        tradeline:
          $ref: '#/components/schemas/tradelineDaas'
        uniqueConsumerIdentifier:
          $ref: '#/components/schemas/uniqueConsumerIdentifierDaas'
        extendedViewAttributes:
          $ref: '#/components/schemas/extendedView'
        premierAttributes:
          $ref: '#/components/schemas/PremierAttribute'
        trendedAttributes:
          $ref: '#/components/schemas/TrendedAttribute'
        trendView:
          $ref: '#/components/schemas/trendView'
        staggAttributes:
          type: array
          items:
            $ref: '#/components/schemas/staggAttributesDaas'
        modelAttributes:
          $ref: '#/components/schemas/modelAttributes'
        customAttributes:
          $ref: '#/components/schemas/customAttributes'
        connectCheck:
          $ref: '#/components/schemas/connectCheck'
        connectCheckGen3InquiryData:
          $ref: '#/components/schemas/connectCheckGen3InquiryData'
        connectCheckGen3TradeLine:
          $ref: '#/components/schemas/connectCheckGen3TradeLine'
        endTotals:
          $ref: '#/components/schemas/endTotals'
    TrendedAttribute:
      type: array
      description: Trended Attributes
      items:
        $ref: '#/components/schemas/attributeResp'
    PremierAttribute:
      type: array
      description: Premier Attributes
      items:
        $ref: '#/components/schemas/attributeResp'
    extendedView:
      type: array
      description: EV Attributes
      items:
        $ref: '#/components/schemas/extendedViewResp'
    extendedViewResp:
      type: object
      properties:
        categoryCd:
          type: string
          description: This indicates what type of attributes are being returned
          enum:
          - "0"
          - "1"
          - "2"
        categoryTxt:
          type: string
          description: This explains the category of Extended View attributes It could
            be "Experian Premier Attributes" or "Lexis Nexis Attributes"
        attribute:
          type: array
          description: EV Attribute Information
          items:
            $ref: '#/components/schemas/attributeResp'
      description: Present when Extended View attributes are requested.
    addressInformationRespDaas:
      type: object
      properties:
        censusGeoCode:
          type: string
          description: Address range that includes the address and the census geography
            the address is within
        city:
          type: string
          description: City for the address.
        countyCode:
          type: string
          description: County Code
        dwellingType:
          type: string
          description: Structural Characteristic/Dwelling Configuration
        dwellingTypeText:
          type: string
          description: Verbose mapping for dwellingType
        firstReportedDate:
          type: string
          description: 'Date address first reported. Format = MMDDCCYY '
        lastReportingSubscriberCode:
          type: string
          description: Last Subscriber reporting this address. May be blanks.
        lastUpdatedDate:
          type: string
          description: 'Date address last updated. Format = MMDDCCYY '
        msaCode:
          type: string
          description: Metropolitan Statistical Area Code when DemographicsAll or
            DemographicsGeoCode is requested.
        source:
          type: string
          description: Source of Address
        sourceText:
          type: string
          description: Verbose mapping for source
        state:
          type: string
          description: 'Valid two-letter US state code or Canadian province. '
        stateCode:
          type: string
          description: State Geo Code when demographics = 1 or 2.
        streetName:
          type: string
          description: 'Full street name. '
        streetPrefix:
          type: string
          description: Data that precedes the street name like house number and directional.
        streetSuffix:
          type: string
          description: Street name type like ST, LN.
        timesReported:
          type: string
          description: Number of times the Address was reported to Experian.
        unitId:
          type: string
          description: Unit Identifier for Apartment.
        unitType:
          type: string
          description: 'Words such as apartment, suite, etc. '
        zipCode:
          type: string
          description: ZIP Code.
      description: Best Consumer Addresses
    consumerAssistanceReferralAddress:
      type: object
      properties:
        cityStateZip:
          type: string
          description: CRS City, State, ZIP.
        officeName:
          type: string
          description: Name of CRS Office
