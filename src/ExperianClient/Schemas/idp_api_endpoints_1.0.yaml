openapi: 3.0.0
info:
  title: Verifications - Intelligent Document Processing (IDP)
  description: |
    # Overview

    The IDP APIs enable clients to upload applicant documents, initiate Intelligent Document Processing, and retrieve processing results. These APIs form the core of the IDP integration and are typically invoked after applicant details have been created.

    # Access restrictions

    Access to the API, data fields and sections is administrated by Experian.

    # Format
    The APIs default to JSON. Requests should specify [content type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Type) as `application/json`.
  version: "1.0"

servers:
  - url: https://sandbox-uk-api.experian.com
    description: Sandbox

paths:
  "/cis/verifications/idp/v1/api/application/{customerApplicationId}/{partyId}/documents":
    post:
      tags:
        - Application
      summary: Upload documents for a specific party.
      description: |
        This API enables clients to upload applicant documents, such as payslips, for a specific customer application and associated party. 
        The uploaded documents are processed as part of the Intelligent Document Processing (IDP) workflow to automatically extract structured, 
        income‑related information.
      security:
        - OAuth2: []
      parameters:
        - name: customerApplicationId
          in: path
          description: Unique identifier for the customer application.
          required: true
          schema:
            type: string
            minLength: 1
        - name: partyId
          in: path
          description: Identifier of the party/applicant within the application.
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        description: Details of the document(s) being uploaded.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentDetails"
      responses:
        "201":
          description: Document uploaded successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadApiResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-400
                    errorType: BadRequest
                    message: |
                      The field 'TotalApplicantsInCustomerApplicationId' must be between 1 and 6.
                      The field 'TotalFilesForThisApplicant' must be between 1 and 53.
                      The field 'DocumentContent' is required and must not be null.
                      The field 'DocumentType' is required and must not be empty.
                      FileName is required and must not be empty.
                      The payload contains invalid values for 'integrityValidationRules'.
                      The payload contains invalid values for 'completenessValidationRules'.
                success: false
        "401":
          description: |
            Unauthorized. When authentication is possible but has failed or has not yet been provided. 
            The response must include a WWW-Authenticate header field containing a challenge applicable to the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorType: Unauthorized
                    message: Access token is invalid.
                success: false
        "403":
          description: Forbidden. Insufficient permissions to access the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-403
                    errorType: Forbidden
                    message: Insufficient permissions.
                success: false
        "422":
          description: Unprocessable Entity. The request was well-formed but was unable to be followed due to semantic errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-422
                    errorType: Unprocessable Entity
                    message: Validation failed for document upload.
                success: false
        "429":
          description: Too Many Requests. The user has sent too many requests in a given amount of time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-429
                    errorType: TooManyRequests
                    message: Rate limit exceeded. Please try again later.
                success: false
        "500":
          description: Internal server error. This message is returned when the server encounters an unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-500
                    errorType: InternalServerError
                    message: Sorry something went wrong.
                success: false

    put:
      tags:
        - Application
      summary: Updates uploaded documents for a specific party.
      description: |
        This API enables clients to update previously uploaded applicant documents for a specific customer application and associated party. 
        The updated documents are reprocessed as part of the Intelligent Document Processing (IDP) workflow to ensure accurate extraction 
        of structured, income‑related information.
      security:
        - OAuth2: []
      parameters:
        - name: customerApplicationId
          in: path
          description: Unique identifier for the customer application.
          required: true
          schema:
            type: string
            minLength: 1
        - name: partyId
          in: path
          description: Identifier of the party/applicant within the application.
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        description: Updated details of the document(s).
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentDetails"
      responses:
        "200":
          description: Document updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadApiResponse"
        "400":
          description: Bad Request. The request could not be understood by the server due to malformed syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-400
                    errorType: BadRequest
                    message: |
                      The field 'TotalApplicantsInCustomerApplicationId' must be between 1 and 6.
                      The field 'TotalFilesForThisApplicant' must be between 1 and 53.
                      The field 'DocumentContent' is required and must not be null.
                      The field 'DocumentType' is required and must not be empty.
                      FileName is required and must not be empty.
                      The payload contains invalid values for 'integrityValidationRules'.
                      The payload contains invalid values for 'completenessValidationRules'.
                success: false
        "401":
          description: |
            Unauthorized. When authentication is possible but has failed or has not yet been provided. 
            The response must include a WWW-Authenticate header field containing a challenge applicable to the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorType: Unauthorized
                    message: Access token is invalid.
                success: false
        "403":
          description: Forbidden. Insufficient permissions to access the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-403
                    errorType: Forbidden
                    message: Insufficient permissions.
                success: false
        "422":
          description: Unprocessable Entity. The request was well-formed but was unable to be followed due to semantic errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-422
                    errorType: Unprocessable Entity
                    message: Unprocessable content for document update.
                success: false
        "429":
          description: Too Many Requests. The user has sent too many requests in a given amount of time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-429
                    errorType: TooManyRequests
                    message: Rate limit exceeded. Please try again later.
                success: false
        "500":
          description: Internal server error. This message is returned when the server encounters an unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-500
                    errorType: InternalServerError
                    message: Sorry something went wrong.
                success: false    

  "/cis/verifications/idp/v1/api/application/{customerApplicationId}/{partyId}":
    get:
      tags:
        - Application
      summary: Get uploaded documents for a specific party.
      description: |
        This API enables clients to retrieve previously uploaded applicant documents for a specific customer application 
        and associated party. The response includes document metadata and processing status information from the 
        Intelligent Document Processing (IDP) workflow.
      security:
        - OAuth2: []
      parameters:
        - name: customerApplicationId
          in: path
          description: Unique identifier for the customer application.
          required: true
          schema:
            type: string
            minLength: 1
        - name: partyId
          in: path
          description: Identifier of the party/applicant within the application.
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "200":
          description: Documents retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDocumentsResponse"
              example:
                message: "string"
                customerApplicationId: "string"
                correlationId: "string"
                partyId: 0
                totalFilesForThisApplicant: 0
                submittedFilesCountForThisApplicant: 0
                remainingFilesCountForThisApplicant: 0
                status: "string"
                documents:
                  - documentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    documentType: "string"
                    fileName: "string"
                    createdDate: "2026-04-16T10:44:47.122Z"
                    updatedDate: "2026-04-16T10:44:47.122Z"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-400
                    errorType: BadRequest
                    message: Invalid customerApplicationId or partyId format.
