    patch:
      tags:
        - Webhooks
      summary: Updates an existing webhook.
      description: |
        This API enables clients to update an existing webhook configuration for a specific webhookId. While all fields 
        are optional, the request must include at least one field (webhookName, webhookCallbackUrl, or eventTypes). 
        To clear a field, send an empty string as the field value. This allows you to modify webhook subscriptions 
        without recreating them.
      security:
        - OAuth2: []
      parameters:
        - name: webhookId
          in: path
          description: The webhook ID.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: The webhook update request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-400
                    errorType: BadRequest
                    message: "At least one field (webhookName, webhookCallbackUrl, or eventTypes) must be provided for update. You must provide a name for the webhook. You must provide a callback url for the webhook to invoke. The callback url must be formatted as an absolute URI. The callback url only supports a HTTPS scheme. Unknown event type(s) provided: . An event type must be one of: MalwareScanFailed, MalwareScanFailedForApplicantWhereCaseIdExists, CaseIdCreated, IntegrityCheckFailed, ValidationCheckFailed, ApplicantDataReady."
                success: false
        "401":
