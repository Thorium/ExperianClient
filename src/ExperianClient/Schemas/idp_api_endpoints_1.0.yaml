  /cis/verifications/idp/v1/api/webhooks/secrets:
    post:
      tags:
        - Webhooks
      summary: Creates a webhook secret for the partner.
      description: |
        This API enables clients to create a webhook secret for securing webhook communications. All subsequent webhook 
        requests sent will include a HMACSHA256 hash that has been Base64 encoded in the X-HMAC-SHA256-Signature header. 
        Comparing this hashed value against a SHA256 hash of the request body (using the secret as a key) enables you to 
        verify the payload has not been tampered with, ensuring the authenticity and integrity of webhook notifications.
      security:
        - OAuth2: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretResponse"
        "401":
          description: |
            Unauthorized. When authentication is possible but has failed or has not yet been provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorType: Unauthorized
                    message: Access token is invalid.
                success: false
        "422":
          description: Unprocessable Entity. The request was well-formed but was unable to be followed due to semantic errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-422
                    errorType: Unprocessable Entity
                    message: "Only one webhook secret is supported. Please refer to the API docs on how to either rotate the existing key value or delete it from the system."
                success: false
        "429":
          description: Too Many Requests. The user has sent too many requests in a given amount of time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-429
                    errorType: TooManyRequests
                    message: Rate limit exceeded. Please try again later.
                success: false
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-500
                    errorType: InternalServerError
                    message: Sorry something went wrong.
                success: false

    get:
      tags:
        - Webhooks
      summary: Gets the webhook secret for the partner.
      description: |
        This API enables clients to retrieve the current webhook secret configured for your organisation. This secret 
        will be used to create a HMACSHA256 hash of every webhook request sent. The result will be Base64 encoded and 
        sent under the X-HMAC-SHA256-Signature header in the request.
      security:
        - OAuth2: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretResponse"
        "401":
          description: |
            Unauthorized. When authentication is possible but has failed or has not yet been provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorType: Unauthorized
                    message: Access token is invalid.
                success: false
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-404
                    errorType: NotFound
                    message: "There is no shared secret currently configured for the webhooks. Please refer to the API docs for how to create one"
                success: false
        "429":
          description: Too Many Requests. The user has sent too many requests in a given amount of time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-429
                    errorType: TooManyRequests
