                    errorType: Forbidden
                    message: Insufficient permissions.
                success: false
        "404":
          description: Not Found. No documents found for the specified customer application and party.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-404
                    errorType: NotFound
                    message: No documents found for the specified application and party.
                success: false
        "422":
          description: Unprocessable Entity. The request was well-formed but was unable to be followed due to semantic errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-422
                    errorType: Unprocessable Entity
                    message: Unable to process the request.
                success: false
        "429":
          description: Too Many Requests. The user has sent too many requests in a given amount of time.
