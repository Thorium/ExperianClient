          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-500
                    errorType: InternalServerError
                    message: Sorry something went wrong.
                success: false

  /cis/verifications/idp/v1/api/webhooks:
    post:
      tags:
        - Webhooks
      summary: Creates a new webhook for the current partner.
      description: |
        This API enables clients to create a new webhook subscription for the Intelligent Document Processing (IDP) platform. 
        Webhooks are HTTP callbacks that notify your system in real time about changes in the IDP Platform. When subscribed 
        events occur, such as document processing completion or extraction failures, the platform sends an HTTP request to a 
        client‑configured endpoint. This allows systems to respond to IDP events without continuously polling for status updates.
      security:
        - OAuth2: []
      requestBody:
        description: The webhook creation request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-400
                    errorType: BadRequest
                    message: "You must provide a name for the webhook. You must provide a callback url for the webhook to invoke. You must provide at least one event type. Unknown event type(s) provided: . An event type must be one of: MalwareScanFailed, MalwareScanFailedForApplicantWhereCaseIdExists, CaseIdCreated, IntegrityCheckFailed, ValidationCheckFailed, ApplicantDataReady. Unknown event type(s) provided: . An event type must be one of: MalwareScanFailed, MalwareScanFailedForApplicantWhereCaseIdExists, CaseIdCreated, IntegrityCheckFailed, ValidationCheckFailed, ApplicantDataReady."
                success: false
        "401":
          description: |
            Unauthorized. When authentication is possible but has failed or has not yet been provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorType: Unauthorized
                    message: Access token is invalid.
                success: false
        "403":
          description: Forbidden. Insufficient permissions to access the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-403
                    errorType: Forbidden
                    message: Insufficient permissions.
                success: false
        "429":
          description: Too Many Requests. The user has sent too many requests in a given amount of time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-429
                    errorType: TooManyRequests
                    message: Rate limit exceeded. Please try again later.
                success: false
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-500
                    errorType: InternalServerError
                    message: Sorry something went wrong.
                success: false

    get:
      tags:
        - Webhooks
      summary: Gets all webhooks for the current partner.
      description: |
        This API enables clients to retrieve all webhooks configured for your organisation, including each webhookId, 
        which can be used to retrieve, update, or delete individual webhooks.
      security:
        - OAuth2: []
      responses:
        "200":
          description: OK
