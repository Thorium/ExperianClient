                    errorType: InternalServerError
                    message: Sorry something went wrong.
                success: false

    delete:
      tags:
        - Webhooks
      summary: Deletes a webhook by webhookId.
      description: |
        This API enables clients to delete a specified webhook subscription using its webhookId. Once deleted, the 
        webhook will no longer receive event notifications from the IDP platform. This action is permanent and cannot 
        be undone.
      security:
        - OAuth2: []
      parameters:
        - name: webhookId
