                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-500
                    errorType: InternalServerError
                    message: Sorry something went wrong.
                success: false

    patch:
      tags:
        - Webhooks
      summary: Updates the webhook secret for the partner.
      description: |
        This API enables clients to rotate the webhook secret by generating a new secret key. The new secret will be 
        used to create the X-HMAC-SHA256-Signature header on all webhook requests. This new secret will be implemented 
        on all requests sent after the datetimeUpdated timestamp included in the response. Regular secret rotation is 
        recommended as a security best practice.
      security:
        - OAuth2: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretResponse"
        "401":
          description: |
            Unauthorized. When authentication is possible but has failed or has not yet been provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorType: Unauthorized
                    message: Access token is invalid.
                success: false
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-404
                    errorType: NotFound
                    message: "There is no shared secret currently configured for the webhooks. Please refer to the API docs for how to create one"
                success: false
        "429":
          description: Too Many Requests. The user has sent too many requests in a given amount of time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-429
                    errorType: TooManyRequests
                    message: Rate limit exceeded. Please try again later.
                success: false
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-500
                    errorType: InternalServerError
                    message: Sorry something went wrong.
                success: false

    delete:
      tags:
        - Webhooks
      summary: Deletes the webhook secret for the partner.
      description: |
        This API enables clients to delete the webhook secret from the system. Please note that this action cannot be 
        undone. Webhooks will continue to be sent without a secret - they will just not include the X-HMAC-SHA256-Signature 
        header for verification purposes. This reduces the security of webhook communications and should only be used when 
        signature verification is not required.
      security:
        - OAuth2: []
      responses:
        "204":
          description: No Content
        "401":
          description: |
            Unauthorized. When authentication is possible but has failed or has not yet been provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorType: Unauthorized
                    message: Access token is invalid.
                success: false
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-404
                    errorType: NotFound
                    message: "There is no shared secret currently configured for the webhooks. Please refer to the API docs for how to create one"
                success: false
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: EXP-500
                    errorType: InternalServerError
                    message: Sorry something went wrong.
                success: false

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        password:
          tokenUrl: https://sandbox-uk-api.experian.com/oauth2/v1/token
          scopes: {}

  schemas:
    GetDocumentsResponse:
      type: object
      description: Response containing documents for a customer application and party.
      properties:
        message:
          type: string
          description: Response message.
          nullable: true
        customerApplicationId:
          type: string
          description: The customer application identifier.
          nullable: true
        correlationId:
          type: string
          description: Correlation identifier for tracking.
          nullable: true
        partyId:
          type: integer
          format: int32
          description: The party identifier.
        totalFilesForThisApplicant:
          type: integer
          format: int32
          description: Total number of files expected for this applicant.
        submittedFilesCountForThisApplicant:
          type: integer
          format: int32
          description: Number of files already submitted for this applicant.
        remainingFilesCountForThisApplicant:
          type: integer
          format: int32
          description: Number of files remaining to be submitted for this applicant.
        status:
          type: string
          description: Overall processing status.
          nullable: true
        documents:
          type: array
          description: List of documents.
          items:
            $ref: "#/components/schemas/DocumentInfo"
          nullable: true
      additionalProperties: false

    DocumentInfo:
      type: object
      description: Information about an uploaded document.
      properties:
        documentId:
          type: string
          format: uuid
          description: Unique identifier for the document.
        documentType:
          type: string
          description: Type of document (e.g., Payslip).
          nullable: true
        fileName:
          type: string
          description: Name of the uploaded file.
          nullable: true
        createdDate:
          type: string
          format: date-time
          description: Date and time when the document was created.
        updatedDate:
          type: string
          format: date-time
          description: Date and time when the document was last updated.
          nullable: true
      additionalProperties: false

    DocumentDetails:
      type: object
      description: Represents the details of the document being uploaded.
      properties:
        totalApplicantsInCustomerApplicationId:
          type: integer
          format: int32
        totalFilesForThisApplicant:
          type: integer
          format: int32
        documentType:
          type: string
          description: "Type of document (e.g., Payslip)"
          nullable: true
        fileName:
          type: string
          nullable: true
        documentContent:
          type: string
          format: byte
          nullable: true
        integrityValidationRules:
          type: array
          items:
            type: string
          nullable: true
        completenessValidationRules:
          type: array
          items:
            type: string
          nullable: true
      additionalProperties: false

    UploadApiResponse:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        customerApplicationId:
          type: string
          nullable: true
        correlationId:
          type: string
          format: uuid
          nullable: true
        partyId:
          type: integer
          format: int32
          nullable: true
        totalApplicantsInCustomerApplicationId:
          type: integer
          format: int32
          nullable: true
        totalFilesForThisApplicant:
          type: integer
          format: int32
          nullable: true
        submittedFilesCountForThisApplicant:
          type: integer
          format: int32
          nullable: true
        remainingFilesCountForThisApplicant:
          type: integer
          format: int32
          nullable: true
        documents:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true

    ErrorResponse:
      title: ErrorResponse
      type: object
      properties:
        errors:
          type: array
          description: Array of error response items.
          items:
            type: object
            properties:
              errorCode:
                type: string
              errorType:
                type: string
              message:
                type: string
        success:
          type: boolean
          default: false

    WebhookRequest:
      type: object
      properties:
        webhookName:
          type: string
          nullable: true
        webhookCallbackUrl:
          type: string
          nullable: true
        eventTypes:
          type: array
          items:
            type: string
          nullable: true
      additionalProperties: false

    WebhookResponse:
      type: object
      properties:
        webhookId:
          type: string
          format: uuid
        webhookName:
          type: string
          nullable: true
        webhookCallbackUrl:
          type: string
          nullable: true
        eventTypes:
          type: array
          items:
            type: string
          nullable: true
        datetimeCreated:
          type: string
          format: date-time
        datetimeUpdated:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false

    WebhookSecretResponse:
      type: object
      properties:
        sharedKey:
          type: string
          format: uuid
        datetimeCreated:
          type: string
          format: date-time
        datetimeUpdated:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
