swagger: '2.0'
info:
  version: 2.0.0
  title: Experian Verify Plus (Instant)
  description: >-
       This document consists of unencrypted version of Experian Verify service endpoints. Returns the most recent payroll record found (regardless of work status) within the last 90 days.
host: sandbox-us-api.experian.com
basePath: /consumerservices/verification/v2
securityDefinitions:
  OauthSecurity:
    type: oauth2
    flow: password
    tokenUrl: 'https://sandbox-us-api.experian.com/oauth2/v1/token'
    scopes:
      admin: admin scope
      user: user scope
schemes:
  - https
paths:
  '/experianverify':
    post:
      description: >-
        Returns the most recent payroll record found (regardless of work status) within the last 90 days.
      summary: Experian Verify income and employment report
      operationId: get income and employment data
      tags:
        - Consumer Services
      security:
        - OauthSecurity:
          - user
      parameters:
        - name: clientReferenceId
          in: header
          required: true
          description: >-
            API client generated reference Id to uniquely identify the transaction.
          type: string
        - name: Content-Type
          in: header
          required: true
          type: string
          description: Input Request format
          enum:
            - application/json
          default: application/json
        - name: Accept
          in: header
          required: true
          type: string
          description: Output Response format
          enum:
            - application/json
          default: application/json
        - name: subcode
          in: header
          required: true
          type: string
          description: unique value provided by experian at onboarding
        - name: body
          in: body
          description: >-
            Consumer's PII , Requestor Information, Addons and any custom
            options to be specified here.
          required: true
          schema:
            $ref: '#/definitions/RequestParams'
      responses:
        '200':
          description: API responds with a JSON.
          schema:
            $ref: '#/definitions/Response'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/AuthenticationErrorResponse'

        '403':
          description: Forbidden.
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '405':
          description: Method not Allowed
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '406':
          description: Not Acceptable
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '415':
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            experianTransactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '429':
          description: Too many requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: bad gateway.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '503':
          description: Service Unavailable.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '504':
          description: Gateway Timeout.
          schema:
            $ref: '#/definitions/ErrorResponse'
definitions:
  RequestParams:
    type: object
    description: Request Body
    required:
      - consumerPii
      - requestor
      - reportType
      - permissiblePurpose
    properties:
      consumerpii:
        $ref: '#/definitions/PII'
      requestor:
        $ref: '#/definitions/Requestor'
      permissiblePurpose:
        $ref: '#/definitions/PermissiblePurpose'
      resellerInfo:
        $ref: '#/definitions/Reseller'
      reportType:
          type: string
          description: Type of verification report
          enum:
            - ExpVerify-Plus
      vendorData:
        $ref: '#/definitions/VendorData'
      customOptions:
        $ref: '#/definitions/CustomOptions'
      reportCustomLabels:
        $ref: '#/definitions/reportCustomLabels'
  reportCustomLabels:
     type: object
     properties:
      label1:
        $ref: '#/definitions/label1'
      label2:
        $ref: '#/definitions/label2'
      label3:
        $ref: '#/definitions/label3'
      label4:
        $ref: '#/definitions/label4'
      label5:
        $ref: '#/definitions/label5'

  label1:
    type: object
    description : custom label 1
    properties:
      name:
        type: string
        description: Name of custom inquiry tag. For Mortgage, if Loan Number is a Custom Label, it is recommended to be placed in label1.
      value:
        type: string
        description: Value paired with named inquiry tag. For Mortgage, place Loan Number value here if Loan Number is the Custom Label in label1 name.
  label2:
    type: object
    description : custom label 2
    properties:
      name:
        type: string
        description: Name of custom inquiry tag
      value:
        type: string
        description: Value paired with named inquiry tag
  label3:
    type: object
    description : custom label 3
    properties:
      name:
        type: string
        description: Name of custom inquiry tag
      value:
        type: string
        description: Value paired with named inquiry tag

  label4:
    type: object
    description: custom label 4
    properties:
      name:
        type: string
        description: Name of custom inquiry tag
      value:
        type: string
        description: Value paired with named inquiry tag

  label5:
    type: object
    description : custom label 5
    properties:
      name:
        type: string
        description: Name of custom inquiry tag
      value:
        type: string
        description: Value paired with named inquiry tag
        
  PermissiblePurpose:
    type: object
    description: >-
      Provided by an Experian representative during the Experian Verify on-boarding process
    required:
      - type
    properties:
      type:
        type: string
        description: >-
          Permissible Purpose Type Code. 2 digits containing the account type
          code only.
        default: '18'
  Reseller:
    type: object
    description: >-
      If the API requestor is a reseller submitting a credit inquiry to
      Experian, additional information should be provided.
    properties:
      endUserName:
        type: string
        description: >-
          End User Identification. Resellers must enter the name of the end user if not already identified in the client’s subcode.
        default: ENDUSER
    required:
      - endUserName

  PII:
    type: object
    description: Personally Identifiable Information
    properties:
      applicantInformation:
        $ref: '#/definitions/Applicant'
    required:
      - applicantInformation
  PAName:
    type: object
    description: Consumer's Name
    properties:
      lastName:
        type: string
        description: >-
          The full applicant's surname is required. If the surname contains two
          surnames, then split the surnames with a hyphen (e.g., Smith-Jones).
          The surname can also be input with an apostrophe (e.g., O'Brien),
          although apostrophe usage is limited to the letters D, L, and O.
        default: CONSUMER
      firstName:
        type: string
        description: >-
          The full first name is required. The minimum entry is the first name
          initial. Blanks and special characters (except dash) are not allowed.
          Compound names should contain a dash (e.g., Billy-Bob).
        default: JOHN
      middleName:
        type: string
        description: >-
          The full middle name should be entered when available. A middle
          initial is acceptable. Blanks and special characters are not allowed.
          Omit if the middle name is not available.
        default: QUINCY
      generationCode:
        type: string
        description: Generation Code
        default: ""
    required:
      - firstName
      - lastName
  Address:
    type: object
    description: Consumer's Address
    properties:
      line1:
        type: string
        description: Address Line 1
        default: '10655 N BIRCH ST'
      line2:
        type: string
        description: Address Line 2
      line3:
        type: string
        description: Address Line 2
        default: ' '
      city:
        type: string
        description: City
        default: BURBANK
      state:
        type: string
        description: State
        default: CA
      zipCode:
        type: string
        description: ZIP Code
        default: '915021234'
    required:
      - zipCode
      - line1
      - city
      - state
  DOB:
    type: object
    description: Consumer's Date of Birth
    properties:
      dob:
        type: string
        description: >-
         Year Of Birth or Date of Birth. This describes year of birth of the primary applicant. It must be or 8 (MMDDYYYY) digits.
        default: '10181955'
    required:
      - dob
  SSN:
    type: object
    description: Full Social Security number should be entered. The social may be input with or without hyphens (e.g., 123456789 or 123-45-6789).
    properties:
      ssn:
        type: string
        description: Social Security Number
        default: '123456789'
    required:
      - ssn
  Phone:
    type: object
    description: Consumer's Phone
    properties:
      number:
        type: string
        description: Consists of 10 digits (3-digit prefix, and 7-digit number) and may contain embedded hyphens, parentheses, or periods.
        default: 818.555.1111
      type:
        type: string
        description: One-digit phone type code (optional). The valid Phone Type codes are Residential = R Business = B Institution = I Fax = F Cellular = C Pay Phone = T
        default: R
  Applicant:
    type: object
    description: Applicant Information
    properties:
      name:
        $ref: '#/definitions/PAName'
      ssn:
        $ref: '#/definitions/SSN'
      dob:
        $ref: '#/definitions/DOB'
      phone:
        type: array
        items:
          $ref: '#/definitions/Phone'
      currentAddress:
        $ref: '#/definitions/Address'
    required:
      - name
      - dob
      - ssn
      - currentAddress
  Requestor:
    type: object
    description: Information on the API requestor
    properties:
      subscriberCode:
        type: string
        description: Subscriber Number assigned by Experian
        default: '5991764'
      verifierName:
        type: string
        description: the company name of verifier (ex. the name of the lender)
        default: 'experian'
    required:
      - subscriberCode
      - verifierName
  VendorData:
    type: object
    description: >-
        Optional field. To understand whose application the client is using to send in the inquiry - Vendor, 3rd Party, Reseller, or client home grown.
    properties:
      vendorNumber:
        type: string
        description: Optional field. To understand whose application the client is using to send in the inquiry - Vendor, 3rd Party, Reseller, or client home grown.
        default: 1.00
      vendorVersion:
        type: string
        description: Optional. Vendor’s Application version.  Alpha-numeric with dot(.). Max length is 6.

  CustomOptions:
    type: object
    description: >-
      Ancillary Options such as ICRAA (Client custom options if any that have
      been setup) that can be requested by client. Value= “ICRAA” (not case sensitive)ICRAA = Investigative Consumer Reporting Agencies Act ICRAA regulates the use of consumer reports for employment, insurance and rental property decisions where the consumer is located in California, the place of employment is located in California or the subject of the insurance coverage is located in California or the rental property is located in California, OR the employment, insurance or rental decision is made in California.  If an Experian Verify request is subject to ICRAA, provide “ICRAA” as the CustomOption upon inquiry.
    properties:
      optionId:
        type: array
        items:
          type: string
          description: Custom option id
   

  Response:
    type: object
    properties:
      expVerifyReport:
        $ref: '#/definitions/consumerReportResponse'
      incomeReport:
        $ref: '#/definitions/consumerReportResponse'
      pdfbytes:
        type: string
        description: pdf bytes array base 64 encoding
  consumerReportResponse:
    type: object
    description: Response information for consumer body
    properties:
      reportId:
        type: string
        description: unique id given to consumer report
      reportType:
        type: string
        description: type of verification report client
        enum:
            - ExpVerify-Plus
      reportGeneratedDate:
        type: string
        description: report created date by experian (unixtimestamp)
      requestor:
        $ref: '#/definitions/Requestor'
      resellerInfo:
        $ref: '#/definitions/Reseller'
      reportCustomLabels:
        $ref: '#/definitions/reportCustomLabels'
      consumerPii:
        $ref: '#/definitions/PIIList'
  PIIList:
    type: object
    description: Personally Identifiable Information
    properties:
      applicantInformation:
        $ref: '#/definitions/ApplicantResponse'
      employmentHistory:
        type: array
        description : contains consumers employer information
        items:
           $ref: '#/definitions/employmentHistoryList'
  PANameResponse:
    type: object
    description: Consumer's Name
    properties:
      lastName:
        type: string
        description: >-
          Last Name given in data provider report
      firstName:
        type: string
        description: >-
          First Name given in data provider report
      middleName:
        type: string
        description: >-
          Middle Name given in data provider report
      generationCode:
        type: string
        description: Generation Code
        default: ""
  SSNResponse:
    type: object
    description: Consumer's Social Security Number
    properties:
      ssn:
        type: string
        description: Social Security Number

  DOBResponse:
    type: object
    description: Date of Birth
    properties:
      dob:
        type: string
        description: date of birth

  ApplicantResponse:
    type: object
    description: Applicant Information
    properties:
      name:
        $ref: '#/definitions/PANameResponse'
      ssn:
        $ref: '#/definitions/SSNResponse'
      dob:
        $ref: '#/definitions/DOBResponse'
      phone:
        type: array
        items:
          $ref: '#/definitions/Phone'
      currentAddress:
        $ref: '#/definitions/Address'
    required:
      - name
      - dob
      - ssn
      - currentAddress
  totalAnnualRemunerationList:
     type: object
     description: contains employment history details
     properties:
      year:
        type: number
        format: double
        description: payroll year
      amount:
        type: number
        format: double
        description: payroll year amount
        default: 180000.56
      currencyCode:
        type: string
        description: payroll year currency code
        default: USD
  employmentHistoryList:
    type: object
    description: contains employment history details
    properties:
      asOfDate:
        type: string
        description: Date on which the employer record was last updated    
      originReportId:
        type: string
        description: Unique id provided by data provider
      originSourceId:
        type: string
        description: Internal use only – will be returned as a null value 
      employerIdentificationNumber:
        type: string
        description: Federal employer Identification Number (FEIN)
      employerName:
        type: string
        description: Employer’s name
      originalHireDate:
        type: string
        description: date on which employee was hired ex 01012009 (MMDDYYYY) 8 digits. 
      mostRecentHireDate :
        type: string
        description: most recent date on which employee was hired. ex 01012009 (MMDDYYYY) 8 digits.
      employerAddress:
        $ref: '#/definitions/employerAddressFields'
      employmentStatus:
        $ref: '#/definitions/employmentstatus'
      workStatus:
        $ref: '#/definitions/workstatus'
      paymentHistory:
        $ref: '#/definitions/paymentHistoryList'
      totalAnnualRemuneration:
        type: array
        description : contains consumers employer information
        items:
           $ref: '#/definitions/totalAnnualRemunerationList'
  paymentHistoryList:
    type: array
    description: contains list of consumers individual paycheck data
    items:
      $ref: '#/definitions/payment'
  payment:
     type: object
     description: Summary Attributes
     properties:
      payDate:
        type: string
        description: individual paycheck generated date
      payCycle:
        type: string
        description: pay frequency
      payPeriod:
        $ref: '#/definitions/payPeriodList'
      grossPayAmount:
        $ref: '#/definitions/grossPayAmountList'

  grossPayAmountList:
    type: object
    description : gross pay for this pay period
    properties:
      amount:
        type: number
        format: double
        description: gross pay amount
        default: 3000.85
      currencyCode:
        type: string
        description: gross pay currency code
        default: USD
  payPeriodList:
    type: object
    description : payPeriod
    properties:
      startDate:
        type: string
        description: pay period begin date
      endDate:
        type: string
        description: pay period end date

  workstatus:
    type: object
    description: >-
      employee work status (A = Active, I = Inactive, L = On Leave, R = Retired, N = Not Available)
    properties:
      name:
        type: string
        description: >-
          name - Active, Inactive, On Leave, Retired, Not Available
      code:
        type: string
        description: >-
          code - A, I, L, R, N
  employmentstatus:
    type: object
    description: >-
      employment type (i.e. Full-time, part-time, regular, temp, contractor)
    properties:
      name:
        type: string
        description: >-
           Full or Part Time Employer could enter a freeform text to denote a worker level name for the employee. When ingesting the JSON response please account for unexpected or new values being returned as more data providers are added to the Experian Verify service.
      code:
        type: string
        description: >-
          F= Full Time P = Part Time Employer could enter a freeform text to denote a worker level name for the employee. Code will start with the first letter of the text provided.  When ingesting the JSON response please account for unexpected or new values being returned as more data providers are added to the Experian Verify service.
  employerAddressFields:
    type: object
    description : contains employer address data elements
    properties:
      lineOne:
        type: string
        description: employer address street address
      lineTwo:
        type: string
        description: employer address street address
      lineThree:
        type: string
        description: employer address street address
      cityName:
        type: string
        description: employer address city field
      state:
        type: string
        description: employer address postal code
      countryCode:
        type: string
        description: employer address country code
      postalCode:
        type: string
        description: employer address postal code

  AuthenticationErrorResponse:
    type: object
    properties:
      errors:
        type: array
        minLength: 1
        items:
          $ref: '#/definitions/AuthenticationError'
  AuthenticationError:
    type: object
    description: Error Response
    properties:
      errorCode:
        type: string
        description: Client friendly message explaining the error
      message:
        type: string
        description: Experian generated code for this error

  ErrorResponse:
    type: object
    properties:
      errors:
        type: array
        minLength: 1
        items:
          $ref: '#/definitions/Error'
  Error:
    type: object
    description: Error Response
    properties:
      errorCode:
        type: string
        description: Client friendly message explaining the error
      message:
        type: string
        description: Experian generated code for this error
      errorType:
        type: string
        description: To identify the type of error if that is Api Validation or Backend Error.
