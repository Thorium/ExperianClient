openapi: 3.0.0
info:
  title: CI-OpenBanking-Score-BR
  description: API de Scoring Serasa baseada em dados do Open Banking API
  version: 1.0.0
  license:
    name: MIT
  contact:
    name: Serasa Experian
    url: 'http://www.serasaexperian.com.br'
    email: serasa@serasaexperian.com.br
tags:
  - name: scores
    description: Provides the score of the customer
servers:
  - url: 'https://sandbox-api.serasaexperian.com.br/open-banking/score/v1'
paths:
  /scores:
    post:
      tags:
        - scores
      description: Provides the score of the customer
      summary: Provides the score of the customer
      operationId: score
      security:
        - OauthSecurityClient:
            - read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Score'
        description: Open Banking Data
      responses:
        '201':
          $ref: '#/components/responses/OKScore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/OKScore'
components:
  schemas:
    Score:
      type: object
      description: Open Banking Data
      properties:
        customerId:
          type: string
          maxLength: 11
          pattern: '^\d{11}$'
          description: |
            CPF da pessoa para qual deseja obter o Score (Preencher com o CPF sem formatação)
          example: '43908445778'
        creditCardScore:
          type: object
          properties:
            creditCardAccountsList:
              type: array
              minItems: 0
              items:
                type: object
                description: Conjunto de informações das Contas de pagamento pós paga
                required:
                  - brandName
                  - companyCnpj
                  - name
                  - productType
                  - creditCardNetwork
                  - creditCardAccountId
                properties:
                  creditCardAccountId:
                    type: string
                    description: 'Identifica de forma única a conta pagamento pós-paga do cliente, mantendo as regras de imutabilidade dentro da instituição transmissora.'
                    minLength: 1
                    maxLength: 100
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    example: XXZTR3459087
                  brandName:
                    type: string
                    description: 'Nome da Marca reportada pelo participante no Open Finance. Recomenda-se utilizar, sempre que possível, o mesmo nome de marca atribuído no campo do diretório Customer Friendly Server Name (Authorisation Server).'
                    pattern: '[\w\W\s]*'
                    maxLength: 80
                    example: Organização A
                  companyCnpj:
                    type: string
                    description: 'Número completo do CNPJ da instituição responsável pelo Cadastro - o CNPJ corresponde ao número de inscrição no Cadastro de Pessoa Jurídica. Deve-se ter apenas os números do CNPJ, sem máscara'
                    pattern: '^\d{14}$'
                    maxLength: 14
                    example: '21128159000166'
                  name:
                    type: string
                    description: 'Denominação/Identificação do nome da conta de pagamento pós-paga (cartão). Conforme CIRCULAR Nº 3.680,BCB, 2013: ''conta de pagamento pós-paga: destinada à execução de transações de pagamento que independem do aporte prévio de recursos'
                    pattern: '[\w\W\s]*'
                    maxLength: 50
                    example: Cartão Universitário
                  productType:
                    type: string
                    description: 'Categoria atribuída a um cartão de pagamento, sob uma certa denominação, que lhe agrega um conjunto de vantagens, diferenciando-o de acordo com o perfil do portador.'
                    maxLength: 26
                    enum:
                      - CLASSIC_NACIONAL
                      - CLASSIC_INTERNACIONAL
                      - GOLD
                      - PLATINUM
                      - INFINITE
                      - ELECTRON
                      - STANDARD_NACIONAL
                      - STANDARD_INTERNACIONAL
                      - ELETRONIC
                      - BLACK
                      - REDESHOP
                      - MAESTRO_MASTERCARD_MAESTRO
                      - GREEN
                      - BLUE
                      - BLUEBOX
                      - PROFISSIONAL_LIBERAL
                      - CHEQUE_ELETRONICO
                      - CORPORATIVO
                      - EMPRESARIAL
                      - COMPRAS
                      - BASICO_NACIONAL
                      - BASICO_INTERNACIONAL
                      - NANQUIM
                      - GRAFITE
                      - MAIS
                      - OUTROS
                    example: OUTROS
                  productAdditionalInfo:
                    type: string
                    description: Informações complementares se tipo de Cartão 'OUTROS'
                    pattern: '[\w\W\s]*'
                    maxLength: 50
                  creditCardNetwork:
                    type: string
                    description: |
                      Categoria de Bandeiras de Cartões de Crédito (Instituidor do arranjo de pagamento).
                      Bandeira é a detentora de todos os direitos e deveres da utilização da marca estampada no cartão, inclusive as bandeiras pertencentes aos emissores.
                    maxLength: 17
                    enum:
                      - VISA
                      - MASTERCARD
                      - AMERICAN_EXPRESS
                      - DINERS_CLUB
                      - HIPERCARD
                      - BANDEIRA_PROPRIA
                      - CHEQUE_ELETRONICO
                      - ELO
                      - OUTRAS
                    example: VISA
                  networkAdditionalInfo:
                    type: string
                    description: Texto livre para especificar categoria de bandeira marcada como 'OUTRAS'
                    pattern: '[\w\W\s]*'
                    maxLength: 50
                    example: AURA CARD
                  paymentMethod:
                    type: array
                    items:
                      type: object
                      description: Conjunto de informações relativas aos Meios de Pagamento da Conta de pagamento pós-paga
                      required:
                        - identificationNumber
                        - isMultipleCreditCard
                      properties:
                        identificationNumber:
                          type: string
                          description: |
                            Número de identificação do cartão: corresponde aos 4 últimos dígitos do cartão para PF, ou então, preencher com um identificador para PJ, com as caracteristicas definidas para os IDs no Open Banking.
                          minLength: 1
                          maxLength: 100
                          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                          example: '4453'
                        isMultipleCreditCard:
                          type: boolean
                          description: |
                            Indica se o Cartão de crédito associado à conta pagamento pós-paga é múltiplo ou não. Cartões denominados múltiplos possuem tanto a função crédito quanto a função débito, devendo o proprietário do cartão, no momento de sua utilização, informar se o pagamento é na função crédito (que leva a um pagamento futuro, por meio de uma fatura do cartão de crédito) ou na função débito.
                          example: true
                      additionalProperties: false
                    minItems: 1
                    description: Conjunto de informações relativas aos Meios de Pagamento da Conta de pagamento pós-paga
                additionalProperties: false
            creditCardAccountsBills:
              type: array
              minItems: 0
              items:
                type: object
                description: Conjunto das informações referentes a lista de faturas associadas à conta de pagamento pós-paga
                required:
                  - creditCardAccountId
                  - billId
                  - dueDate
                  - billTotalAmount
                  - billTotalAmountCurrency
                  - billMinimumAmount
                  - billMinimumAmountCurrency
                  - isInstalment
                  - financeCharges
                  - payments
                properties:
                  creditCardAccountId:
                    type: string
                    description: 'Identifica de forma única a conta pagamento pós-paga do cliente, mantendo as regras de imutabilidade dentro da instituição transmissora.'
                    maxLength: 100
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    example: XXZTR3459087
                  billId:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    example: MTU0OTU1NjI2NTk4OTRmc2ZhZDRmc2Q1NmZkM
                    description: Informação que identifica a fatura onde consta a transação informada.
                  dueDate:
                    description: 'Data de vencimento da Fatura, que aparece para pagamento pelo cliente'
                    type: string
                    format: date
                    maxLength: 10
                    pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
                    example: '2021-05-21'
                  billTotalAmount:
                    description: Valor total da faturas. O campo deve assumir valor positivo para saldo devedor e negativo para saldo credor.
                    type: object
                    properties:
                      amount:
                        description: Valor total da faturas. Expresso em valor monetário com 4 casas decimais.
                        type: string
                        pattern: '^-?\d{1,15}\.\d{2,4}$'
                        maxLength: 20
                        minLength: 4
                        example: '1000.0400'
                      currency:
                        description: 'Moeda referente ao valor monetário, seguindo o modelo ISO-4217.'
                        type: string
                        maxLength: 3
                        pattern: '^[A-Z]{3}$'
                        example: BRL
                  billMinimumAmount:
                    type: object
                    properties:
                      amount:
                        description: Valor do pagamento minimo da fatura
                        type: string
                        pattern: '^\d{1,15}\.\d{2,4}$'
                        maxLength: 20
                        minLength: 4
                        example: '1000.0400'
                      currency:
                        description: 'Moeda referente ao valor monetário, seguindo o modelo ISO-4217.'
                        type: string
                        maxLength: 3
                        pattern: '^[A-Z]{3}$'
                    example: BRL
                  isInstalment:
                    type: boolean
                    description: Indica se a fatura permite parcelamento (true) ou não (false).
                    example: false
                  financeCharges:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - amount
                        - currency
                      properties:
                        type:
                          type: string
                          description: |
                            Traz a denominação dos Encargos que
                            incidem na fatura da conta de pagamento pós-paga. (Vide Enum)
                            - Juros remuneratórios por atraso no pagamento da fatura
                            - Multa por atraso no pagamento da fatura
                            - Juros de mora por atraso no pagamento da fatura
                            - IOF
                            - Outros
                          enum:
                            - JUROS_REMUNERATORIOS_ATRASO_PAGAMENTO_FATURA
                            - MULTA_ATRASO_PAGAMENTO_FATURA
                            - JUROS_MORA_ATRASO_PAGAMENTO_FATURA
                            - IOF
                            - OUTROS
                        additionalInfo:
                          type: string
                          pattern: '[\w\W\s]*'
                          example: Informações Adicionais
                          description: 'Campo livre, de preenchimento obrigatório se selecionado tipo de encargo ''OUTROS'''
                        amount:
                          type: string
                          minLength: 4
                          maxLength: 21
                          nullable: true
                          pattern: '^-?\d{1,15}\.\d{2,4}$'
                          example: '100000.0400'
                          description: Valor cobrado pelo encargo. Expresso em valor monetário com 4 casas decimais
                        currency:
                          type: string
                          maxLength: 3
                          pattern: '^(\w{3}){1}$'
                          example: BRL
                          description: |
                            Moeda referente ao valor cobrado pelo encargo, segundo modelo ISO-4217. p.ex. 'BRL'
                            Todos os saldos informados estão representados com a moeda vigente do Brasil.
                      additionalProperties: false
                    minItems: 1
                    description: Lista dos encargos cobrados na fatura
                  payments:
                    type: array
                    items:
                      type: object
                      required:
                        - valueType
                        - paymentDate
                        - paymentMode
                        - amount
                        - currency
                      properties:
                        valueType:
                          type: string
                          description: |
                            Traz os tipos dos valores relativos aos pagamentos da fatura da conta de pagamento pós-paga: (Vide Enum)
                             - Valor de pagamento da fatura com parcelamento: Quando o pagamento corresponde ao fato gerador para abertura do plano de parcelamento da fatura
                             - Valor pagamento da fatura realizado: Quando o pagamento corresponde ao valor total da fatura
                             - Outro Valor pago na fatura: Demais casos
                          enum:
                            - VALOR_PAGAMENTO_FATURA_PARCELADO
                            - VALOR_PAGAMENTO_FATURA_REALIZADO
                            - OUTRO_VALOR_PAGO_FATURA
                        paymentDate:
                          description: Data efetiva de quando o Pagamento da fatura foi realizado
                          type: string
                          format: date
                          maxLength: 10
                          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
                          example: '2021-05-21'
                        paymentMode:
                          type: string
                          description: |
                            Traz as formas de efetivação do pagamento realizado: (Vide Enum)
                            - Débito em conta corrente
                            - Boleto bancário
                            - Averbação em folha
                            - PIX
                          enum:
                            - DEBITO_CONTA_CORRENTE
                            - BOLETO_BANCARIO
                            - AVERBACAO_FOLHA
                            - PIX
                        amount:
                          type: string
                          pattern: '^\d{1,15}\.\d{2,4}$'
                          maxLength: 20
                          minLength: 4
                          example: '1000.0400'
                          description: Valor pagamento segundo o valueType. Expresso em valor monetário com 4 casas decimais. O campo não pode assumir valor negativo por se tratar de um pagamento.
                        currency:
                          type: string
                          pattern: '^(\w{3}){1}$'
                          maxLength: 3
                          description: |
                            Moeda referente ao valor de pagamento da fatura, segundo modelo ISO-4217. p.ex. 'BRL' Todos os valores informados estão representados com a moeda vigente do Brasil
                          example: BRL
                      additionalProperties: false
                    minItems: 0
                    description: Lista que traz os valores relativos aos pagamentos da Fatura da conta de pagamento pós-paga
                additionalProperties: false
            creditCardAccountsTransaction:
              type: array
              minItems: 0
              items:
                type: object
                description: Lista que traz os valores relativos aos saldos do Limite de crédito total da conta de pagamento pós-paga
                required:
                  - creditCardAccountId
                  - transactionId
                  - identificationNumber
                  - transactionName
                  - creditDebitType
                  - transactionType
                  - paymentType
                  - chargeIdentificator
                  - brazilianAmount
                  - amount
                  - currency
                  - transactionDate
                  - billPostDate
                  - payeeMCC
                properties:
                  creditCardAccountId:
                    type: string
                    description: 'Identifica de forma única a conta pagamento pós-paga do cliente, mantendo as regras de imutabilidade dentro da instituição transmissora.'
                    maxLength: 100
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    example: XXZTR3459087
                  transactionId:
                    type: string
                    maxLength: 100
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
                    description: Código ou identificador único prestado pela instituição que mantém a conta para representar a transação individual.
                  identificationNumber:
                    type: string
                    maxLength: 100
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$'
                    example: '4453'
                    description: |
                      Número de identificação do cartão: corresponde aos 4 últimos dígitos do cartão para PF, ou então, preencher com um identificador para PJ, com as caracteristicas definidas para os IDs no Open Banking.
                  transactionName:
                    type: string
                    maxLength: 300
                    pattern: '[\w\W\s]*'
                    example: PGTO
                    description: Campo de livre preenchimento. Literal usada na instituição financeira para identificar a transação
                  billId:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    example: MTU0OTU1NjI2NTk4OTRmc2ZhZDRmc2Q1NmZkM
                    description: |
                      Informação que identifica a fatura onde consta a transação informada.
                  creditDebitType:
                    $ref: '#/components/schemas/EnumCreditDebitIndicator'
                  transactionType:
                    type: string
                    description: Traz os tipos de Transação
                    enum:
                      - PAGAMENTO
                      - TARIFA
                      - OPERACOES_CREDITO_CONTRATADAS_CARTAO
                      - ESTORNO
                      - CASHBACK
                      - OUTROS
                    example: CASHBACK
                  transactionalAdditionalInfo:
                    type: string
                    pattern: '^\S[\s\S]*$'
                    maxLength: 140
                    description: 'Campo livre, de preenchimento obrigatório quando selecionado tipo de transação "OUTROS"'
                  paymentType:
                    type: string
                    description: |
                      Traz os tipos de pagamento. Preenchimento obrigatório se selecionado tipo de transação PAGAMENTO.

                      Para transmissora: preencher com qualquer opção.

                      Para recebedora: ignorar o campo preenchido quando não for uma transação do tipo pagamento.
                    enum:
                      - A_VISTA
                      - A_PRAZO
                    example: A_VISTA
                  feeType:
                    type: string
                    description: |
                      Traz os tipos de Tarifas: (Vide Enum) Anuidade, Saque comartão no Brasil, Saque com cartão no exterior, Avaliação emergencial de crédito, Emissão segunda via, Tarifa pagamento de contas, SMS, OUTRA.

                      Para transmissora: quando não for do tipo TARIFA, preenche com OUTRA.

                      Para recebedora: ignorar o campo preenchido conforme esse cenário.

                      [Restrição] Preenchimento obrigatório se Tipo de Transação selecionada for 'TARIFA'.
                    enum:
                      - ANUIDADE
                      - SAQUE_CARTAO_BRASIL
                      - SAQUE_CARTAO_EXTERIOR
                      - AVALIACAO_EMERGENCIAL_CREDITO
                      - EMISSAO_SEGUNDA_VIA
                      - TARIFA_PAGAMENTO_CONTAS
                      - SMS
                      - OUTRA
                    example: ANUIDADE
                  feeTypeAdditionalInfo:
                    type: string
                    pattern: '^\S[\s\S]*$'
                    maxLength: 140
                    description: 'Campo livre, de preenchimento obrigatório quando selecionada tipo de tarifa "OUTRA"'
                  otherCreditsType:
                    type: string
                    description: |
                      Traz outros tipos de crédito contratados no cartão.
                      [Restrição] Preenchimento obrigatório se o tipo transação selecionado for 'OPERACOES_CREDITO_CONTRATADAS_CARTAO'.

                      Para transmissora: Quando não for do tipo OPERACOES_CREDITO_CONTRATADAS_CARTAO, preencher com OUTROS.

                      Para recebedora: Ignorar o campo preenchido conforme esse cenário.
                    enum:
                      - CREDITO_ROTATIVO
                      - PARCELAMENTO_FATURA
                      - EMPRESTIMO
                      - OUTROS
                    example: CREDITO_ROTATIVO
                  otherCreditsAdditionalInfo:
                    type: string
                    pattern: '^\S[\s\S]*$'
                    maxLength: 50
                    description: |
                      Campo livre para preenchimento de dados adicionais de outros tipos de crédito contratados no cartão.

                      [ Restrição ] Preenchimento obrigatório quando selecionado no campo outros tipos de crédito "OUTROS".
                  chargeIdentificator:
                    type: string
                    maxLength: 50
                    pattern: '[\w\W\s]*'
                    example: PARCELA_1
                    description: Identificador da parcela que está sendo informada. Campo de livre preenchimento
                  chargeNumber:
                    type: number
                    format: integer
                    maximum: 999
                    example: 12
                    description: |
                      Quantidade de parcelas.
                      [Restrição] O campo deve ser preenchido quando houverem parcelas relacionadas a transação.
                  brazilianAmount:
                    type: object
                    description: 'Valor da transação expresso em valor monetário com 4 casas decimais, em moeda corrente do Brasil'
                    required:
                      - amount
                      - currency
                    properties:
                      amount:
                        type: string
                        pattern: '^\d{1,15}\.\d{2,4}$'
                        maxLength: 20
                        minLength: 4
                        example: '1000.0400'
                        description: Valor relacionado ao objeto.
                      currency:
                        type: string
                        pattern: '^[A-Z]{3}$'
                        maxLength: 3
                        description: 'Moeda referente ao valor monetário, seguindo o modelo ISO-4217.'
                        example: BRL
                    additionalProperties: false
                  amount:
                    type: object
                    description: "\t Valor da transação. Expresso em valor monetário com no mínimo 2 casas e no máximo 4 casas decimais. Se a transação foi realizada em moeda estrangeira, deve ser preenchido com o valor original da transação, sem convertê-lo."
                    required:
                      - amount
                      - currency
                    properties:
                      amount:
                        type: string
                        pattern: '^\d{1,15}\.\d{2,4}$'
                        maxLength: 20
                        minLength: 4
                        example: '1000.0400'
                        description: Valor relacionado ao objeto.
                      currency:
                        type: string
                        pattern: '^[A-Z]{3}$'
                        maxLength: 3
                        description: 'Moeda referente ao valor monetário, seguindo o modelo ISO-4217.'
                        example: BRL
                    additionalProperties: false
                  transactionDate:
                    type: string
                    format: date
                    maxLength: 20
                    pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$|^NA$'
                    example: '2021-05-21'
                    description: Data original da transação
                  billPostDate:
                    type: string
                    format: date
                    maxLength: 20
                    pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$|^NA$'
                    example: '2021-05-21'
                    description: Data em que a transação foi inserida na fatura
                  payeeMCC:
                    type: number
                    format: integer
                    maximum: 2147483647
                    example: 5137
                    description: |
                      O MCC ou o código da categoria do estabelecimento comercial. Os MCCs são agrupados segundo suas similaridades. O MCC é usado para classificar o negócio pelo tipo fornecido de bens ou serviços. Os MCCs são atribuídos por tipo de comerciante (por exemplo, um para hotéis, um para lojas de materiais de escritório, etc.) ou por nome de comerciante (por exemplo, 3000 para a United Airlines).
                additionalProperties: false
            creditCardAccountsLimits:
              type: array
              minItems: 0
              items:
                type: object
                description: Conjunto de informações referentes aos limites da conta de pagamento pós-paga.
                required:
                  - creditCardAccountId
                  - currency
                  - creditLineLimitType
                  - consolidationType
                  - identificationNumber
                  - isLimitFlexible
                  - usedAmount
                properties:
                  creditCardAccountId:
                    type: string
                    description: 'Identifica de forma única a conta pagamento pós-paga do cliente, mantendo as regras de imutabilidade dentro da instituição transmissora.'
                    maxLength: 100
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    example: XXZTR3459087
                  creditLineLimitType:
                    type: string
                    description: Indicador do tipo de limite
                    enum:
                      - LIMITE_CREDITO_TOTAL
                      - LIMITE_CREDITO_MODALIDADE_OPERACAO
                    example: LIMITE_CREDITO_TOTAL
                  consolidationType:
                    type: string
                    description: Indicador que permite informar se o valor do limite é consolidado ou individual.
                    enum:
                      - CONSOLIDADO
                      - INDIVIDUAL
                    example: CONSOLIDADO
                  identificationNumber:
                    type: string
                    description: |
                      Número de identificação do cartão: corresponde aos 4 últimos dígitos do cartão para PF, ou então, preencher com um identificador para PJ, com as caracteristicas definidas para os IDs no Open Banking.
                    minLength: 1
                    maxLength: 100
                    pattern: '^^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    example: '4453'
                  lineName:
                    $ref: '#/components/schemas/EnumCreditCardAccountsLineName'
                  lineNameAdditionalInfo:
                    type: string
                    maxLength: 50
                    pattern: '^[\w\W\s]*'
                    example: Informações adicionais e complementares.
                    description: Campo de preenchimento obrigatório se selecionada a opção 'OUTRAS' em lineName.
                  isLimitFlexible:
                    type: boolean
                    description: 'Indica se a operação de crédito é: com limite flexível (true) ou com limite (false).'
                    example: true
                  limitAmount:
                    description: Valor total do limite informado.
                    type: object
                    required:
                      - amount
                      - currency
                    properties:
                      amount:
                        type: string
                        pattern: '^\d{1,15}\.\d{2,4}$'
                        maxLength: 20
                        minLength: 4
                        example: '1000.0400'
                        description: Valor total do limite informado expresso em valor monetário com no mínimo 2 casas e no máximo 4 casas decimais.
                      currency:
                        type: string
                        maxLength: 3
                        pattern: '^[A-Z]{3}$'
                        example: BRL
                        description: 'Moeda referente ao limite informado, segundo modelo ISO-4217. p.ex. ''BRL.'' Todos os limite informados estão representados com a moeda vigente do Brasil.'
                  usedAmount:
                    description: Valor total do limite informado.
                    type: object
                    required:
                      - amount
                      - currency
                    properties:
                      amount:
                        type: string
                        pattern: '^-?\d{1,15}\.\d{2,4}$'
                        maxLength: 21
                        minLength: 4
                        example: '1000.0400'
                        description: Valor total do limite informado expresso em valor monetário com no mínimo 2 casas e no máximo 4 casas decimais.
                      currency:
                        type: string
                        maxLength: 3
                        pattern: '^[A-Z]{3}$'
                        example: BRL
                        description: 'Moeda referente ao limite informado, segundo modelo ISO-4217. p.ex. ''BRL.'' Todos os limite informados estão representados com a moeda vigente do Brasil.'
                  availableAmount:
                    description: Valor total do limite informado.
                    type: object
                    properties:
                      amount:
                        type: string
                        pattern: '^-?\d{1,15}\.\d{2,4}$'
                        maxLength: 21
                        minLength: 4
                        example: '1000.0400'
                        description: |
                          Valor total do limite informado expresso em valor monetário com no mínimo 2 casas e no máximo 4 casas decimais.

                          [Restrição] O campo é obrigatório caso isLimitFlexible for igual a false.
                      currency:
                        type: string
                        maxLength: 3
                        pattern: '^[A-Z]{3}$'
                        example: BRL
                        description: |
                          Moeda referente ao limite informado, segundo modelo ISO-4217. p.ex. 'BRL.' Todos os limite informados estão representados com a moeda vigente do Brasil.

                          [Restrição] O campo é obrigatório caso isLimitFlexible for igual a false.
                additionalProperties: false
        accountScore:
          type: object
          properties:
            accountsList:
              type: array
              minItems: 0
              items:
                type: object
                required:
                  - brandName
                  - companyCnpj
                  - type
                  - compeCode
                  - branchCode
                  - number
                  - checkDigit
                  - accountId
                properties:
                  brandName:
                    type: string
                    pattern: '[\w\W\s]*'
                    description: |
                      Nome da Marca reportada pelo participante no Open Finance. Recomenda-se utilizar, sempre que possível, o mesmo nome de marca atribuído no campo do diretório Customer Friendly Server Name (Authorisation Server).
                    maxLength: 80
                    example: Organização A
                  companyCnpj:
                    type: string
                    maxLength: 14
                    pattern: '^\d{14}$'
                    description: 'Número completo do CNPJ da instituição responsável pelo Cadastro - o CNPJ corresponde ao número de inscrição no Cadastro de Pessoa Jurídica. Deve-se ter apenas os números do CNPJ, sem máscara'
                    example: '21128159000166'
                  type:
                    type: string
                    enum:
                      - CONTA_DEPOSITO_A_VISTA
                      - CONTA_POUPANCA
                      - CONTA_PAGAMENTO_PRE_PAGA
                    description: |
                      Tipos de contas. Modalidades tradicionais previstas pela Resolução 4.753, não contemplando contas vinculadas, conta de domiciliados no exterior, contas em moedas estrangeiras e conta correspondente moeda eletrônica. Vide Enum
                      Conta de depósito à vista ou Conta corrente - é o tipo mais comum. Nela, o dinheiro fica à sua disposição para ser sacado a qualquer momento. Essa conta não gera rendimentos para o depositante
                      Conta poupança - foi criada para estimular as pessoas a pouparem. O dinheiro que ficar na conta por trinta dias passa a gerar rendimentos, com isenção de imposto de renda para quem declara. Ou seja, o dinheiro “cresce” (rende) enquanto ficar guardado na conta. Cada depósito terá rendimentos de mês em mês, sempre no dia do mês em que o dinheiro tiver sido depositado
                      Conta de pagamento pré-paga: segundo CIRCULAR Nº 3.680, BCB de  2013, é a 'destinada à execução de transações de pagamento em moeda eletrônica realizadas com base em fundos denominados em reais previamente aportados'
                    example: CONTA_DEPOSITO_A_VISTA
                  compeCode:
                    type: string
                    description: 'Código identificador atribuído pelo Banco Central do Brasil às instituições participantes do STR (Sistema de Transferência de reservas).O Compe (Sistema de Compensação de Cheques e Outros Papéis) é um sistema que identifica e processa as compensações bancárias. Ele é representado por um código de três dígitos que serve como identificador de bancos, sendo assim, cada instituição bancária possui um número exclusivo'
                    pattern: '^\d{3}$'
                    maxLength: 3
                    example: '001'
                  branchCode:
                    type: string
                    description: |
                      Código da Agência detentora da conta. (Agência é a dependência destinada ao atendimento aos clientes, ao público em geral e aos associados de cooperativas de crédito, no exercício de atividades da instituição, não podendo ser móvel ou transitória)

                      [Restrição] Obrigatoriamente deve ser preenchido quando o campo "type" for diferente de CONTA_PAGAMENTO_PRE_PAGA.
                    pattern: '^\d{4}$'
                    maxLength: 4
                    example: '6272'
                  number:
                    type: string
                    description: Número da conta
                    pattern: '^\d{8,20}$$'
                    maxLength: 20
                    example: '94088392'
                  checkDigit:
                    type: string
                    description: Dígito da conta
                    pattern: '[\w\W\s]*'
                    maxLength: 1
                    example: '4'
                  accountId:
                    type: string
                    description: 'Identifica de forma única  a conta do cliente, mantendo as regras de imutabilidade dentro da instituição transmissora.'
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    maxLength: 100
                    example: '92792126019929279212650822221989319252576'
                  subtype:
                    type: string
                    enum:
                      - INDIVIDUAL
                      - CONJUNTA_SIMPLES
                      - CONJUNTA_SOLIDARIA
                    description: |
                      Subtipo de conta (vide Enum):
                      Conta individual - possui um único titular
                      Conta conjunta simples - onde as movimentações financeiras só podem serem realizadas mediante autorização de TODOS os correntistas da conta.
                      Conta conjunta solidária - é a modalidade cujos titulares podem realizar movimentações de forma isolada, isto é, sem que seja necessária a autorização dos demais titulares
                    example: INDIVIDUAL
                  currency:
                    type: string
                    pattern: '^(\w{3}){1}$'
                    maxLength: 3
                    description: |
                      Moeda referente ao valor da transação, segundo modelo ISO-4217. p.ex. 'BRL'
                      Todos os saldos informados estão representados com a moeda vigente do Brasil
                    example: BRL
                additionalProperties: false
            accountBalances:
              type: array
              items:
                type: object
                description: |
                  Conjunto de informações das Contas de: depósito à vista, poupança e de pagamento pré-paga
                required:
                  - accountId
                  - availableAmount
                  - blockedAmount
                  - automaticallyInvestedAmount
                properties:
                  accountId:
                    type: string
                    description: 'Identifica de forma única  a conta do cliente, mantendo as regras de imutabilidade dentro da instituição transmissora.'
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    maxLength: 100
                    example: '92792126019929279212650822221989319252576'
                  availableAmount:
                    type: object
                    description: 'Saldo disponível para utilização imediata. No caso de conta de depósito a vista, sem considerar cheque especial e investimentos atrelados a conta. Expresso em valor monetário com no mínimo 2 casas e no máximo 4 casas decimais.'
                    required:
                      - amount
                      - currency
                    properties:
                      amount:
                        type: string
                        pattern: '^-?\d{1,15}\.\d{2,4}$'
                        maxLength: 21
                        minLength: 4
                        example: '1000.0400'
                        description: Valor relacionado ao objeto.
                      currency:
                        type: string
                        pattern: '^(\w{3}){1}$'
                        maxLength: 3
                        description: 'Moeda referente ao valor monetário, seguindo o modelo ISO-4217.'
                        example: BRL
                  blockedAmount:
                    type: object
                    description: 'Saldo bloqueado, não disponível para utilização imediata, por motivo de bloqueio apresentado para o cliente nos canais eletrônicos. Expresso em valor monetário com no mínimo 2 casas e no máximo 4 casas decimais.'
                    required:
                      - amount
                      - currency
                    properties:
                      amount:
                        type: string
                        pattern: '^\d{1,15}\.\d{2,4}$'
                        maxLength: 20
                        minLength: 4
                        example: '1000.0400'
                        description: Valor relacionado ao objeto.
                      currency:
                        type: string
                        pattern: '^(\w{3}){1}$'
                        maxLength: 3
                        description: 'Moeda referente ao valor monetário, seguindo o modelo ISO-4217.'
                        example: BRL
                  automaticallyInvestedAmount:
                    type: object
                    description: Saldo disponível com aplicação automática - corresponde a soma do saldo disponível acrescido do valor obtido a partir da aplicação automática. Expresso em valor monetário com no mínimo 2 casas e no máximo 4 casas decimais.
                    required:
                      - amount
                      - currency
                    properties:
                      amount:
                        type: string
                        pattern: '^\d{1,15}\.\d{2,4}$'
                        maxLength: 20
                        minLength: 4
                        example: '1000.0400'
                        description: Valor relacionado ao objeto.
                      currency:
                        type: string
                        pattern: '^(\w{3}){1}$'
                        maxLength: 3
                        description: 'Moeda referente ao valor monetário, seguindo o modelo ISO-4217.'
                        example: BRL
                additionalProperties: false
            accountTransactions:
              type: array
              items:
                type: object
                required:
                  - accountId
                  - transactionId
                  - completedAuthorisedPaymentType
                  - creditDebitType
                  - transactionName
                  - type
                  - transactionAmount
                  - transactionCurrency
                  - transactionDate
                properties:
                  accountId:
                    type: string
                    description: 'Identifica de forma única  a conta do cliente, mantendo as regras de imutabilidade dentro da instituição transmissora.'
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    maxLength: 100
                    example: '92792126019929279212650822221989319252576'
                  transactionId:
                    type: string
                    description: Código ou identificador único prestado pela instituição que mantém a conta para representar a transação individual.
                    minLength: 1
                    maxLength: 100
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
                  completedAuthorisedPaymentType:
                    type: string
                    description: |
                      Indicador de transação autorizada:
                      - Transação efetivada
                      - Lançamento futuro
                    enum:
                      - TRANSACAO_EFETIVADA
                      - LANCAMENTO_FUTURO
                    example: TRANSACAO_EFETIVADA
                  creditDebitType:
                    $ref: '#/components/schemas/EnumCreditDebitIndicator'
                  transactionName:
                    type: string
                    maxLength: 60
                    pattern: '[\w\W\s]*'
                    description: Campo livre que corresponde ao identificador da transação na instituição financeira
                    example: TRANSFCWAR5TXHCX5I9IDBHML8082N8NEO30M6LNNG7ANAYIJYRM00ZBZPU8
                  type:
                    type: string
                    description: |
                      Tipo de Transação
                    enum:
                      - TED
                      - DOC
                      - PIX
                      - TRANSFERENCIA_MESMA_INSTITUICAO
                      - BOLETO
                      - CONVENIO_ARRECADACAO
                      - PACOTE_TARIFA_SERVICOS
                      - TARIFA_SERVICOS_AVULSOS
                      - FOLHA_PAGAMENTO
                      - DEPOSITO
                      - SAQUE
                      - CARTAO
                      - ENCARGOS_JUROS_CHEQUE_ESPECIAL
                      - RENDIMENTO_APLIC_FINANCEIRA
                      - PORTABILIDADE_SALARIO
                      - RESGATE_APLIC_FINANCEIRA
                      - OPERACAO_CREDITO
                      - OUTROS
                    example: PIX
                  transactionAmount:
                    type: object
                    description: Valor da transação. Expressa em valor monetário com 4 casas decimais.
                    required:
                      - amount
                      - currency
                    properties:
                      amount:
                        type: string
                        pattern: '^\d{1,15}\.\d{2,4}$'
                        maxLength: 20
                        minLength: 4
                        example: '1000.0400'
                        description: Valor relacionado ao objeto.
                      currency:
                        type: string
                        pattern: '^(\w{3}){1}$'
                        maxLength: 3
                        description: 'Moeda referente ao valor monetário, seguindo o modelo ISO-4217.'
                        example: BRL
                    additionalProperties: false
                  transactionDate:
                    type: string
                    maxLength: 10
                    pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
                    description: |
                      Se indicador de transação:
                      TRANSACAO_EFETIVADA - corresponde a data de lançamento da transação
                      LANCAMENTO_FUTURO - corresponde a data prevista de efetivação da transação
                    example: '2021-01-07'
                  partieCnpjCpf:
                    type: string
                    maxLength: 14
                    pattern: '^\d{11}$|^\d{14}$'
                    description: |
                      Identificação da pessoa envolvida na transação, que pode ser a pagadora ou a recebedora, dependendo do tipo de lançamento. (Preencher com o CPF ou CNPJ, sem formatação)
                    example: '43908445778'
                  partiePersonType:
                    type: string
                    description: |
                      Identificação do Tipo de Pessoa da pessoa envolvida na transação.
                      Pessoa Natural - Informar CPF no campo “payerCnpjCpf”
                      Pessoa Jurídica - Informar CNPJ no campo “payerCnpjCpf”
                    enum:
                      - PESSOA_NATURAL
                      - PESSOA_JURIDICA
                    example: PESSOA_NATURAL
                  partieCompeCode:
                    type: string
                    maxLength: 3
                    pattern: '\d{3}$'
                    description: 'Código identificador atribuído pelo Banco Central do Brasil às instituições participantes do STR (Sistema de Transferência de reservas) referente à pessoa envolvida na transação. O número-código substituiu o antigo código COMPE. Todos os participantes do STR, exceto as Infraestruturas do Mercado Financeiro (IMF) e a Secretaria do Tesouro Nacional, possuem um número-código independentemente de participarem da Centralizadora da Compensação de Cheques (Compe). O campo tem a anotação “n/a” (“não se aplica”) para os participantes do STR aos quais não é atribuído um número-código'
                    example: '001'
                  partieBranchCode:
                    type: string
                    maxLength: 4
                    pattern: '\d{4}$'
                    description: 'Código da Agência detentora da conta da pessoa envolvida na transação. (Agência é a dependência destinada ao atendimento aos clientes, ao público em geral e aos associados de cooperativas de crédito, no exercício de atividades da instituição, não podendo ser móvel ou transitória)'
                    example: '6272'
                  partieNumber:
                    type: string
                    maxLength: 20
                    pattern: '^\d{8,20}$'
                    description: Número da conta da pessoa envolvida na transação
                    example: '67890854360'
                  partieCheckDigit:
                    type: string
                    maxLength: 1
                    pattern: '[\w\W\s]*'
                    description: Dígito da conta da pessoa envolvida na transação
                    example: '4'
                additionalProperties: false
            accountOverdraftLimits:
              type: array
              items:
                type: object
                description: |
                  Conjunto de informações da Conta de: depósito à vista
                required:
                  - accountId
                properties:
                  accountId:
                    type: string
                    description: 'Identifica de forma única  a conta do cliente, mantendo as regras de imutabilidade dentro da instituição transmissora.'
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                    maxLength: 100
                    example: '92792126019929279212650822221989319252576'
                  overdraftContractedLimit:
                    type: object
                    description: Valor do limite contratado do cheque especial.
                    required:
                      - amount
                      - currency
                    properties:
                      amount:
                        type: string
                        pattern: '^\d{1,15}\.\d{2,4}$'
                        maxLength: 20
                        minLength: 4
                        example: '1000.0400'
                        description: Valor relacionado ao objeto.
                      currency:
                        type: string
                        pattern: '^[A-Z]{3}$'
                        maxLength: 3
                        description: 'Moeda referente ao valor monetário, seguindo o modelo ISO-4217.'
                        example: BRL
                  overdraftUsedLimit:
                    type: object
                    description: Valor utilizado total do limite do cheque especial e o adiantamento a depositante.
                    required:
                      - amount
                      - currency
                    properties:
                      amount:
                        type: string
                        pattern: '^\d{1,15}\.\d{2,4}$'
                        maxLength: 20
                        minLength: 4
                        example: '1000.0400'
                        description: Valor relacionado ao objeto.
                      currency:
                        type: string
                        pattern: '^[A-Z]{3}$'
                        maxLength: 3
                        description: 'Moeda referente ao valor monetário, seguindo o modelo ISO-4217.'
                        example: BRL
                  unarrangedOverdraftAmount:
                    type: object
                    description: Valor de operação contratada em caráter emergencial para cobertura de saldo devedor em conta de depósitos à vista e de excesso sobre o limite pactuado de cheque especial.
                    required:
                      - amount
                      - currency
                    properties:
                      amount:
                        type: string
                        pattern: '^\d{1,15}\.\d{2,4}$'
                        maxLength: 20
                        minLength: 4
                        example: '1000.0400'
                        description: Valor relacionado ao objeto.
                      currency:
                        type: string
                        pattern: '^[A-Z]{3}$'
                        maxLength: 3
                        description: 'Moeda referente ao valor monetário, seguindo o modelo ISO-4217.'
                        example: BRL
                additionalProperties: false
    EnumCreditDebitIndicator:
      type: string
      description: |
        Indicador do tipo de lançamento:
        Débito (no extrato) Em um extrato bancário, os débitos, marcados com a letra “D” ao lado do valor registrado, informam as saídas de dinheiro na conta-corrente.
        Crédito (no extrato) Em um extrato bancário, os créditos, marcados com a letra “C” ao lado do valor registrado, informam as entradas de dinheiro na conta-corrente.
      enum:
        - CREDITO
        - DEBITO
      example: DEBITO
    EnumCreditCardAccountsLineName:
      type: string
      description: |
        Indica a classificação da transação informada.
      enum:
        - CREDITO_A_VISTA
        - CREDITO_PARCELADO
        - SAQUE_CREDITO_BRASIL
        - SAQUE_CREDITO_EXTERIOR
        - EMPRESTIMO_CARTAO_CONSIGNADO
        - OUTROS
      example: CREDITO_A_VISTA
    ResponseScore:
      type: object
      properties:
        score:
          type: integer
          description: Valor do score em um intervalo de 0 a 1000.
          example: 784
    ResponseError:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          maxItems: 13
          items:
            type: object
            required:
              - code
              - field
              - message
            properties:
              code:
                description: Código de erro específico do endpoint
                type: string
                pattern: '[\w\W\s]*'
                maxLength: 255
              field:
                description: O campo onde está ocorrendo o erro
                type: string
                pattern: '[\w\W\s]*'
                maxLength: 255
              message:
                description: Descrição legível deste erro específico
                type: string
                pattern: '[\w\W\s]*'
                maxLength: 2048
            additionalProperties: false
      additionalProperties: false
  responses:
    OKScore:
      description: This status code indicates that the request has succeeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseScore'
    BadRequest:
      description: 'A requisição foi malformada, omitindo atributos obrigatórios, seja no payload ou através de atributos na URL.'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    Forbidden:
      description: O token tem escopo incorreto ou uma política de segurança foi violada
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    Unauthorized:
      description: Cabeçalho de autenticação ausente/inválido ou token inválido
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    NotFound:
      description: O recurso solicitado não existe ou não foi implementado
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    MethodNotAllowed:
      description: O consumidor tentou acessar o recurso com um método não suportado
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    NotAcceptable:
      description: A solicitação continha um cabeçalho Accept diferente dos tipos de mídia permitidos ou um conjunto de caracteres diferente de UTF-8
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    TooManyRequests:
      description: 'A operação foi recusada, pois muitas solicitações foram feitas dentro de um determinado período ou o limite global de requisições concorrentes foi atingido'
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    UnprocessableEntity:
      description: A informação enviada não está em conformidade com alguma regra de negócio.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
    InternalServerError:
      description: Ocorreu um erro no gateway da API ou no microsserviço
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ResponseError'
  securitySchemes:
    OauthSecurityClient:
      flows:
        clientCredentials:
          scopes:
            read: client read scope
          tokenUrl: 'https://sandbox-api.serasaexperian.com.br/security/iam/v1/user-identities/login'
      type: oauth2
    OauthSecurityUser:
      flows:
        password:
          scopes:
            read: User read scope
          tokenUrl: 'https://sandbox-api.serasaexperian.com.br/security/iam/v1/user-identities/login'
      type: oauth2
