      CCAppReference:
        type: string
        description: Unique reference returned by Crosscore
        example: "4HLABCDEFG"
      CCAuthenticationAttempted:
        type: string
        description: TRUE/FALSE/ERROR, indicates whether or not the record was sent to Authenticate (e.g. business records are not sent)
        example: "TRUE"
      CCPrimaryDataSourceCount:
        type: integer
        description: Return number of primary data sources
        example: 0
      CCPrimaryDataItemCount:
        type: integer
        description: Return number of primary data items
        example: 0
      CCSecondaryDataSourceCount:
        type: integer
        description: Return number of secondary data sources
        example: 0
      CCSecondaryDataItemCount:
        type: integer
        description: Return number of secondary data items
        example: 0
      CCTriggeredRules:
        $ref: "#/definitions/KybDataCCRules"
      CrosscoreAttempted:
        type: string
        description: Whether crosscore call was made. True/Error/Timeout
        example: "True"
  KybDataCCAuthenticate:
    type: object
    additionalProperties: false
    properties:
      Decision:
        type: string
        description: >-
          <div>
              Will be one of:
            <ul>
              <li>AU01 --- Authenticated - Level 1</li>
              <li>AU02 --- Authenticated - Level 2</li>
              <li>NA00 --- Not Authenticated</li>
              <li>RA00 --- Refer</li>
            </ul>
          </div>
        example: "AU01"
      DecisionReason:
        type: string
        description: >-
          Text explaining the decision
          Note: This text cannot be more than 90 characters. Therefore, some messages may be truncated
        example: "Caution. One or more high-risk conditions applies to this request"
      Score:
        type: number
        format: double
        description: >-
          Between 0 and 90. Shows the confidence that the identity exists, with 90 being the highest confidence. 
          Values below 40 typically mean the identity cannot be authenticated
        example: 90
      Appreference:
        type: string
        description: Unique reference returned by Identity Authenticate
        example: "YMQLSTJ5JX"
      Rules:
        $ref: "#/definitions/KybDataCCRules"
      Matches:
        $ref: "#/definitions/KybDataCCMatches"
      Scores:
        $ref: "#/definitions/KybDataCCScores"
      Datacounts:
        $ref: "#/definitions/KybDataCCDatacounts"
      Warnings:
        $ref: "#/definitions/KybDataCCWarnings"
