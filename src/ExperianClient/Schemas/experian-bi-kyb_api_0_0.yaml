swagger: "2.0"
info:
  title: Know Your Business API
  description: >-
    <p>The Know Your Business (KYB) API provides information to support the risk assessment of 
    companies across a number of areas:</p>
    <ul>
      <li>Key Parties - Directors, Shareholders and UBOs</li>
      <li>Sectors - trading activity</li>
      <li>Locations - with coverage of site visits and shop-front imagery where available</li>
      <li>Geographies - associated countries</li>
      <li>PEPs, Sanctions and Adverse Media screening - UBOs, PSCs and directors</li>
      <li>Authentication - UBOs, PSCs and directors</li>
      <li>Fraud Screening - UBOs and PSCs</li>
      <li>AML Flags - Adverse Markers and Cashflow Profiles</li>
    </ul>
  version: 1.2.0
schemes:
  - https
host: sandbox-uk-api.experian.com
produces:
  - application/jsonsecurityDefinitions:
  OauthSecurity:
    type: oauth2
    flow: password
    tokenUrl: "https://sandbox-uk-api.experian.com/oauth2/v1/token"
    scopes:
      admin: admin scope
      user: user scope
paths:
  "/risk/business/v2/businesstargeter":
    get:
      summary: Business Search
      description: >-
        <div>
          Search Experian's UK Business database to return either the best matching business or a list of businesses to choose from. 
          You can then use a returned identifier (company number) to request additional business information from many of Experian's Business Information APIs.
          <br/><br/>
          Searches can be made using:
          <ul>
            <li>the business name only</li>
            <li>the business postcode</li>
            <li>the business identifiers (registration number or Experian non limited key)</li>
            <li>additional filters to qualify the search scope (registered/non registered, dissolved businesses)</li>
          </ul>
          Either business name or business reference must be supplied as part of the input. Geographic targeting can be done by including a name and a postcode in the search. To support more accurate matching, postcode is used rather than targeting by town, where ambiguity in town names can lead to mismatches.
          <br/><br/>
          The returned list of businesses will be limited to 25 entities and will be sorted initially on the following groupings:
          <ul>
            <li>Limited Companies</li>
            <li>Non-Limited Businesses</li>
            <li>Dissolved Limited Companies</li>
          </ul>
          Within each of the above groupings the results will be displayed in order of the highest match confidence first.
          <br/><br/>
          Where a request is submitted with a “BusinessRef", this is the only search criteria that will be used i.e. it will ignore input business name and/or business postcode.
          <br/><br/>
          Sample searches against name=TEST will work in the Sandbox.
        </div>
      operationId: BusinessSearch
      security:
        - OauthSecurity:
            - user
      produces:
        - application/json      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: businessref
          in: query
          description: >-
            Business reference (registered number or NonLimited URN) to be used
            in the search. Sample 99999999 or UI88888888
          required: false
          type: string
        - name: name
          in: query
          description: >-
            The name of the business to be targeted.


            Valid characters:

            ! “ £ * ( ) _ - + = { } : ; @ ‘ # | \ / ?


            Invalid characters that will cause the call to fail:

            $ % ^ [ ] ~ < >
          required: false
          type: string
          default: TEST
        - name: postcode
          in: query
          description: >-
            The postcode of the business to be targeted. Partial postcodes are supported (e.g. NG80). 
            Invalid postcodes (e.g. XX1 1XX) will cause no results to be returned
          required: false
          type: string
          maxLength: 8
          pattern: '([a-zA-Z0-9\ ])*'
        - name: phonenumber
          in: query
          description: The telephone number of the business to be targeted
          required: false
          type: string
        - name: searchcorporates
          default: "true"
          in: query
          description: >-
            Indicator showing whether to include limited businesses in the
            search (true = Include, false = Exclude)
          required: false
          type: string
          enum:
            - "true"
            - "false"
        - name: excludedissolved
          default: "true"
          in: query
          description: >-
            Indicator showing whether to include dissolved limited businesses in
            the search (true = Include, false = Exclude)
          required: false
          type: string
          enum:
            - "true"
            - "false"
        - name: searchnoncorps
          default: "false"
          in: query
          description: >-
            Indicator showing whether to include non-limited businesses in the
            search (true = Include, false = Exclude)
          required: false
          type: string
          enum:
            - "true"
            - "false"
      responses:
        "200":
          description: "An array of matching businesses, along with search results metadata"
          schema:
            $ref: "#/definitions/BusinessTargeterResponse"
        "400":
          description: Bad Request. Incorrect verb or path provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Unauthorized access. Invalid or Expired Token, or product not
            enabled against the account
          schema:
            $ref: "#/definitions/ErrorResponse"
        "406":
          description: Not Acceptable. Invalid headers provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/company/{BusinessRef}":
    get:
      summary: Business Profile
      description: >-
        <div>
          Returns summary information on a business including, identification,
          address and activity.
          <br/><br/>
          Sample searches against BusinessRef=99999999 or BusinessRef=UI88888888
          will work in the Sandbox.
        </div>
      operationId: BusinessProfile
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: BusinessRef
          in: path
          description: >-
            UK Companies House Registration Number (CRN) or Experian non limited
            key (prefixed with UI)
          required: true
          type: string
          minLength: 8
          maxLength: 10
      responses:
        "200":
          description: Successful response
          schema:
            $ref: "#/definitions/KYCProfile"
        "400":
          description: Request has bad syntax
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Basic or token authentication failed. The user does not have
            sufficient permission
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: CRN not found, it does not exist or is invalid
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: The server encountered an unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/registeredcompany/{RegNumber}/directors":
    get:
      summary: Directors
      description: >-
        <div>
          Returns a summary list of the directors and secretaries associated to a
          business.
          <br/><br/>
          Sample searches against RegNumber=99999999 will work in the Sandbox.
        </div>
      operationId: Directors
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: RegNumber
          in: path
          description: UK Companies House Registration Number (CRN)
          required: true
          type: string
      responses:
        "200":
          description: Successful response
          schema:
            $ref: "#/definitions/ManagementInfo"
        "400":
          description: Request has bad syntax
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Basic or token authentication failed. The user does not have
            sufficient permission
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: CRN not found, it does not exist or is invalid
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: The server encountered an unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/risk/business/v2/directortargeter":
    get:
      summary: Director Search
      description: >-
        <div>
          Search Experian's UK Business database to return a list of Directors and/or Secretaries.
          <br/><br/>
          Searches can be made using:
            <ul>
            <li>forename, middlenames and surname</li>
            <li>service address postcode</li>
            <li>flags qualifying the scope of the search (directors/secretaries).</li>
          </ul>
          The input request must contain at least a "forename", a "surname" and either the "directorsflag" or "secretaryflag" set to 'Y'. Geographic targeting can be done by including a postcode in the search. To support more accurate matching, postcode is used rather than targeting by town, where ambiguity in town names can lead to mismatches.
          <br/><br/>
          The list of results returned will be limited to 999.
          <br/><br/>
          Sample searches using forename=John and surname=Smith will return data in the Sandbox.
        </div>
      operationId: DirectorSearch
      security:
        - OauthSecurity:
            - user
      produces:
        - application/json      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: forename
          in: query
          description: Director's forename returned from the Director search
          required: false
          type: string
          default: John
        - name: middlenames
          in: query
          description: Director's middle names returned from the Director search
          required: false
          type: string
          default: William
        - name: surname
          in: query
          description: Director's surname returned from the Director search
          required: false
          type: string
          default: Smith
        - name: postcode
          in: query
          description: Director's address postcode
          required: false
          type: string
        - name: directorsflag
          in: query
          description: >-
            Indicator showing whether to include Directors in the search (true =
            Include, false = Exclude)
          required: false
          type: string
          enum:
            - "true"
            - "false"
          default: "true"
        - name: secretariesflag
          in: query
          description: >-
            Indicator showing whether to include Secretaries in the search (true
            = Include, false = Exclude)
          required: false
          type: string
          enum:
            - "true"
            - "false"
          default: "false"
      responses:
        "200":
          description: "An array of matching directors, along with search results metadata"
          schema:
            $ref: "#/definitions/DirectorTargeterResponse"
        "400":
          description: Bad Request. Incorrect verb or path provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Unauthorized access. Invalid or Expired Token, or product not
            enabled against the account
          schema:
            $ref: "#/definitions/ErrorResponse"
        "406":
          description: Not Acceptable. Invalid headers provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/registeredcompany/{RegNumber}/shareholders":
    get:
      summary: Shareholders
      description: >-
        <div>
          The shareholder endpoint returns a list of the company's direct shareholders as filed at Companies House.
          <br/><br/>
          Sample searches using RegNumber=99999999 will work in the Sandbox.
        </div>
      operationId: Shareholders
      security:
        - OauthSecurity:
            - user
      produces:
        - application/json      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: RegNumber
          in: path
          description: >-
            UK Companies House Registration Number (CRN); Sample RegNumber is
            99999999
          required: true
          default: "99999999"
          type: string
      responses:
        "200":
          description: Shareholding information
          schema:
            $ref: "#/definitions/Shareholders"
        "400":
          description: Bad Request. Incorrect parameters provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Unauthorized access. Invalid or Expired Token, or product not
            enabled against the account
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: Company not found
          schema:
            $ref: "#/definitions/ErrorResponse"
        "406":
          description: Not Acceptable. Invalid headers provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/registeredcompany/{RegNumber}/ubo":
    get:
      summary: Ultimate Beneficial Owner (UBO)
      description: >-
        <div>
          Provides access to Experian Ultimate Beneficial Owner (UBO) information
          for UK registered companies. Experian matches shareholder information
          filed at Companies House with directorship details, and provides a view
          of ownership across multiple tiers of the corporate targeted.
          <br/><br/>
          The UBO endpoint returns information about the company ownership structure (UBO summary information), as well as a list of all beneficial owners of the company with 10% or more holding (list of UBOs).</p>
          <ul>
            <li>UBO summary information will provide basic details on the capital structure, number 
            and complexity of the ownership structure, as well as any flags showing exception in the 
            ownership tree resolution.</li>
            <li>The list of UBO details provide information on all the shareholders in the tree. If 
            they are an individual they will appear if they own more than 10%, either by voting 
            rights or by value, in the root company. Entities which are not identified as individuals 
            will appear no matter their percentage holding.</li>
          </ul>
          Sample searches using RegNumber=99999999 will work in the Sandbox.
        </div>
      operationId: UBO
      security:
        - OauthSecurity:
            - user
      produces:
        - application/json      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: RegNumber
          in: path
          description: >-
            UK Companies House Registration Number (CRN); Sample RegNumber is
            99999999
          required: true
          default: "99999999"
          type: string
      responses:
        "200":
          description: Ownership summary and an array of UBOs associated with the business
          schema:
            $ref: "#/definitions/UBOResponse"
        "400":
          description: Bad Request. Incorrect parameters provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Unauthorized access. Invalid or Expired Token, or product not
            enabled against the account
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: Company not found
          schema:
            $ref: "#/definitions/ErrorResponse"
        "406":
          description: Not Acceptable. Invalid headers provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/company/{BusinessRef}/sectors":
    get:
      summary: Sectors
      description: >-
        <div>
          Returns information on the trading activity of the business from a number
          of difference sources.
          <br/><br/>
          Sample searches against BusinessRef=99999999 or BusinessRef=UI88888888
          work in the Sandbox.
        </div>
      operationId: IndustrySectors
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: BusinessRef
          in: path
          description: >-
            UK Companies House Registration Number (CRN) or Experian non limited
            key (prefixed with UI)
          required: true
          type: string
          minLength: 8
          maxLength: 10
      responses:
        "200":
          description: Successful response
          schema:
            $ref: "#/definitions/KYCSectors"
        "400":
          description: Request has bad syntax
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Basic or token authentication failed. The user does not have
            sufficient permission
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: CRN not found, it does not exist or is invalid
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: The server encountered an unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/company/{BusinessRef}/locations":
    get:
      summary: Locations
      description: >-
        <div>
          Collates and identifies information on all the sites related to a
          business e.g. head office, branch, warehousing.
          <br/><br/>
          Sample searches against BusinessRef=99999999 will work in the Sandbox.
        </div>
      operationId: Locations
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: BusinessRef
          in: path
          description: >-
            UK Companies House Registration Number (CRN). Experian non limited
            key (prefixed with UI) are not supported at this stage
          required: true
          type: string
          minLength: 8
          maxLength: 10
      responses:
        "200":
          description: Successful response
          schema:
            $ref: "#/definitions/KYCLocations"
        "400":
          description: Request has bad syntax
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Basic or token authentication failed. The user does not have
            sufficient permission
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: CRN not found, it does not exist or is invalid
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: The server encountered an unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/company/{BusinessRef}/geographies":
    get:
      summary: Geographies
      description: >-
        <div>
          Returns a list of countries that are associated with the business and
          key stakeholders.
          <br/><br/>
          Sample searches against BusinessRef=99999999 will work in the Sandbox.
        </div>
      operationId: Geographies
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: BusinessRef
          in: path
          description: >-
            UK Companies House Registration Number (CRN). Experian non limited
            key (prefixed with UI) are not supported at this stage
          required: true
          type: string
          minLength: 8
          maxLength: 10
      responses:
        "200":
          description: Successful response
          schema:
            $ref: "#/definitions/KYCGeographies"
        "400":
          description: Request has bad syntax
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Basic or token authentication failed. The user does not have
            sufficient permission
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: CRN not found, it does not exist or is invalid
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: The server encountered an unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/company/{BusinessRef}/datasources":
    get:
      summary: Data Sources
      description: >-
        <div>
          Returns a list of data sources that have contributed to the business
          data.
          <br/><br/>
          Sample searches against BusinessRef=99999999 will work in the Sandbox.
        </div>
      operationId: DataSources
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: BusinessRef
          in: path
          description: >-
            UK Companies House Registration Number (CRN). Experian non limited
            key (prefixed with UI) are not supported at this stage
          required: true
          type: string
          minLength: 8
          maxLength: 10
      responses:
        "200":
          description: Successful response
          schema:
            $ref: "#/definitions/KYCDataSources"
        "400":
          description: Request has bad syntax
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Basic or token authentication failed. The user does not have
            sufficient permission
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: CRN not found, it does not exist or is invalid
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: The server encountered an unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/ldc/{LDCID}":
    get:
      summary: LDC Last Visit Date
      description: >-
        <div>
          Using the LDC ID obtained from the data sources endpoint, this returns the date the location was last visited by an LDC agent. Endpoint name was previously known as LDC but the URL has not changed.
          <br/><br/>
          Sample searches against LDCID=1234 will work in the Sandbox.
        </div>
      operationId: LDCBase
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: LDCID
          in: path
          description: LDC Identifier, obtained from the datasources endpoint
          required: true
          type: string
      responses:
        "200":
          description: Successful response
          schema:
            $ref: "#/definitions/LDCBase"
        "400":
          description: Request has bad syntax
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Basic or token authentication failed. The user does not have
            sufficient permission
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: CRN not found, it does not exist or is invalid
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: The server encountered an unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/ldc/{LDCID}/msb":
    get:
      summary: Money Service Bureau (MSB)
      description: >-
        <div>
          Using the LDC ID obtained from the data sources endpoint, this returns a flag indicating if a Money Service Business (MSB) was identified.
          <br/><br/>
          Sample searches against LDCID=1234 will work in the Sandbox.
        </div>
      operationId: LDCMSB
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: LDCID
          in: path
          description: LDC Identifier, obtained from the datasources endpoint
          required: true
          type: string
      responses:
        "200":
          description: Successful response
          schema:
            $ref: "#/definitions/LDCMSB"
        "400":
          description: Request has bad syntax
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Basic or token authentication failed. The user does not have
            sufficient permission
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: CRN not found, it does not exist or is invalid
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: The server encountered an unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/ldc/{LDCID}/imageurl":
    get:
      summary: Shopfront Picture
      description: >-
        <div>
          Using the LDC ID obtained from the data sources endpoint, this returns a URL of an image of the business's shopfront showing the trading address in jpeg format.
          <br/><br/>
          Sample searches against LDCID=1234 will work in the Sandbox.
        </div>
      operationId: LDCImage
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json          required: true
          type: string
        - name: LDCID
          in: path
          description: LDC Identifier, obtained from the datasources endpoint
          required: true
          type: string
      responses:
        "200":
          description: Successful response
          schema:
            $ref: "#/definitions/LDCImage"
        "400":
          description: Request has bad syntax
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Basic or token authentication failed. The user does not have
            sufficient permission
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: CRN not found, it does not exist or is invalid
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: The server encountered an unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/people/kybdata":
    post:
      summary: KYB Data People
      description: >-
        <div>
          This endpoint allows you to pass in details of individuals and to screen and authenticate them. Screening is done against Lexis Nexis datasets and will return any potential PEPs, Sanctions or Adverse Media matches found for that person; authentication uses Experian’s CrossCore platform and will return an authentication score.
          <br/><br/>
          Additional licensing is needed for both screening and authentication elements, with clients able to take either service or both together. Individual configuration on a per client basis is required before this endpoint can be used.
          <br/><br/>
          The data included in the API response will depend on the client configuration. 
        </div>
      security:
        - OauthSecurity:
            - user
      produces:
        - application/json      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json
          required: true
          type: string
        - name: Content-Type
          in: header
          description: Format expected for the response
          type: string
          enum:
            - application/json
        - name: body
          in: body
          description: Details of business to query
          required: true
          schema:
            $ref: "#/definitions/KybDataPeopleRequestBody"
      responses:
        "200":
          description: Successful response
          schema:
            $ref: "#/definitions/KybDataPeopleResponse"
        "400":
          description: Bad Request. Incorrect parameters provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Unauthorized access. Invalid or Expired Token, or product not
            enabled against the account
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: Company not found
          schema:
            $ref: "#/definitions/ErrorResponse"
        "406":
          description: Not Acceptable. Invalid headers provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/ErrorResponse"
  "/compliance/business/v1/company/kybdata":
    post:
      summary: KYB Data Company
      description: >-
        <div>
          Provides a summary of a business and matching to third party data sources to verify business existence. AML flags can also be requested which returns Adverse Markers and Cashflow Profile hits associated to the business. Business key parties (UBO, PSC and Directors) will be retrieved for the specified business, which can be screened against Lexis Nexis datasets and will return any potential PEPs, Sanctions or Adverse Media matches found for that person; authentication and fraud checks using Experian’s CrossCore platform can be carried out returning scoring and fraud flags.
          <br/><br/>
          Individual configuration on a per client basis is required to use this endpoint. The data included in the API response will depend on this configuration.
          <br/><br/>
          Additional licensing is needed for Lexis Nexis, CrossCore and Hunter usage.
        </div>
      security:
        - OauthSecurity:
            - user
      produces:
        - application/json      parameters:
        - name: Accept
          in: header
          description: Format expected for the response
          enum:
            - application/json
          required: true
          type: string
        - name: Content-Type
          in: header
          description: Format expected for the response
          type: string
          enum:
            - application/json
        - name: body
          in: body
          description: Details of business to query
          required: true
          schema:
            $ref: "#/definitions/KybDataRequestBody"
      responses:
        "200":
          description: Successful response
          schema:
            $ref: "#/definitions/KybDataResponse"
        "400":
          description: Bad Request. Incorrect parameters provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: >-
            Unauthorized access. Invalid or Expired Token, or product not
            enabled against the account
          schema:
            $ref: "#/definitions/ErrorResponse"
        "404":
          description: Company not found
          schema:
            $ref: "#/definitions/ErrorResponse"
        "406":
          description: Not Acceptable. Invalid headers provided
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/ErrorResponse"
definitions:
  KYCProfile:
    type: object
    additionalProperties: false
    properties:
      BusinessRef:
        description: >-
          Registration Number for registered businesses, and Experian non
          limited Key (prefixed with UI + 8 digits) for non registered
          businesses
        type: string
      LegalStatus:
        description: "L for registered businesses, N for non registered businesses"
        type: string
      Name:
        description: Business name
        type: string
      RegisteredOffice:
        description: "Registered office address, for limited companies only"
        $ref: "#/definitions/KYCProfileAddress"
      TradingLocation:
        description: "Trading address, for both registered and non-registered companies"
        $ref: "#/definitions/KYCProfileAddress"
      PrincipalActivities:
        description: Text description of the Principal Activities of the limited company
        type: string
      IncorporationDate:
        description: Incorporation Date (yyyy-mm-dd)
        type: string
      EarliestKnownDate:
        description: >-
          The earliest date when this associated non-limited business became
          known to Experian (yyyy-mm-dd)
        type: string
      DissolutionDate:
        description: Dissolution Date (yyyy-mm-dd)
        type: string
      URL:
        description: URL for the website of the business
        type: string
      TradingStatus:
        description: A (Active) or D (Dissolved)
        type: string
      LegalEntityType:
        description: Indicator showing the legal status of the limited company
        type: string
      TelephoneNumber:
        description: Business telephone number
        type: string
  KYCSectors:
    type: object
    additionalProperties: false
    properties:
      BusinessRef:
        description: Registration Number for registered businesses
        type: string
      LegalStatus:
        description: "L for registered businesses [Non registered are not supported yet]"
        type: string
      Sectors:
        description: List of Sectors of the company
        type: array
        items:
          $ref: "#/definitions/KYCSectorsItems"
  KYCDataSources:
    type: object
    additionalProperties: false
    properties:
      BusinessRef:
        description: Registration Number for registered businesses
        type: string
      LegalStatus:
        description: "L for registered businesses [Non registered are not supported yet]"
        type: string
      DataSources:
        description: List of data sources providing the company information
        type: array
        items:
          $ref: "#/definitions/KYCDataSourcesItems"
  KYCGeographies:
    type: object
    additionalProperties: false
    properties:
      BusinessRef:
        description: Registration Number for registered businesses
        type: string
      LegalStatus:
        description: "L for registered businesses [Non registered are not supported yet]"
        type: string
      Geographies:
        description: List of countries linked to the company
        type: array
        items:
          $ref: "#/definitions/KYCGeographiesItems"
  KYCLocations:
    type: object
    additionalProperties: false
    properties:
      BusinessRef:
        description: Registration Number for registered businesses
        type: string
      LegalStatus:
        description: "L for registered businesses [Non registered are not supported yet]"
        type: string
      Locations:
        description: List of trading locations
        type: array
        items:
          $ref: "#/definitions/KYCLocationsItems"
  BusinessTargeterResponse:
    type: object
    additionalProperties: false
    properties:
      SearchSummary:
        $ref: "#/definitions/SearchSummary"
      SearchResults:
        items:
          $ref: "#/definitions/SearchResults"
        type: array
  ErrorResponse:
    additionalProperties: false
    type: object
    properties:
      Error:
        type: object
        properties:
          Code:
            type: integer
            description: API error response code
          Message:
            type: string
            description: API error message
          InternalError:
            type: string
            description: Additional information to support Experian investigation of issues
          MoreInfo:
            type: string
            description: Additional information to support developers
  SICInfo:
    type: object
    additionalProperties: false
    properties:
      CodeType:
        type: string
        description: >-
          Indicator showing which SIC Code is used in the following fields -
          A=1980; B=1992
      SICCode:
        type: string
        description: The SIC code for the business returned from the Business search
      Description:
        type: string
        description: The SIC description for the business returned from the Business search
  SearchResults:
    type: object
    additionalProperties: false
    properties:
      LegalStatus:
        type: string
        description: >-
          Legal status of business returned from the Business search (L =
          Limited; N = Non Limited)
      BusinessRef:
        type: string
        description: >-
          Business reference (Registerd number / URN) of the business returned
          from the Business search
      CommercialName:
        type: string
        description: Commercial name of the business returned from the Business search
      BusinessLocation:
        $ref: "#/definitions/BusinessLocation"
      SICInformation:
        $ref: "#/definitions/SICInfo"
      BusinessStatus:
        type: string
        description: >-
          Status of the business returned from the Business search. 'A' =
          Active; 'D' = Dissolved; ' ' = unknown
      BusinessActivities:
        type: string
        description: >-
          Main Activities derived from Thomson category code of the business
          returned from the Business search (Non Limited businesses only)
      Name:
        type: string
        description: >-
          Business name returned from the Business search where a name other
          than the current registered name contributed to the matching
      NameType:
        type: string
        description: >-
          Name type for result returned from the Business search. 'RC' =
          Registered name (current); 'RP' = Previous registered name; 'TC' =
          Trading name (limited); 'NL' = Trading name (non-limited)
      MatchedPhoneNumber:
        type: string
        description: >-
          Matched telephone number of the business returned from the Business
          search
      MatchedPostcode:
        type: string
        description: Matched post code of the business returned from the Business search
  SearchSummary:
    type: object
    additionalProperties: false
    properties:
      NumberMatches:
        type: integer
        description: Number of matches returned from the Business search
      BusinessRef:
        type: string
        description: Business reference returned from the Business search
      BusinessName:
        type: string
        description: Business name returned from the Business search
      PhoneNumber:
        type: string
        description: Business telephone number returned from the Business search
      Town:
        type: string
        description: Business post town returned from the Business search
      Postcode:
        type: string
        description: Business post code returned from the Business search
  BusinessLocation:
    type: object
    additionalProperties: false
    properties:
      LocationLine1:
        type: string
        description: Address line 1 of the business returned from the Business search
      LocationLine2:
        type: string
        description: Address line 2 of the business returned from the Business search
      LocationLine3:
        type: string
        description: Address line 3 of the business returned from the Business search
      LocationLine4:
        type: string
        description: Address line 4 of the business returned from the Business search
      LocationLine5:
        type: string
        description: Address line 5 of the business returned from the Business search
      Postcode:
        type: string
        description: Post code of the business returned from the Business search
  Business_Search_response_example:
    type: object
    description: >-
      <div>
        <p>
          This is an example of a JSON response provided for a business search.
        </p>

        <div class="row">
          The response is split in 2 sections:
          <li>A Search summary section which plays back the search terms</li>
          <li>A Search results section which provides an array of the matching search results</li>
        </div>

        <div class='row'>
          <pre>
      {
        "SearchSummary": {
          "NumberMatches": 0,
          "BusinessRef": "string",
          "BusinessName": "string",
          "PhoneNumber": "string",
          "Town": "string",
          "Postcode": "string"
        },
        "SearchResults": [
          {
            "LegalStatus": "string",
            "BusinessRef": "string",
            "CommercialName": "string",
            "BusinessLocation": {
              "LocationLine1": "string",
              "LocationLine2": "string",
              "LocationLine3": "string",
              "LocationLine4": "string",
              "LocationLine5": "string",
              "Postcode": "string"
            },
            "SICInformation": {
              "CodeType": "string",
              "SICCode": "string",
              "Description": "string"
            },
            "BusinessStatus": "string",
            "BusinessActivities": "string",
            "Name": "string",
            "NameType": "string",
            "MatchedPhoneNumber": "string",
            "MatchedPostcode": "string"
          }
        ]
      }
          </pre>
        </div>
      </div>
  Business_Search_error_example:
    type: object
    description: >-
      <div>
         <p>This is a 400 error example; other errors follow the same structure.</p>
         <pre>
         {
             "Error": {
                  "Code": 400,
                  "Message": "Extra request parameters unknown. Mandatory parameters [], Optional [name, searchcorporates, excludedissolved, searchnoncorps, businessref, town, postcode, phonenumber, rmc]",
                  "MoreInfo": "Please see https://developer.experian.co.uk"
             }
         }
         </pre>
      </div>
  UBOResponse:
    type: object
    additionalProperties: false
    properties:
      RegNumber:
        type: string
        description: Registration number of the root company
      AnnualReturnsDate:
        type: string
        description: Annual returns date for the root company
      LatestReturnsInTreeDate:
        type: string
        description: >-
          Latest annual returns date for any company in the ownernship tree.
          This will be the same or more recent than AnnualReturnsDate
      TotIndValPercAccounted:
        type: number
        format: double
        description: Total value percentage held by individuals in the corporate tree
      TotValPercAccountedExcCos:
        type: number
        format: double
        description: >-
          Total value percentage held by entities at the end of the corporate
          tree
      TotIndVotPercAccounted:
        type: number
        format: double
        description: Total voting percentage held by individuals in the corporate tree
      TotVotPercAccountedExcCos:
        type: number
        format: double
        description: >-
          Total voting percentage held by entities at the end of the corporate
          tree
      ForeignCompany:
        type: string
        description: Y/N flag if the corporate tree contains a foreign company
      UnregisteredCompany:
        type: string
        description: Y/N flag if the corporate tree contains an unregistered company
      NoOfTiers:
        type: number
        format: double
        description: number of tiers in the corporate tree
      CircularOwnership:
        type: string
        description: >-
          Y/N flag if the corporate tree contains a circular reference i.e. a
          company in the tree owns itself at another point in the tree
      PLCDetected:
        type: string
        description: >-
          Y/N flag if the corporate tree contains a PLC based on the legal
          status code of any of the registration numbers in the tree
      NumberOfShareholders:
        type: number
        format: double
        description: Total number of distinct shareholders in the corporate tree
      MultipleCurrencies:
        type: string
        description: >-
          Y/N flag if any of the companies in the corporate tree have shares in
          multiple currencies
      MultipleShareClasses:
        type: string
        description: >-
          Y/N flag if any of the companies in the corporate tree have multiple
          share issues
      NomineesDetected:
        type: string
        description: >-
          Y/N flag if any shareholder in the corporate tree contains Nominees in
          the first name middle name or surname fields
      BulkListDetected:
        type: string
        description: >-
          Y/N flag if any shareholder in the corporate tree contains Bulk list
          in the first name middle name or surname fields
      PendingDetected:
        type: string
        description: >-
          Y/N flag if any shareholder in the corporate tree contains Pending in
          the first name middle name or surname fields
      SurnameContainsPending:
        type: string
        description: >-
          Y/N flag if any shareholder in the corporate tree contains Nominees
          Pending in the surname field
      SurnameContainsNominees:
        type: string
        description: >-
          Y/N flag if any shareholder in the corporate tree contains Nominees in
          the surname field
      SurnameContainsBulkList:
        type: string
        description: >-
          Y/N flag if any shareholder in the corporate tree contains  Bulk list
          in the surname field
      TrustPartCharityInName:
        type: string
        description: >-
          Y/N flag if any shareholder in the corporate tree contains Trust
          Partnership or Charity in the surname field
      MissingFirstname:
        type: string
        description: Y/N flag if an individual shareholder has a missing first name
      JointShareholders:
        type: string
        description: >-
          Y/N flag if any shareholder in the corporate tree has a joint
          shareholding
      ValueCalculationImpossible:
        type: string
        description: >-
          Y/N flag if the value calculation cannot be made (Value percentage
          owned is not known for a shareholder in the tree There is circular
          ownership A registration number in the tree has no known shareholders
          Total value percentage held by individuals in the corporate tree is
          not between 99 and 101%)
      VotingCalculationImpossible:
        type: string
        description: >-
          Y/N flag if the voting calculation cannot be made (similar reasons as
          above)
      DissolvedCompanyInTree:
        type: string
        description: Y/N flag if any of the companies in the corporate tree are dissolved
      UBOs:
        type: array
        items:
          $ref: "#/definitions/ubo"
  ubo:
    type: object
    additionalProperties: false
    properties:
      Tstamp:
        type: string
        format: date
        description: System date when the record was created
      AnnualReturnsDate:
        type: string
        description: Annual returns date associated with the shareholder
      ShareholderType:
        type: string
        description: >-
          C - Company with valid registration number / O - Foreign company where
          known / X - Company without a registration number or with an invalid
          registration number / I - Individual
      DirectorURN:
        type: string
        description: >-
          Unique reference number identifying the individual if they are a
          director
      ShareholderID:
        type: string
        description: >-
          Unique reference number identifying the shareholder. Either a
          registration number (for companies) a Director unique reference number
          (for directors) or a generated ID (other shareholders)
      Title:
        type: string
        description: Title of the shareholder
      Forename:
        type: string
        description: First name of the shareholder
      MiddleName:
        type: string
        description: Middle name of the shareholder
      Surname:
        type: string
        description: Surname of the shareholder
      NameSuffix:
        type: string
        description: Name suffix of the shareholder
      DateOfBirth:
        type: string
        description: Date of birth where the shareholder is a director
      ForeignAddressIndicator:
        type: string
        description: Foreign address flag where the shareholder is a director
      Nationality:
        type: string
        description: Nationality of the director
      JobTitle:
        type: string
        description: Job title of the director
      ServiceAddress:
        $ref: "#/definitions/ServiceAddress"
      CompanyNumber:
        type: string
        description: Registration number of the shareholder
      CompanyName:
        type: string
        description: Name of the shareholder if it is a company
      RegisteredAddress:
        $ref: "#/definitions/RegisteredAddress"
      ShLegalStatus:
        type: string
        description: Legal status of the shareholder if it is a company
      JointPercentOfValue:
        type: number
        format: double
        description: >-
          Percent of value held by the shareholder; in the case of joint
          shareholders each is assigned the full percent of value of the joint
          shareholding
      JointPercentOfVotes:
        type: number
        format: double
        description: >-
          Percent of voting held by the shareholder; in the case of joint
          shareholders each is assigned the full percent of voting rights of the
          joint shareholding
      JointShareholderFlag:
        type: string
        description: >-
          Y/N flag indicating if the this UBO has join ownership with another
          shareholder
      SIC1992_1:
        type: string
        description: SIC code of the shareholder if it is a company
      SIC1992_2:
        type: string
        description: SIC code of the shareholder if it is a company
      SIC1992_3:
        type: string
        description: SIC code of the shareholder if it is a company
      SIC1992_4:
        type: string
        description: SIC code of the shareholder if it is a company
      SIC1992_5:
        type: string
        description: SIC code of the shareholder if it is a company
      SIC1992_6:
        type: string
        description: SIC code of the shareholder if it is a company
      SIC1992_7:
        type: string
        description: SIC code of the shareholder if it is a company
      SIC1992_8:
        type: string
        description: SIC code of the shareholder if it is a company
      SIC1992_9:
        type: string
        description: SIC code of the shareholder if it is a company
      SIC1992_10:
        type: string
        description: SIC code of the shareholder if it is a company
      IndividualPercentOfValue:
        type: number
        format: double
        description: >-
          Percent of value held by the shareholder; in the case of joint
          shareholders the percent of value is divided equally between the joint
          shareholders
      IndividualPercentOfVotes:
        type: number
        format: double
        description: >-
          Percent of voting held by the shareholder; in the case of joint
          shareholders the percent of voting rights is divided equally between
          the joint shareholders
  RegisteredAddress:
    type: object
    properties:
      LocationLine1:
        type: string
        description: Registered address of the root company
      LocationLine2:
        type: string
        description: Registered address of the root company
      LocationLine3:
        type: string
        description: Registered address of the root company
      LocationLine4:
        type: string
        description: Registered address of the root company
      LocationLine5:
        type: string
        description: Registered address of the root company
      Town:
        type: string
        description: Registered address of the root company
      County:
        type: string
        description: Registered address of the root company
      Postcode:
        type: string
        description: Registered address of the root company
  ServiceAddress:
    type: object
    properties:
      HouseName:
        type: string
        description: Service address of the director
      HouseNumber:
        type: string
        description: Service address of the director
      Street:
        type: string
        description: Service address of the director
      District:
        type: string
        description: Service address of the director
      County:
        type: string
        description: Service address of the director
      Postcode:
        type: string
        description: Service address of the director
      Town:
        type: string
        description: Service address of the director
  Ultimate_Beneficial_Owners_response_example:
