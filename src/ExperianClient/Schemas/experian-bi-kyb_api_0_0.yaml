        example: "3843fced-8414-46f3-8d9f-472d09bdadf5"
      Rules:
        $ref: "#/definitions/KybDataCCRules"
      Matches:
        $ref: "#/definitions/KybDataCCMatches"
      Scores:
        $ref: "#/definitions/KybDataCCScores"
      Warnings:
        $ref: "#/definitions/KybDataCCWarnings"
  KybDataCCRules:
    type: array
    items:
      type: object
      properties:
        RuleId:
          type: string
          description: Rule ID
          example: "U155"
        RuleName:
          type: string
          description: Name of the Rule item
          example: "AUTP_IDCONFLEVEL"
        RuleScore:
          type: number
          format: double
          description: Rule score
          example: 1
        RuleText:
          type: string
          description: Text of the rule
          example: "The identity supplied has been confirmed at the required 'Level 1'"
    description: "Return all rules that have been hit"
    example:
      - RuleId: "U155"
        RuleName: "AUTP_IDCONFLEVEL"
        RuleScore: 1
        RuleText: "The identity supplied has been confirmed at the required 'Level 1'"
