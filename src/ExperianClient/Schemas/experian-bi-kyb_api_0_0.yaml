          </pre>
        </div>
      </div>
  Ultimate_Beneficial_Owners_error_example:
    type: object
    description: >-
      <div>
         <p>This is a 400 error example when we've provided a Registration Number that has an invalid format; other errors follow the same structure.</p>
         <pre>
         {
             "Error": {
                  "Code": 400,
                  "Message": "Invalid URL or Verb specifed.",
                  "MoreInfo": "Please see documentation at https://developer.experian.co.uk."
             }
         }
         </pre>
      </div>
  KybDataPeopleRequestBody:
    type: object
    properties:
      Firstname:
