        example: "Y"
      NoUKDirIncorp:
        type: string
        description: All directors were of non-UK nationality and residency at the point of incorporation
        example: "N"
      HighRiskDirIncorp:
        type: string
        description: All directors were nationals and residents of a high risk jurisdiction at the point of incorporation
        example: "Y"
      NoUKDir:
        type: string
        description: All current directors are of non-UK nationality and residency
        example: "N"
      HighRiskDir:
        type: string
        description: All current directors are nationals and residents of a high risk jurisdiction
        example: "Y"
      NoUKPsc:
        type: string
        description: All current PSCs are of non-UK nationality and residency
        example: "N"
      HighRiskPsc:
        type: string
        description: All current PSCs are nationals and residents of a high risk jurisdiction
        example: "Y"
      NoUKUbo:
        type: string
        description: All current UBOs are of non-UK nationality and residency
        example: "N"
      HighRiskUbo:
        type: string
        description: All current UBOs are nationals and residents of a high risk jurisdiction
        example: "Y"
      NoUKKp:
        type: string
        description: All key parties (directors, UBOs, PSCs) are of non-UK nationality and residency
        example: "N"
      HighRiskKp:
        type: string
        description: All key parties (directors, UBOs, PSCs) are of high-risk nationality and residency
        example: "Y"
      MultiJurDirIncorp:
        type: string
        description: There were 3 or more directors at incorporation, across which at least 3 countries were represented based on nationality and country of residence
        example: "N"
      MultiJurDir:
        type: string
        description: There are 3 or more current directors and across these, at least 3 countries are represented based on nationality and country of residence
        example: "Y"
      DirHighVolCos:
        type: string
        description: At least 1 director has over 100 directorships
        example: "N"
      ConflictingDirCoR:
        type: string
        description: At least 1 director has a conflicting country of residence across their active directorships
        example: "Y"
      ConflictingDirNat:
        type: string
        description: At least 1 director has a conflicting nationality across their active directorships
        example: "N"
      ConflictingDirDoB:
        type: string
        description: At least 1 director has a conflicting date of birth across their active directorships
        example: "Y"
      ConsistentOverPerformance:
        type: string
        description: The company’s credit turnover (monthly inflows) is consistently higher than expected for a company in its peer group (3 standard deviations or higher from the peer group average, over a 6 month period)
        example: "N"
      FastMoneyMovement:
        type: string
        description: The company’s credit and debit turnover (monthly inflows and outflows respectively) are closely aligned, implying that funds go into the account and subsequently leave the account in a short time period
        example: "Y"
      LowAverageBalance:
        type: string
        description: The company’s average balance for a given month is lower than expected for a company in the same peer group
        example: "N"
      RoundTransactionsLatestMonth:
        type: string
        description: Flag indicating that a current account associated with the company has a round value for credit turnover in the most recent reporting month ( i.e. £100,000, £1,000,000)
        example: "Y"
      RoundTransactionsLatestYear:
        type: string
        description: Percentage of months in the past year for which round values have been reported for credit turnover for at least 1 current account associated with the company
        example: "N"
      RoundTransactionsFull:
        type: string
        description: Percentage of months across all months available for the company for which round values have been reported for credit turnover for at least 1 current account associated with the company
        example: "Y"
      MisalignedInflows:
        type: string
        description: The annual inflows for a given accounting period are misaligned with the turnover reported in the filed accounts for the same period
        example: "N"
      MultipleCurrentAccounts:
        type: string
        description: Flag indicating that the business has more than 1 active current account
        example: "Y"
      MultipleBanks:
        type: string
        description: Flag indicating that the business has active current accounts with more than 1 bank
        example: "N"
      MultipleBanksNewIncorp:
        type: string
        description: Flag indicating that the business incorporated in the past 3 months and has active current accounts with more than 1 bank
        example: "Y"
      TradingWhilstDormant:
        type: string
        description: Transaction activity has been observed in CATO data whilst the company has been reported to be dormant
        example: "N"
      BusinessActivities:
        type: object
        properties:
          Sic07:
            type: string
            description: Code of the sector provided by the UK Standard Industrial Classification of Economic Activities of the revised classification system 2007
            example: "12345"
          Sic07Description:
            type: string
            description: Description of the SIC07 code
            example: "Other human health activities"
          Sic92:
            type: string
            description: Code of the sector provided by the UK Standard Industrial Classification of Economic Activities of the classification system 1992
            example: "7415"
          Sic92Description:
            type: string
            description: Description of the SIC92 code
            example: "Other human health activities"
          ThomsonCode:
            type: string
            description: Code of the sector provided by Thomson Reuters Business Classification system
            example: "17020"
          ThomsonCodeDescription:
            type: string
            description: Description of the Thomson code
            example: "Charities & Voluntary Organisations"
          MarketLocationCode:
            type: string
            description: Code of the sector with respect to the specific Market it belongs to
            example: "0328"
          MarketLocationCodeDescription:
            type: string
            description: Description of the Market Location Code
            example: "Charities and Charitable Organisations"
