  BusinessSearch_response_example:
    type: object
    description: >-
      <div>
        <p>
          This is an example of a JSON response provided for a business search.
        </p>

        <div class="row">
          The response is split in 2 sections:
          <li>A Search summary section which plays back the search terms</li>
          <li>A Search results section which provides an array of the matching search results</li>
        </div>

        <div class='row'>
          <pre>
      {
        "SearchSummary": {
          "NumberMatches": 0,
          "BusinessRef": "string",
          "BusinessName": "string",
          "PhoneNumber": "string",
          "Town": "string",
          "Postcode": "string"
        },
        "SearchResults": [
          {
            "LegalStatus": "string",
            "BusinessRef": "string",
            "CommercialName": "string",
            "BusinessLocation": {
              "LocationLine1": "string",
              "LocationLine2": "string",
              "LocationLine3": "string",
              "LocationLine4": "string",
              "LocationLine5": "string",
              "Postcode": "string"
            },
            "SICInformation": {
              "CodeType": "string",
              "SICCode": "string",
              "Description": "string"
            },
            "BusinessStatus": "string",
            "BusinessActivities": "string",
            "Name": "string",
            "NameType": "string",
            "MatchedPhoneNumber": "string",
            "MatchedPostcode": "string"
          }
        ]
      }
          </pre>
        </div>
      </div>
  BusinessSearch_error_example:
    type: object
    description: >-
      <div>
         <p>This is a 400 error example; other errors follow the same structure.</p>
         <pre>
         {
             "Error": {
                  "Code": 400,
                  "Message": "Extra request parameters unknown. Mandatory parameters [], Optional [name, searchcorporates, excludedissolved, searchnoncorps, businessref, postcode, phonenumber]",
                  "MoreInfo": "Please see https://developer.experian.co.uk"
             }
