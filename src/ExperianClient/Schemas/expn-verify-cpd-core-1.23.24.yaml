swagger: '2.0'
info:
  version: 1.0.0
  title: Experian Verify Core (CPD Client-Hosted)
  description: >-
    This document consists of version 1 connectors endpoints. Returns a consumer’s most recent employment record found (regardless of work status) within the current + 2 previous years.
host: us-ev-api.experian.com
basePath: /consumerservices/evcpd/v1
securityDefinitions:
  OauthSecurity:
    type: oauth2
    flow: password
    tokenUrl: 'https://us-api.experian.com/oauth2/v1/token'
    scopes:
      admin: admin scope
      user: user scope
schemes:
  - https
paths:
  '/widget':
    post:
      description: >-
        Returns the widget URL Id.
      summary: Widget URL,token,expiration and Report ID
      operationId: get Widget URL,token,expiration and Report ID
      tags:
        - CPD Service
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: clientReferenceId
          in: header
          required: true
          description: >-
            API client generated reference Id to uniquely identify the  transaction.
          type: string
        - name: Content-Type
          in: header
          required: true
          type: string
          description: Input Request format
          enum:
            - application/json
          default: application/json
        - name: Accept
          in: header
          required: true
          type: string
          description: Output Response format
          enum:
            - application/json
          default: application/json
        - name: body
          in: body
          description: >-
            Request to API.
          required: true
          schema:
            $ref: '#/definitions/CPDRequestParams'
      responses:
        '200':
          description: API responds with a JSON.
          schema:
            $ref: '#/definitions/CPDResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            transactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            transactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/AuthenticationErrorResponse'
        '403':
          description: Forbidden.
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            transactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '405':
          description: Method not Allowed
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '406':
          description: Not Acceptable
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '415':
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '429':
          description: Too many requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: bad gateway.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '503':
          description: Service Unavailable.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '504':
          description: Gateway Timeout.
          schema:
            $ref: '#/definitions/ErrorResponse'
  '/status':
    post:
      description: >-
        Returns the Session Status of the Transaction.
      summary: CPD status of a given Report ID
      operationId: get the status of the Experian Report id
      tags:
        - CPD Service
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: clientReferenceId
          in: header
          required: true
          description: >-
            API client generated reference Id to uniquely identify the  transaction.
          type: string
        - name: Content-Type
          in: header
          required: true
          type: string
          description: Input Request format
          enum:
            - application/json
          default: application/json
        - name: Accept
          in: header
          required: true
          type: string
          description: Output Response format
          enum:
            - application/json
          default: application/json
        - name: body
          in: body
          description: >-
            Request to API
          required: true
          schema:
            $ref: '#/definitions/CPDStatusRequestParams'
      responses:
        '200':
          description: API responds with a JSON.
          schema:
            $ref: '#/definitions/CPDStatusResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            transactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            transactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/AuthenticationErrorResponse'

        '403':
          description: Forbidden.
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            transactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '405':
          description: Method not Allowed
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '406':
          description: Not Acceptable
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '415':
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '429':
          description: Too many requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: bad gateway.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '503':
          description: Service Unavailable.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '504':
          description: Gateway Timeout.
          schema:
            $ref: '#/definitions/ErrorResponse'
  
  '/evreport':
    post:
      description: >-
        Returns the verify report for a given Report ID.
      summary: CPD Report for a given Report ID
      operationId: Get the report based on given Report ID
      tags:
        - CPD Service
      security:
        - OauthSecurity:
            - user
      parameters:
        - name: clientReferenceId
          in: header
          required: true
          description: >-
            API client generated reference Id to uniquely identify the  transaction.
          type: string
        - name: Content-Type
          in: header
          required: true
          type: string
          description: Input Request format
          enum:
            - application/json
          default: application/json
        - name: Accept
          in: header
          required: true
          type: string
          description: Output Response format
          enum:
            - application/json
          default: application/json
        - name: body
          in: body
          description: >-
            Request to API.
          required: true
          schema:
            $ref: '#/definitions/CPDStatusRequestParams'
      responses:
        '200':
          description: API responds with a JSON.
          schema:
            $ref: '#/definitions/voieResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            transactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            transactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/AuthenticationErrorResponse'

        '403':
          description: Forbidden.
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
            transactionId:
              description: Unique ID generated by Experian for this API request
              type: string
        '405':
          description: Method not Allowed
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '406':
          description: Not Acceptable
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '415':
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            clientReferenceId:
              description: >-
                Echo back of the reference Id , if provided on API request
                header
              type: string
        '429':
          description: Too many requests
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal Server Error.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: bad gateway.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '503':
          description: Service Unavailable.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '504':
          description: Gateway Timeout.
          schema:
            $ref: '#/definitions/ErrorResponse'

definitions:
  voieResponse:
    type: object
    properties:
      expVerifyReport:
        $ref: '#/definitions/consumerReportResponse'
      pdfbytes:
        type: string
        description: pdf bytes array base 64 encoding
  consumerReportResponse:
    type: object
    description: Response information for consumer body
    properties:
      reportId:
        type: string
        description: unique id given to consumer report
      reportType:
        type: string
        description: type of verification report
        enum:
            - ExpVerify-Core
        default: ExpVerify-Core
      reportGeneratedDate:
        type: string
        description: report created date by experian (unixtimestamp)
      requestor:
        $ref: '#/definitions/Requestor'
      resellerInfo:
        $ref: '#/definitions/ResellerInfo'
      reportCustomLabels:
        $ref: '#/definitions/reselleroptionsList'
      consumerPii:
        $ref: '#/definitions/PIIList'
  PIIList:
    type: object
    description: Personally Identifiable Information
    properties:
      applicantInformation:
        $ref: '#/definitions/ApplicantResponse'
      employmentHistory:
        type: array
        description : contains consumers employer information
        items:
           $ref: '#/definitions/employmentHistoryList'
  PANameResponse:
    type: object
    description: Consumer's Name
    properties:
      lastName:
        type: string
        description: >-
          Last Name given in data provider report
      firstName:
        type: string
        description: >-
          First Name given in data provider report
      middleName:
        type: string
        description: >-
          Middle Name given in data provider report
      generationCode:
        type: string
        description: Generation Code
        default: ""
  SSNResponse:
    type: object
    description: Consumer's Social Security Number
    properties:
      ssn:
        type: string
        description: Social Security Number

  DOBResponse:
    type: object
    description: Consumer's Date of Birth
    properties:
      dob:
        type: string
        description: date of birth

  ApplicantResponse:
    type: object
    description: Applicant Information
    properties:
      name:
        $ref: '#/definitions/PANameResponse'
      ssn:
        $ref: '#/definitions/SSNResponse'
      dob:
        $ref: '#/definitions/DOBResponse'
      phone:
        type: array
        items:
          $ref: '#/definitions/Phone'
      currentAddress:
        $ref: '#/definitions/Address'
    required:
      - name
      - dob
      - ssn
      - currentAddress
  employmentHistoryList:
    type: object
    description: contains employment history details
    properties:
      asOfDate:
        type: string
        description: Date on which the employer record was last updated
      originReportId:
        type: string
        description: Unique id provided by data provider
      originSourceId:
        type: string
        description: Internal use only – will be returned as a null value 
      employerIdentificationNumber:
        type: string
        description: Federal employer Identification Number (FEIN)
      employerName:
        type: string
        description: Employer’s name
      originalHireDate:
        type: string
        description: date on which employee was hired. ex 01012009 (MMDDYYYY) 8 digits. 
      mostRecentHireDate :
        type: string
        description: most recent date on which employee was hired. ex 01012009 (MMDDYYYY) 8 digits.
      positionTitle:
        type: string
        description: Job title or type of business
        default: string
      positionTenure:
        type: number
        format: double
        description: Duration of employment within position. Format will be returned in ISO 8601. ex P3Y6M4D represents a duration of three years, six months, four days. 
        default: "P2Y11M9D"
      employerAddress:
        $ref: '#/definitions/employerAddressFields'
      employmentStatus:
        $ref: '#/definitions/employmentstatus'
      workStatus:
        $ref: '#/definitions/workstatus'
      employerDisclaimers :
        type: string
        description: >-
          Employer-provided disclaimers will appear if vailable. Disclaimers can be returned as a larger text data up to 4k.

  workstatus:
    type: object
    description: >-
      employee work status (A = Active, I = Inactive, L = On Leave, R = Retired, N = Not Available)
    properties:
      name:
        type: string
        description: >-
          name - Active, Inactive, On Leave, Retired, Not Available
      code:
        type: string
        description: >-
          code - A, I, L, R, N
  employmentstatus:
    type: object
    description: >-
      employment type (i.e. Full-time, part-time, regular, temp, contractor)
    properties:
      name:
        type: string
        description: >-
           Full or Part Time Employer could enter a freeform text to denote a worker level name for the employee. When ingesting the JSON response please account for unexpected or new values being returned as more data providers are added to the Experian Verify service.
      code:
        type: string
        description: >-
          F= Full Time P = Part Time Employer could enter a freeform text to denote a worker level name for the employee. Code will start with the first letter of the text provided.  When ingesting the JSON response please account for unexpected or new values being returned as more data providers are added to the Experian Verify service.
  employerAddressFields:
    type: object
    description : contains employer address data elements
    properties:
      lineOne:
        type: string
        description: employer address street address
      lineTwo:
        type: string
        description: employer address street address
      lineThree:
        type: string
        description: employer address street address
      cityName:
        type: string
        description: employer address city field
      state:
        type: string
        description: employer address postal code
      countryCode:
        type: string
        description: employer address country code
      postalCode:
        type: string
        description: employer address postal code



  AuthenticationErrorResponse:
    type: object
    properties:
      errors:
        type: array
        minLength: 1
        items:
          $ref: '#/definitions/AuthenticationError'
  AuthenticationError:
    type: object
    description: Error Response
    properties:
      errorCode:
        type: string
        description: Client friendly message explaining the error
      message:
        type: string
        description: Experian generated code for this error

  ErrorResponse:
    type: object
    properties:
      errors:
        type: array
        minLength: 1
        items:
          $ref: '#/definitions/Error'
  Error:
    type: object
    description: Error Response
    properties:
      errorCode:
        type: string
        description: Client friendly message explaining the error
      message:
        type: string
        description: Experian generated code for this error
      errorType:
        type: string
        description: To identify the type of error if that is Api Validation or Backend Error.
  CPDStatusRequestParams:
    type: object
    description: CPD Request Body
    required:
      - reportId
    properties:
      reportId:
        type: string
        description: >-
          Report ID is a unique id returned by Experian as part of the widget API.
        default: 'UUID'
  CPDRequestParams:
    type: object
    description: CPD Request Body
    required:
      - consumerPii
      - requestor
      - reportType
      - permissiblePurpose
    properties:
      consumerPii:
        $ref: '#/definitions/PII'
      requestor:
        $ref: '#/definitions/Requestor'
      permissiblePurpose:
        $ref: '#/definitions/PermissiblePurpose'
      resellerInfo:
        $ref: '#/definitions/ResellerInfo'
      reportType:
        type: string
        description: report type for say VOI, VOE.
        enum:
          - ExpVerify-Premium
          - ExpVerify-Plus
          - ExpVerify-Core
        default: ExpVerify-Core
      vendorData:
        $ref: '#/definitions/VendorData'
      customOptions:
        $ref: '#/definitions/CustomOptions'
      reportCustomLabels:
        $ref: '#/definitions/reselleroptionsList'
  reselleroptionsList:
    type: object
    properties:
      label1:
        $ref: '#/definitions/customfield1'
      label2:
        $ref: '#/definitions/customfield2'
      label3:
        $ref: '#/definitions/customfield3'
      label4:
        $ref: '#/definitions/customfield4'
      label5:
        $ref: '#/definitions/customfield5'

  customfield1:
    type: object
    description : custom fields
    properties:
      name:
        type: string
        description: name
      value:
        type: string
        description: custom field value
  customfield2:
    type: object
    description : custom fields
    properties:
      name:
        type: string
        description: name
      value:
        type: string
        description: custom field value
  customfield3:
    type: object
    description : custom fields
    properties:
      name:
        type: string
        description: name
      value:
        type: string
        description: custom field value

  customfield4:
    type: object
    description: custom fields
    properties:
      name:
        type: string
        description: name
      value:
        type: string
        description: custom field value

  customfield5:
    type: object
    description : custom fields
    properties:
      name:
        type: string
        description: name
      value:
        type: string
        description: custom field value

  PermissiblePurpose:
    type: object
    description: >-
      Specifies information on why this credit inquiry is being submitted This
      is used to denote the purpose type, terms, and amount.
    required:
      - type
    properties:
      type:
        type: string
        description: >-
          Permissible Purpose Type Code. 2 digits containing the account type
          code only.
        default: '18'

  PII:
    type: object
    description: Personally Identifiable Information
    properties:
      applicantInformation:
        $ref: '#/definitions/Applicant'
    required:
      - applicantInformation
  PAName:
    type: object
    description: Consumer's Name
    properties:
      lastName:
        type: string
        description: >-
          The full applicant's surname is required. If the surname contains two
          surnames, then split the surnames with a hyphen (e.g., Smith-Jones).
          The surname can also be input with an apostrophe (e.g., O'Brien),
          although apostrophe usage is limited to the letters D, L, and O.
        default: CONSUMER
      firstName:
        type: string
        description: >-
          The full first name is required. The minimum entry is the first name
          initial. Blanks and special characters (except dash) are not allowed.
          Compound names should contain a dash (e.g., Billy-Bob).
        default: JOHN
      middleName:
        type: string
        description: >-
          The full middle name should be entered when available. A middle
          initial is acceptable. Blanks and special characters are not allowed.
          Omit if the middle name is not available.
        default: QUINCY
      generationCode:
        type: string
        description: Generation Code
        default: Sr
    required:
      - firstName
      - lastName
  Address:
    type: object
    description: Consumer's Address
    properties:
      line1:
        type: string
        description: Address Line 1
        default: '10655 N BIRCH ST'
      line2:
        type: string
        description: Address Line 2
      line3:
        type: string
        description: Address Line 2
        default: ' '
      city:
        type: string
        description: City
        default: BURBANK
      state:
        type: string
        description: State
        default: CA
      zipCode:
        type: string
        description: ZIP Code
        default: '915021234'
    required:
      - zipCode
      - line1
      - city
      - state
  DOB:
    type: object
    description: Consumer's Date of Birth
    properties:
      dob:
        type: string
        description: >-
          Year Of Birth or Date of Birth. This describes year of birth of the
          primary applicant. It must be 4 (YYYY) or 8 (MMDDYYYY) digits.
        default: '10181955'
    required:
      - dob
  SSN:
    type: object
    description: Consumer's Social Security Number
    properties:
      ssn:
        type: string
        description: Social Security Number
        default: '123456789'
    required:
      - ssn
  EMAIL:
    type: object
    description: Consumer's Email ID
    properties:
      email:
        type: string
        description: Consumer Email ID
        default: 'example@experian.com'
    required:
      - email
  Phone:
    type: object
    description: Consumer's Phone
    properties:
      number:
        type: string
        description: Phone Number
        default: 818.555.1111
      type:
        type: string
        description: Phone Type
        default: R
  Applicant:
    type: object
    description: Applicant Information to get CPD
    properties:
      name:
        $ref: '#/definitions/PAName'
      ssn:
        $ref: '#/definitions/SSN'
      email:
        $ref: '#/definitions/EMAIL'
      dob:
        $ref: '#/definitions/DOB'
      phone:
        type: array
        items:
          $ref: '#/definitions/Phone'
      currentAddress:
        $ref: '#/definitions/Address'
    required:
      - name
      - dob
      - ssn
      - currentAddress
  Requestor:
    type: object
    description: Information on the API requestor
    properties:
      subscriberCode:
        type: string
        description: Subscriber Number assigned by Experian
        default: '5991764'
      verifierName:
        type: string
        description: the company name of verifier (ex. the name of the lender)
        default: 'experian'
    required:
      - subscriberCode
      - verifierName
  VendorData:
    type: object
    description: >-
      Optional field. To understand who's application the client is using to send in the inquiry - Vendor, 3rd Party, Reseller, or client home grown.
    properties:
      vendorNumber:
        type: string
        description: Optional. Alpha-numeric. Must be 3 Character long.
        default: 1.00
      vendorVersion:
        type: string
        description: Optional. Alpha-numeric with dot(.). Max length is 6.
  ResellerInfo:
    type: object
    description : contains consumers employer information
    properties:
      endUserName:
        type: string
        description: reseller endusername
  CustomOptions:
    type: object
    description: >-
      Ancillary Options such as ICRAA (Client custom options if any that have
      been setup) that can be requested by client.
    properties:
      optionId:
        type: array
        items:
          type: string
          description: Custom option id

  CPDStatusResponse:
    type: object
    description: CPD Response Body
    required:
      - status
      - reportId
    properties:
      status:
        type: string
        description: Transaction Status
        default: 'Initiated'
        enum:
         - Initiated
         - Not Ready
         - Report Ready
      reportId:
        type: string
