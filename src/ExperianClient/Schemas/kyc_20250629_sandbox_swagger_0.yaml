        value:
          maxLength: 40
          type: string
          nullable: true
          example: MATCH
      additionalProperties: false
    Name:
      required:
        - firstName
        - surName
      type: object
      properties:
        id:
          maxLength: 40
          type: string
          nullable: true
          example: MAINPERSONNAME_1
        type:
          enum:
            - CURRENT
            - PREVIOUS
            - MAIDEN
            - ALIAS
            - OTHER
            - FATHER
            - HUSBAND
            - NAME
            - NAME_NATIVE
          type: string
          description: Only the first occurrence of a name of type CURRENT will be considered. Failure to include a Name of this type will result in an error as no Name information will be used at all
          example: CURRENT
        title:
          maxLength: 15
          pattern: '^[-a-zA-Z0-9 '',]*$'
          type: string
          nullable: true
          example: MR
        firstName:
          maxLength: 40
          minLength: 1
          pattern: '^[-a-zA-Z0-9 üéöáíäóßÜÉÖÁÍÄÓ‘’\-,'']*$'
          type: string
          example: FRANK
        middleNames:
          maxLength: 100
          pattern: '^[-a-zA-Z0-9 üéöáíäóßÜÉÖÁÍÄÓ‘’\-,'']*$'
          type: string
          nullable: true
          example: SIMON
        surName:
          maxLength: 40
          minLength: 1
          pattern: '^[-a-zA-Z0-9 üéöáíäóßÜÉÖÁÍÄÓ‘’\-,'']*$'
          type: string
          nullable: true
          example: SMITH
        namePrefix:
          maxLength: 20
          type: string
          nullable: true
          example: PROFESSOR
        nameSuffix:
          maxLength: 20
          pattern: '^[-a-zA-Z0-9 '',]*$'
          type: string
          nullable: true
          example: JR
        initials:
          maxLength: 15
          pattern: '^[-a-zA-Z0-9 \'',]*$'
          type: string
          nullable: true
          example: F S
        nameCode:
          enum:
            - P
            - E
            - T
            - O
          type: string
          description: Types of Person Name Codes for Aliases
          example: E
      additionalProperties: false
    Options:
