components:
  schemas:
    Address:
      type: object
      properties:
        id:
          maxLength: 40
          type: string
          nullable: true
          example: MAINADDRESS_1
        addressType:
          enum:
            - CURRENT
            - PREVIOUS
            - PRIMARY
            - SECONDARY
            - REGISTERED_OFFICE
            - TRADING
            - CORRESPONDANCE
            - LINKED
            - RISK
            - GARAGE
            - INSPECTION_ADDRESS
            - INCIDENT_LOCATION
            - INSURED_ADDRESS
            - BILLING
            - DELIVERY
            - COLLATERAL
            - FINANCED
            - SERVICE
            - SUPPLY
            - STORE_ADDRESS
          type: string
          description: A type for this Address - Only the first occurrence of an Address having AddressType of CURRENT will be considered. Failure to include an Address of such a type will likely cause an error as not Address information will be used at all
          example: CURRENT
        addressIdentifier:
          maxLength: 20
          type: string
          nullable: true
          example: A1234
        indicator:
          enum:
            - RESIDENTIAL
            - COMMERCIAL
            - NON_RESIDENTIAL
            - OTHER
            - UNKNOWN
            - RURAL
            - URBAN
            - DELIVERY_SERVICE
          type: string
          description: Types of Address Indicator
          example: RESIDENTIAL
        poBoxNumber:
          maxLength: 40
          type: string
          nullable: true
          example: PO BOX 1234
        subBuilding:
          maxLength: 40
          pattern: '^[-a-zA-Z0-9 ./-]*$'
          type: string
          nullable: true
          example: The Barn
        buildingName:
          maxLength: 40
          pattern: '^[-a-zA-Z0-9 üéöáíäóßÜÉÖÁÍÄÓ&.!,‘’\-]*$'
          type: string
          nullable: true
          example: Sycamore Farm
        buildingNumber:
          maxLength: 10
          pattern: '^[-a-zA-Z0-9 ./-]*$'
          type: string
          nullable: true
          example: '78'
        street:
          maxLength: 50
          pattern: '^[-a-zA-Z0-9 ''.,/#]+$'
          type: string
          nullable: true
          example: Acacia Avenue
        street2:
          maxLength: 50
          pattern: '^[-a-zA-Z0-9 ''.,/#]*$'
          type: string
          nullable: true
          example: Honeysuckle Lane
        county:
          maxLength: 40
          pattern: '^[-a-zA-Z0-9àáâäèéêëìíîïòóôöùúûüÀÁÂÄÈÉÊËÌÍÎÏÒÓÔÖÙÚÛÜ&\.!,-]+$'
          type: string
          nullable: true
          example: Greater London
        postTown:
          maxLength: 40
          pattern: '^[-a-zA-Z0-9 àáâäèéêëìíîïòóôöùúûüÀÁÂÄÈÉÊËÌÍÎÏÒÓÔÖÙÚÛÜ&\.!,-]*$'
          type: string
          nullable: true
          example: London
        postal:
          maxLength: 10
          pattern: '^[a-zA-Z0-9]+$'
          type: string
          nullable: true
          example: SE1 8EZ
        countryCode:
          maxLength: 3
          pattern: '^[a-zA-Z]*$'
          type: string
          nullable: true
          example: GBR
        locality:
          maxLength: 40
          pattern: '^[-a-zA-Z0-9 àáâäèéêëìíîïòóôöùúûüÀÁÂÄÈÉÊËÌÍÎÏÒÓÔÖÙÚÛÜ&\.!,-]*$'
          type: string
          nullable: true
          example: South London
        subLocality:
          maxLength: 40
          type: string
          nullable: true
        stateProvinceCode:
          maxLength: 10
          type: string
          nullable: true
        residentFrom:
          $ref: '#/components/schemas/ResidentFrom'
        residentTo:
          $ref: '#/components/schemas/ResidentTo'
        timeAtAddress:
          $ref: '#/components/schemas/TimeAtAddress'
      additionalProperties: false
    Applicant:
      required:
        - consent
      type: object
      properties:
        id:
          maxLength: 40
          type: string
          nullable: true
          example: MAINAPPLICANT_1
        type:
          enum:
            - INDIVIDUAL
            - JOINT
            - COMMERCIAL
            - POLICY_HOLDER
            - MAIN_DRIVER
            - ADD_DRIVER
            - CLAIMANT
          type: string
          description: Types of Application
          example: INDIVIDUAL
        applicantType:
          enum:
            - APPLICANT
            - CO_APPLICANT
            - GUARANTOR
            - MAIN_APPLICANT
            - JOINT_APPLICANT
            - ADDITIONAL_CARDHOLDER
            - APPLYING_ORGANIZATION
            - DIRECTOR
            - COMPANY_SECRETARY
            - POLICY_HOLDER
            - ADDITIONAL_DRIVER
            - CLAIMANT
            - POLICY_HOLDER_ORGANIZATION
            - CLAIMANT_ORGANIZATION
            - CO_APPLICANT_ORGANIZATION
            - GUARANTOR_ORGANIZATION
            - OWNER_PERSON
            - OWNER_ORGANIZATION
            - REFERENCE
            - SHAREHOLDER
            - GUARANTOR_FULL
          type: string
          description: Types of Person
          example: APPLICANT
        consent:
          type: boolean
          example: true
        consentId:
          maxLength: 128
          pattern: '^[-a-zA-Z0-9 _]*$'
          type: string
          nullable: true
          example: uyciydfoudqwg912863017
        consentTimeStamp:
          type: string
          format: date-time
          nullable: true
          example: '2016-11-30T14:20:04Z'
        contactId:
          maxLength: 40
          type: string
          nullable: true
          example: MAINCONTACT_1
        knownCustomer:
          type: boolean
          nullable: true
          example: true
      additionalProperties: false
    Application:
      type: object
      properties:
        applicants:
          type: array
          items:
            $ref: '#/components/schemas/Applicant'
          nullable: true
      additionalProperties: false
    AuditLog:
      type: object
      properties:
        eventType:
          maxLength: 50
          type: string
          nullable: true
          example: JourneyStart
        eventDate:
          type: string
          format: date-time
          example: '2015-11-30T14:20:04Z'
        eventDateTime:
          type: string
          format: date-time
          example: '2015-11-30T14:20:04Z'
        eventOutcome:
          type: string
          nullable: true
      additionalProperties: false
    ClientResponsePayload:
      type: object
      properties:
        orchestrationDecisions:
          type: array
          items:
            $ref: '#/components/schemas/OrchestrationDecision'
          nullable: true
        decisionElements:
          type: array
          items:
            $ref: '#/components/schemas/DecisionElements'
          nullable: true
      additionalProperties: false
    Contact:
      type: object
      properties:
        id:
          maxLength: 40
          type: string
          nullable: true
          example: MAINCONTACT_1
        person:
          $ref: '#/components/schemas/Person'
        addresses:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Address'
          nullable: true
        identityDocuments:
          type: array
          items:
            $ref: '#/components/schemas/IdentityDocument'
          nullable: true
        telephones:
          type: array
          items:
            $ref: '#/components/schemas/Telephone'
          nullable: true
      additionalProperties: false
    ControlOption:
      type: object
      properties:
        option:
          type: string
          description: Any string value is accepted.
          nullable: true
          example: KYC_CLIENTTIERVERSION
        value:
          maxLength: 20
          type: string
          nullable: true
      additionalProperties: false
    DataCount:
      type: object
      properties:
        name:
          maxLength: 90
          type: string
          nullable: true
          example: NoOfMatches
        value:
          type: number
          format: double
          example: 3
      additionalProperties: false
    Decision:
      type: object
      properties:
        element:
          maxLength: 100
          type: string
          nullable: true
          example: Element Name
        value:
          maxLength: 40
          type: string
          nullable: true
          example: ACCEPT
        reason:
          maxLength: 90
          type: string
          nullable: true
          example: No Risk Detected
      additionalProperties: false
    DecisionElements:
      type: object
      properties:
        decisionReason:
          type: string
          nullable: true
          example: basic-rules-matrix
        serviceName:
          maxLength: 40
          type: string
          nullable: true
          example: UK-AgeVerify
        applicantId:
          maxLength: 40
          type: string
          nullable: true
          example: APPLICANT_1
        decision:
          maxLength: 20
          type: string
          nullable: true
          example: ACCEPT
        score:
          type: number
          format: double
          example: 999
        appReference:
          maxLength: 100
          type: string
          nullable: true
          example: REF123456
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
          nullable: true
        warningsErrors:
          type: array
          items:
            $ref: '#/components/schemas/WarningOrError'
          nullable: true
        otherData:
          nullable: true
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
          nullable: true
        dataCounts:
          type: array
          items:
